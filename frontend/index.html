<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <title>Learnation Workers</title>
    <style>
        /* ABSOLUTE TYPOGRAPHY FORCE */
        html,
        body,
        #root,
        #root *,
        [class*="font-"] {
            font-family: 'Inter', sans-serif !important;
            font-style: normal !important;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-bold,
        .font-semibold,
        .font-black,
        .font-medium,
        b,
        strong,
        th,
        [class*="font-bold"],
        [class*="font-semibold"],
        [class*="font-black"],
        [class*="font-medium"] {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            letter-spacing: -0.02em !important;
        }

        p,
        span,
        div,
        button,
        input,
        label,
        a,
        li,
        td {
            font-weight: 300 !important;
            letter-spacing: -0.01em !important;
        }

        /* Remove italics force */
        i,
        em,
        .italic,
        [class*="italic"] {
            font-style: normal !important;
        }

        .primary-font {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .secondary-font {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
