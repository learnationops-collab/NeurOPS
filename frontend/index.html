    <title>Learnation Adquisitions</title>
    <style>
        /* ABSOLUTE TYPOGRAPHY FORCE — :not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *) en cada
           selector: el Closer Workspace (CloserWorkflowPage.jsx, raíz con class="bg-v6"), Workshop
           Intelligence (WorkshopDashboardPage.jsx, raíz con class="ws-shell"), el Editor de curso
           (CourseEditorPage.jsx, raíz con class="ce-shell") y el Dashboard comercial
           (pages/comercial/DashboardComercial.jsx, raíz con class="dc-shell", design system
           Learnation) usan Montserrat, no Inter (mismo patrón:
           reskin calcado de una referencia visual externa, y Inter/Montserrat tienen métricas de
           letra distintas aunque coincidan peso y tamaño). Sin esta exclusión, este `!important` le
           hubiera ganado igual a cualquier font-family que se declare para `.bg-v6`/`.ws-shell`/
           `.ce-shell`/`.dc-shell` más abajo / en workshop-intel.css / course-editor.css /
           learnation-ds.css. */
        html,
        body,
        #root,
        #root *:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        [class*="font-"]:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *) {
            font-family: 'Inter', sans-serif !important;
            font-style: normal !important;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }

        /* :not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *) en cada selector de estos dos
           bloques: el rediseño "v6/v7" del Workspace de Closers, el reskin de Workshop Intelligence
           y el Dashboard comercial (design system Learnation: pesos 700/800/900 y tracking propios
           en .ln-* y estilos inline) definen sus propios pesos explícitos
           (700/800/900, sin !important) para que números y títulos se vean gruesos. Este <style> del
           <head> (carga antes que cualquier CSS de Vite/Tailwind) tiene la MISMA regla duplicada en
           index.css — ahí también se excluyó — pero como este bloque vive en el HTML y no en el CSS
           bundleado, ganaba igual pase lo que pase: confirmado con getComputedStyle en el navegador,
           .tud-pct-v6 (font-weight:900 en su propia clase) computaba 400 con las dos reglas presentes
           y solo la de index.css excluida. Sin esta segunda exclusión, TODO el bloque reskineado (números
           del hero, tarjetas, navegación, etc.) se ve más fino que la referencia, porque casi todos esos
           elementos son <div>/<span>/<button>/<h3>. */
        h1:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        h2:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),

        .font-bold:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        .font-semibold:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        .font-black:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        .font-medium:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        b:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        strong:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        th:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        [class*="font-bold"]:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        [class*="font-semibold"]:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        [class*="font-black"]:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        [class*="font-medium"]:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *) {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif !important;

            letter-spacing: -0.02em !important;

        p:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        span:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        div:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        button:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        input:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        label:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        a:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        li:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *),
        td:not(.bg-v6):not(.bg-v6 *):not(.ws-shell):not(.ws-shell *):not(.ce-shell):not(.ce-shell *):not(.dc-shell):not(.dc-shell *):not(.thalamus):not(.thalamus *):not(.lg):not(.lg *) {
            font-weight: 400 !important;
            letter-spacing: -0.005em !important;
        }

        /* Remove italics force */
        i,
        em,
        .italic,
        [class*="italic"] {
            font-style: normal !important;
        }

        .primary-font {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .secondary-font {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
