<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Plus+Jakarta+Sans:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <title>Learnation Workers</title>
    <style>
        /* ABSOLUTE TYPOGRAPHY FORCE */
        html,
        body,
        #root,
        #root *,
        [class*="font-"] {
            font-family: 'Inter', sans-serif !important;
            font-style: normal !important;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }

        /* :not(.bg-v6 *) en cada selector de estos dos bloques: el rediseño "v6/v7" del Workspace
           de Closers (CloserWorkflowPage.jsx, raíz con class="bg-v6") define sus propios pesos
           explícitos (700/800/900, sin !important, calcados de una referencia visual) para que
           números y títulos se vean gruesos. Este <style> del <head> (carga antes que cualquier
           CSS de Vite/Tailwind) tiene la MISMA regla duplicada en index.css — ahí también se
           excluyó — pero como este bloque vive en el HTML y no en el CSS bundleado, ganaba igual
           pase lo que pase: confirmado con getComputedStyle en el navegador, .tud-pct-v6
           (font-weight:900 en su propia clase) computaba 400 con las dos reglas presentes y solo
           la de index.css excluida. Sin esta segunda exclusión, TODO el Workspace (números del
           hero, nombres de tarjetas del Kanban, navegación 01-06, etc.) se ve más fino que el
           mockup, porque casi todos esos elementos son <div>/<span>/<button>/<h3>. */
        h1:not(.bg-v6 *),
        h2:not(.bg-v6 *),
        h3:not(.bg-v6 *),
        h4:not(.bg-v6 *),
        h5:not(.bg-v6 *),
        h6:not(.bg-v6 *),
        .font-bold:not(.bg-v6 *),
        .font-semibold:not(.bg-v6 *),
        .font-black:not(.bg-v6 *),
        .font-medium:not(.bg-v6 *),
        b:not(.bg-v6 *),
        strong:not(.bg-v6 *),
        th:not(.bg-v6 *),
        [class*="font-bold"]:not(.bg-v6 *),
        [class*="font-semibold"]:not(.bg-v6 *),
        [class*="font-black"]:not(.bg-v6 *),
        [class*="font-medium"]:not(.bg-v6 *) {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            letter-spacing: -0.02em !important;
        }

        p:not(.bg-v6 *),
        span:not(.bg-v6 *),
        div:not(.bg-v6 *),
        button:not(.bg-v6 *),
        input:not(.bg-v6 *),
        label:not(.bg-v6 *),
        a:not(.bg-v6 *),
        li:not(.bg-v6 *),
        td:not(.bg-v6 *) {
            font-weight: 400 !important;
            letter-spacing: -0.005em !important;
        }

        /* Remove italics force */
        i,
        em,
        .italic,
        [class*="italic"] {
            font-style: normal !important;
        }

        .primary-font {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        .secondary-font {
            font-family: 'Inter', sans-serif !important;
        }
    </style>
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      // El ID se configurará dinámicamente o se reemplazará manualmente
      fbq('init', 'REPLACE_WITH_PIXEL_ID');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->
  </head>

<body>
    <noscript>
      <img height="1" width="1" style="display:none"
           src="https://www.facebook.com/tr?id=REPLACE_WITH_PIXEL_ID&ev=PageView&noscript=1"/>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
