<!doctype html>
<html lang="es" data-tema="learnation" data-tema-modo="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar · vistas personalizables · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../frontend/src/temas/temas.css">
<link rel="stylesheet" href="../../../frontend/src/temas/temas-unicos.css">
<link rel="stylesheet" href="../../../frontend/src/components/standard/standard.css">
<style>
:root{--acento:var(--ln-brand-2,#7c6cff);--ok:var(--ln-success,#3ecf8e);--warn:var(--ln-warning,#f5b84a);--mal:#f87171;--info:#5aa9ff;--lila:#b48cff;
  --linea:var(--ln-border-subtle);--suave:var(--ln-inset-bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ln-page-bg);background-color:var(--ln-page-base);color:var(--ln-text-out);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:13.5px}
button{font-family:inherit}
.mk{position:fixed;left:80px;bottom:16px;z-index:300;display:flex;gap:8px;align-items:center}
.mk select{font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--ln-inset-bg);color:var(--ln-text-in);border:1px solid var(--linea)}

.app{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.riel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--linea);position:sticky;top:0;height:100vh}
.riel span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ln-text-muted);font-size:11px;font-weight:800}
.riel span.on{background:color-mix(in srgb,var(--acento) 18%,transparent);color:var(--acento)}
.main{min-width:0;padding:22px 28px 90px;display:grid;gap:14px;align-content:start}
.barra .h1{margin:0 14px 0 2px;font-size:22px;font-weight:900;color:var(--ln-text-in);white-space:nowrap}

/* ── Primera fila: vistas + controles ── */
.barra{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--linea);padding-bottom:6px;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:9px;color:var(--ln-text-muted);font-weight:600;font-size:13px;position:relative;white-space:nowrap}
.tab:hover{background:var(--suave);color:var(--ln-text-in)}
.tab.on{color:var(--ln-text-in);font-weight:800}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-7px;height:2px;border-radius:2px;background:var(--ln-text-in)}
.tab svg,.ctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tab .x{display:none;width:16px;height:16px;border-radius:5px;place-items:center;font-size:12px;color:var(--ln-text-faint)}
.tab.on:hover .x{display:grid}
.tab .x:hover{background:var(--linea);color:var(--ln-text-in)}
.sep{flex:1}
.ctl{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:8px;color:var(--ln-text-muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.ctl:hover,.ctl[aria-expanded="true"]{background:var(--suave);color:var(--ln-text-in)}
.ctl.act{color:var(--acento)}
.ctl .n{min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--acento);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
.vsep{width:1px;height:18px;background:var(--linea);margin:0 4px}
.semnav{display:inline-flex;align-items:center;gap:2px}
.semnav b{font-size:12.5px;color:var(--ln-text-in);padding:0 6px;white-space:nowrap}
.busca{display:inline-flex;align-items:center;gap:6px;height:30px;border-radius:8px;padding:0 8px;color:var(--ln-text-muted)}
.busca input{all:unset;width:0;font-size:12.5px;color:var(--ln-text-in);transition:width .18s}
.busca.abierta{background:var(--suave)}
.busca.abierta input{width:170px}

/* Resumen: una línea, cada número filtra */
.resumen{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ln-text-muted)}
.rchip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--linea)}
.rchip i{width:7px;height:7px;border-radius:99px;background:var(--c)}
.rchip b{color:var(--ln-text-in);font-variant-numeric:tabular-nums}
.rchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--ln-text-in)}
.pct{margin-left:auto;display:flex;align-items:center;gap:10px}
.pct .riel-pct{width:140px;height:7px;border-radius:99px;background:var(--ln-track,rgba(255,255,255,.08));display:flex;overflow:hidden}
.pct .riel-pct i{height:100%}
.pct b{color:var(--ln-text-in)}
.aviso{font-size:12.5px;padding:9px 14px;border-radius:12px;background:color-mix(in srgb,var(--info) 9%,transparent);border:1px solid color-mix(in srgb,var(--info) 26%,transparent);color:var(--ln-text-in)}

/* Popover */
.pop{position:fixed;z-index:250;width:290px;max-height:70vh;overflow:auto;padding:8px;border-radius:14px;background:var(--ln-popover-bg,#1c1c24);border:1px solid var(--ln-border-main);box-shadow:var(--ln-shadow,0 20px 50px rgba(0,0,0,.45));display:none}
.pop.on{display:block}
.pop h4{margin:6px 8px 6px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ln-text-faint);display:flex;justify-content:space-between}
.pop h4 button{all:unset;cursor:pointer;color:var(--acento);text-transform:none;letter-spacing:0;font-weight:700}
.pop .q{width:100%;height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--linea);background:var(--ln-input-bg,transparent);color:var(--ln-text-in);font:inherit;font-size:12.5px;margin-bottom:4px}
.op{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ln-text-in)}
.op:hover{background:var(--suave)}
.op .h{cursor:grab;color:var(--ln-text-faint);font-size:13px;letter-spacing:-2px}
.op .t{flex:1}
.op .sub{font-size:11px;color:var(--ln-text-faint)}
.op.arr{opacity:.4}
.op.sobre{box-shadow:inset 0 2px 0 var(--acento)}
.sw{width:28px;height:16px;border-radius:99px;background:var(--linea);position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:99px;background:#fff;transition:transform .15s}
.sw.on{background:var(--acento)}
.sw.on::after{transform:translateX(12px)}
.chk{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ln-border-main);display:grid;place-items:center;font-size:11px;color:#fff;flex-shrink:0}
.chk.on{background:var(--acento);border-color:var(--acento)}
.rad{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--ln-border-main);flex-shrink:0}
.rad.on{border:4.5px solid var(--acento)}
.tipos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px}
.tipos button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:6px;padding:12px 4px;border-radius:10px;border:1px solid var(--linea);font-size:12px;font-weight:700;color:var(--ln-text-in)}
.tipos button:hover{border-color:var(--acento)}
.tipos svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}

/* Celdas y etiquetas comunes */
.tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tag .av{width:14px;height:14px;border-radius:99px;display:grid;place-items:center;font-size:8px;background:var(--ca);color:#111;font-weight:900}
.tag.neutro{--c:var(--ln-text-in);background:var(--suave)}
.txt{color:var(--ln-text-out);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--ln-text-faint)}
.pasos{display:inline-flex;gap:3px;margin-right:6px}
.pasos i{width:14px;height:4px;border-radius:99px;background:var(--ln-track,rgba(255,255,255,.1))}
.pasos i.on{background:var(--c)}
.ibt{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#25d366}
.ibt:hover{background:var(--suave)}
.ibt svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.listo{font-size:12px;font-weight:800;color:var(--ok)}

/* ── Lista (tabla) ── */
.tabla{overflow-x:auto;border-top:1px solid var(--linea)}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;min-width:max-content;border-bottom:1px solid var(--linea)}
.tr > div{padding:0 10px;min-height:42px;display:flex;align-items:center;gap:6px;min-width:0;border-right:1px solid color-mix(in srgb,var(--linea) 60%,transparent)}
.tr > div:last-child{border-right:0;justify-content:flex-end}
.tr.cab > div{min-height:34px;font-size:11.5px;font-weight:700;color:var(--ln-text-muted)}
.tr.fila{cursor:pointer}
.tr.fila:hover{background:var(--suave)}
.tr.fila.sel{background:color-mix(in srgb,var(--acento) 9%,transparent)}
.tr.fila.hecha .nom{color:var(--ln-text-muted)}
.nom{font-weight:800;color:var(--ln-text-in);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg{width:3px;align-self:stretch;border-radius:2px;background:var(--t);margin:8px 0;flex-shrink:0}
.ghead{display:flex;align-items:center;gap:8px;padding:16px 6px 8px;font-size:12px;font-weight:800;color:var(--ln-text-in);cursor:pointer;user-select:none}
.ghead .car{color:var(--ln-text-faint);transition:transform .15s;font-size:10px}
.ghead.plegado .car{transform:rotate(-90deg)}
.ghead .n{color:var(--ln-text-faint);font-weight:600}
.ghead .pulso{width:8px;height:8px;border-radius:99px;background:var(--warn);animation:pulso 1.8s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 var(--warn)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hora b{font-variant-numeric:tabular-nums;color:var(--ln-text-in);font-size:13px}
.hora small{font-size:11px;font-weight:700;color:var(--t)}

/* ── Tablero ── */
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{display:grid;gap:7px;align-content:start;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--c) 5%,transparent);min-height:200px}
.col.sobre{box-shadow:inset 0 0 0 2px var(--c)}
.col h3{margin:0 2px 4px;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;color:var(--ln-text-in)}
.col h3 i{width:8px;height:8px;border-radius:99px;background:var(--c)}
.col h3 span{color:var(--ln-text-faint);font-weight:600}
.tj{display:grid;gap:6px;padding:10px 11px;border-radius:11px;background:var(--ln-page-base);border:1px solid var(--linea);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tj:hover{border-color:var(--ln-border-main)}
.tj.sel{border-color:var(--acento)}
.tj .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tj .l1 small{font-size:11px;font-weight:800;color:var(--t);white-space:nowrap}
.tj .props{display:flex;flex-wrap:wrap;gap:5px}
.tj .kv{display:grid;gap:1px;width:100%}
.tj .kv small{font-size:10px;color:var(--ln-text-faint);font-weight:700}
.tj .kv span{font-size:12px;color:var(--ln-text-out)}

/* ── Semana ── */
.sem{border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.sem-cab,.sem-cuerpo{display:grid;grid-template-columns:52px repeat(7,minmax(120px,1fr))}
.sem-cab > div{padding:8px;text-align:center;border-left:1px solid var(--linea);font-size:11px;color:var(--ln-text-muted);font-weight:700}
.sem-cab > div b{display:block;font-size:17px;color:var(--ln-text-in);font-weight:800}
.sem-cab > div.hoy b{color:#fff;background:var(--acento);width:30px;height:30px;line-height:30px;border-radius:99px;margin:2px auto 0}
.sem-cab > div small{display:block;font-size:10.5px;color:var(--ln-text-faint);font-weight:600;margin-top:2px}
.sem-cuerpo{position:relative;border-top:1px solid var(--linea);max-height:620px;overflow-y:auto}
.horas > div{height:var(--hh);font-size:10.5px;color:var(--ln-text-faint);text-align:right;padding:2px 8px 0 0;font-variant-numeric:tabular-nums}
.dia{position:relative;border-left:1px solid var(--linea);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--linea) calc(var(--hh) - 1px),var(--linea) var(--hh))}
.dia.hoy{background-color:color-mix(in srgb,var(--acento) 4%,transparent)}
.ahora{position:absolute;left:0;right:0;height:2px;background:var(--mal);z-index:3}
.ahora::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:99px;background:var(--mal)}
.ev{position:absolute;border-radius:8px;padding:4px 7px;overflow:hidden;cursor:pointer;font-size:11px;line-height:1.3;z-index:2;
  background:color-mix(in srgb,var(--c) 20%,var(--ln-page-base));border-left:3px solid var(--c);color:var(--ln-text-in)}
.ev:hover{z-index:4;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.ev.sel{outline:2px solid var(--acento)}
.ev b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;color:var(--ln-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Vista lateral (peek) ── */
.peek{position:fixed;top:0;right:0;bottom:0;width:420px;z-index:200;background:var(--ln-popover-bg,#17171f);border-left:1px solid var(--ln-border-main);
  box-shadow:-20px 0 50px rgba(0,0,0,.35);transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start}
.peek.on{transform:none}
.peek-top{display:flex;justify-content:space-between;align-items:center}
.peek h2{margin:0;font-size:19px;font-weight:900;color:var(--ln-text-in)}
.peek .sub{font-size:12.5px;color:var(--ln-text-muted);margin-top:2px}
.cuando{display:flex;justify-content:space-between;padding:11px 13px;border-radius:12px;background:color-mix(in srgb,var(--t) 12%,transparent)}
.cuando b{color:var(--ln-text-in)}
.cuando small{font-weight:800;color:var(--t)}
.paso3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.paso3 button{all:unset;cursor:pointer;text-align:center;padding:9px 4px;border-radius:10px;border:1px solid var(--linea);font-size:12px;font-weight:700;color:var(--ln-text-muted)}
.paso3 button.hecho{color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.paso3 button.actual{color:#111;background:var(--c);border-color:var(--c)}
.pr{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;font-size:12.5px;padding:5px 0}
.pr > span:first-child{color:var(--ln-text-muted)}
.pr > span:last-child{color:var(--ln-text-in)}
.sec{display:grid;gap:6px}
.sec > small{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ln-text-faint)}
.nota{width:100%;min-height:60px;resize:vertical;padding:9px 11px;border-radius:10px;border:1px solid var(--linea);background:var(--ln-input-bg,transparent);color:var(--ln-text-in);font:inherit;font-size:12.5px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="mk">
  <select id="rol" aria-label="Ver como">

<div class="app">

<div class="pop" id="pop"></div>
<aside class="peek" id="peek"></aside>

  return `<div class="resumen">${ETAPAS.map(e => `<button class="rchip" style="--c:${e.c}" aria-pressed="${f.length === 1 && f[0] === e.k}" data-retapa="${e.k}"><i></i>${e.t} <b>${ls.filter(l => l.etapa === e.k).length}</b></button>`).join('')}
    <span class="pct">Confirmación de hoy <b>${Math.round(ok / Math.max(1, hoy.length) * 100)}%</b> <span class="mute">${ok} de ${hoy.length}</span>
      <span class="riel-pct">${[...ETAPAS].reverse().map(e => `<i style="width:${hoy.filter(l => l.etapa === e.k).length / Math.max(1, hoy.length) * 100}%;background:${e.c}"></i>`).join('')}</span></span></div>`;
}

// ── Popovers ──
function popHtml(tipo) {
  const v = V();
  if (tipo === 'props') {
    const fila = (k) => `<div class="op" draggable="true" data-pk="${k}"><span class="h">⋮⋮</span><span class="t">${prop(k).t}</span><span class="sw ${v.props.includes(k) ? 'on' : ''}"></span></div>`;
    const orden = [...v.props, ...PROPS.map(p => p.k).filter(k => !v.props.includes(k))];
    const q = (document.getElementById('pq')?.value || '').toLowerCase();
    const de = (g) => orden.filter(k => prop(k).g === g && prop(k).t.toLowerCase().includes(q)).map(fila).join('');
    return `<input class="q" id="pq" placeholder="Buscar una propiedad" value="${q}">
      <h4>En esta vista <button data-todas="0">Ocultar todas</button></h4>
      <div class="op" style="cursor:default"><span class="h" style="opacity:0">⋮⋮</span><span class="t">Nombre</span><span class="sub">siempre</span></div>
      <h4>Agenda</h4>${de('Agenda')}<h4>Respuestas del formulario <button data-todas="1">Mostrar todas</button></h4>${de('Formulario')}`;
  }
  if (tipo === 'filtro') {
    const chk = (campo, val, t, sub = '') => `<div class="op" data-f="${campo}" data-v="${val}"><span class="chk ${v.filtro[campo].includes(val) ? 'on' : ''}">${v.filtro[campo].includes(val) ? '✓' : ''}</span><span class="t">${t}</span><span class="sub">${sub}</span></div>`;
    return `${rol === 'triage' ? `<h4>Closer</h4>${Object.entries(CLOSERS).map(([k, c]) => chk('closers', k, k === yo() ? `${c.n} (vos)` : c.n, LEADS.filter(l => l.closer === k).length)).join('')}` : ''}
      <h4>Etapa</h4>${ETAPAS.map(e => chk('etapas', e.k, e.t)).join('')}
      <h4>Segmento</h4>${['A', 'B', 'C'].map(s => chk('segs', s, 'Segmento ' + s)).join('')}
      <h4><span></span><button data-limpiar>Sacar filtros</button></h4>`;
  }
  if (tipo === 'orden') return `<h4>Ordenar por</h4>${ORDEN.map(o => `<div class="op" data-orden="${o.k}"><span class="rad ${v.orden === o.k ? 'on' : ''}"></span><span class="t">${o.t}</span></div>`).join('')}
      <h4>Sentido</h4><div class="op" data-asc="1"><span class="rad ${v.asc ? 'on' : ''}"></span><span class="t">Ascendente</span></div><div class="op" data-asc="0"><span class="rad ${!v.asc ? 'on' : ''}"></span><span class="t">Descendente</span></div>`;
  if (tipo === 'agrupar') return `<h4>${v.tipo === 'tablero' ? 'Columnas por' : 'Agrupar por'}</h4>${AGRUPAR.filter(a => !(v.tipo === 'tablero' && (a.k === 'urgencia' || a.k === 'ninguno'))).map(a =>
      `<div class="op" data-agrupar="${a.k}"><span class="rad ${(v.agrupar === a.k || (v.tipo === 'tablero' && a.k === 'etapa' && ['urgencia', 'ninguno'].includes(v.agrupar))) ? 'on' : ''}"></span><span class="t">${a.t}</span>${a.sub ? `<span class="sub">${a.sub}</span>` : ''}</div>`).join('')}`;
  if (tipo === 'tipo' || tipo === 'nueva') return `<h4>${tipo === 'nueva' ? 'Nueva vista' : 'Cambiar esta vista a'}</h4><div class="tipos">${Object.entries(TIPOS).map(([k, t]) =>
      `<button data-tipo="${k}" data-modo="${tipo}">${t.ic}${t.t}</button>`).join('')}</div>`;
  return '';
}
function abrirPop(tipo, ancla) {
  const p = $('pop');
  if (popAbierto === tipo && ancla) { cerrarPop(); return; }
  popAbierto = tipo; p.innerHTML = popHtml(tipo); p.classList.add('on');
  if (ancla) { const r = ancla.getBoundingClientRect(); p.style.top = (r.bottom + 6) + 'px'; p.style.left = Math.min(r.left, innerWidth - 300) + 'px'; }
  document.querySelectorAll('[data-pop]').forEach(b => b.setAttribute('aria-expanded', b.dataset.pop === tipo));
  enlazarPop();
}
function cerrarPop() { popAbierto = null; $('pop').classList.remove('on'); document.querySelectorAll('[data-pop]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
const repop = () => { guardar(); pintar(); if (popAbierto) { const t = popAbierto; popAbierto = null; abrirPop(t, document.querySelector(`[data-pop="${t}"]`)); } };

function enlazarPop() {
  const p = $('pop'), v = V();
  const pq = $('pq'); if (pq) { pq.oninput = () => { const pos = pq.selectionStart; p.innerHTML = popHtml('props'); enlazarPop(); const n = $('pq'); n.focus(); n.setSelectionRange(pos, pos); }; }
  p.querySelectorAll('[data-pk]').forEach(o => {
    o.onclick = () => { const k = o.dataset.pk; v.props = v.props.includes(k) ? v.props.filter(x => x !== k) : [...v.props, k]; repop(); };
    o.ondragstart = (e) => { e.dataTransfer.setData('text/plain', o.dataset.pk); o.classList.add('arr'); };
    o.ondragend = () => o.classList.remove('arr');
    o.ondragover = (e) => { e.preventDefault(); o.classList.add('sobre'); };
    o.ondragleave = () => o.classList.remove('sobre');
    o.ondrop = (e) => { e.preventDefault(); const k = e.dataTransfer.getData('text/plain'), dest = o.dataset.pk; if (k === dest) return;
      if (!v.props.includes(k)) v.props.push(k);
      v.props = v.props.filter(x => x !== k); const i = v.props.indexOf(dest); v.props.splice(i < 0 ? v.props.length : i, 0, k); repop(); };
  });
  p.querySelectorAll('[data-todas]').forEach(b => b.onclick = () => {
    v.props = b.dataset.todas === '1' ? [...new Set([...v.props, ...PROPS.filter(x => x.g === 'Formulario').map(x => x.k)])] : []; repop(); });
  p.querySelectorAll('[data-f]').forEach(o => o.onclick = () => { const a = v.filtro[o.dataset.f], x = o.dataset.v; a.includes(x) ? a.splice(a.indexOf(x), 1) : a.push(x); repop(); });
  p.querySelectorAll('[data-limpiar]').forEach(b => b.onclick = () => { v.filtro = { closers: [], etapas: [], segs: [] }; repop(); });
  p.querySelectorAll('[data-orden]').forEach(o => o.onclick = () => { v.orden = o.dataset.orden; repop(); });
  p.querySelectorAll('[data-asc]').forEach(o => o.onclick = () => { v.asc = o.dataset.asc === '1'; repop(); });
  p.querySelectorAll('[data-agrupar]').forEach(o => o.onclick = () => { v.agrupar = o.dataset.agrupar; repop(); });
  p.querySelectorAll('[data-tipo]').forEach(b => b.onclick = () => {
    const t = b.dataset.tipo;
    if (b.dataset.modo === 'nueva') {
      vistas.push({ id: 'v' + Date.now(), nombre: TIPOS[t].t + ' nueva', tipo: t, agrupar: t === 'tablero' ? 'etapa' : t === 'lista' ? 'urgencia' : 'ninguno',
        props: t === 'semana' ? ['closer', 'etapa'] : ['hora', 'etapa', 'seg'], filtro: { closers: [], etapas: [], segs: [] }, orden: 'hora', asc: true });
      activa = vistas.length - 1;
    } else { v.tipo = t; if (t === 'tablero' && ['urgencia', 'ninguno'].includes(v.agrupar)) v.agrupar = 'etapa'; }
    cerrarPop(); guardar(); pintar();
  });
}

// ── Vista lateral ──
function peek() {
  const l = LEADS.find(x => x.id === sel), el = $('peek');
  if (!l) { el.classList.remove('on'); return; }
  const f = falta(l), i = ETAPAS.findIndex(e => e.k === l.etapa);
  el.innerHTML = `<div class="peek-top"><span class="mute" style="font-size:12px">Confirmar · ${V().nombre}</span>
      <span><button class="ui-btn ui-btn--ghost ui-btn--sm">Abrir ficha</button> <button class="ctl" data-cerrar>✕</button></span></div>
    <div><h2>${l.n}</h2><div class="sub">${l.tel} · ${rol === 'triage' ? 'llamada con ' + (l.closer === yo() ? 'vos' : CLOSERS[l.closer].n) : 'tu llamada'}</div></div>
    <div class="cuando" style="--t:${f.t}"><b>${l.dia === 0 ? 'Hoy' : l.dia === 1 ? 'Mañana' : fechaDe(l.dia)} · ${hhmm(l.min)}</b><small>${f.tx}</small></div>
    <div class="sec"><small>Etapa</small><div class="paso3">${ETAPAS.map((e, k) => `<button style="--c:${e.c}" class="${k < i ? 'hecho' : k === i ? 'actual' : ''}" data-etapa="${e.k}">${e.t}</button>`).join('')}</div></div>
    <div class="sec"><small>Escribirle</small><div class="btns"><button class="ui-btn ui-btn--secondary ui-btn--sm">Recordatorio de hoy</button><button class="ui-btn ui-btn--secondary ui-btn--sm">Faltan 15 min</button><button class="ui-btn ui-btn--ghost ui-btn--sm">WhatsApp libre</button></div></div>
    <div class="sec"><small>Nota para la llamada</small><textarea class="nota" placeholder="Lo que el closer tiene que saber antes de llamar…"></textarea></div>
    <div class="sec"><small>Propiedades</small><div>${PROPS.filter(p => !['hora', 'etapa', 'tel'].includes(p.k)).map(p => `<div class="pr"><span>${p.t}</span><span>${p.k === 'closer' || p.k === 'seg' || p.k === 'avisos' || p.k === 'inv' ? celda(l, p.k) : (l[p.k] || '—')}</span></div>`).join('')}</div></div>
    <div class="btns" style="border-top:1px solid var(--linea);padding-top:12px"><button class="ui-btn ui-btn--secondary ui-btn--sm">Reprogramar</button><button class="ui-btn ui-btn--secondary ui-btn--sm">Canceló</button><button class="ui-btn ui-btn--ghost ui-btn--sm">Descalificar</button></div>`;
  el.classList.add('on');
  el.querySelector('[data-cerrar]').onclick = () => { sel = null; pintar(); };
  el.querySelectorAll('[data-etapa]').forEach(b => b.onclick = () => { mover(l, b.dataset.etapa); pintar(); });
}
function mover(l, k) { l.etapa = k; l.por = CLOSERS[yo()].n; l.a = hhmm(AHORA); }

// ── Pintar ──
function pintar() {
  if (!V()) activa = 0;
  const v = V();
  $('main').innerHTML = `${barra()}
    ${rol === 'closer' ? '<div class="aviso"><b>Dari confirma tus llamadas.</b> Si una sigue sin confirmar cerca de la hora, podés hacerlo vos: queda a tu nombre.</div>' : ''}
    ${resumen()}
    <div>${v.tipo === 'lista' ? lista() : v.tipo === 'tablero' ? tablero() : semana()}</div>`;
  const sc = $('semc'); if (sc) sc.scrollTop = 54 * 4.5;
  enlazar(); peek();
}
function enlazar() {
  document.querySelectorAll('[data-tab]').forEach(b => {
    b.onclick = (e) => { if (e.target.dataset.borrar) return; activa = +b.dataset.tab; cerrarPop(); pintar(); };
    b.ondblclick = () => { const n = prompt('Nombre de la vista', vistas[+b.dataset.tab].nombre); if (n) { vistas[+b.dataset.tab].nombre = n; guardar(); pintar(); } };
  });
  document.querySelectorAll('[data-borrar]').forEach(x => x.onclick = (e) => { e.stopPropagation(); vistas.splice(+x.dataset.borrar, 1); activa = 0; guardar(); pintar(); });
  document.querySelectorAll('[data-pop]').forEach(b => b.onclick = (e) => { e.stopPropagation(); abrirPop(b.dataset.pop, b); });
  document.querySelectorAll('[data-buscar]').forEach(b => b.onclick = () => { buscaAbierta = !buscaAbierta; if (!buscaAbierta) busqueda = ''; pintar(); if (buscaAbierta) $('q').focus(); });
  const q = $('q'); q.oninput = () => { busqueda = q.value; pintar(); const n = $('q'); n.focus(); n.setSelectionRange(busqueda.length, busqueda.length); };
  document.querySelectorAll('[data-retapa]').forEach(b => b.onclick = () => { const f = V().filtro; f.etapas = f.etapas.length === 1 && f.etapas[0] === b.dataset.retapa ? [] : [b.dataset.retapa]; guardar(); pintar(); });
  document.querySelectorAll('[data-sel]').forEach(b => b.onclick = (e) => { if (e.target.closest('button')) return; sel = +b.dataset.sel; pintar(); });
  document.querySelectorAll('[data-plegar]').forEach(b => b.onclick = () => {
    const id = b.dataset.plegar, def = b.dataset.def === '1';
    if (def) { plegados.has(id + '!') ? plegados.delete(id + '!') : plegados.add(id + '!'); } else { plegados.has(id) ? plegados.delete(id) : plegados.add(id); }
    pintar(); });
  document.querySelectorAll('[data-avanza]').forEach(b => b.onclick = () => { const l = LEADS.find(x => x.id === +b.dataset.avanza); mover(l, l.etapa === 'por_contactar' ? 'contactado' : 'confirmado'); pintar(); });
  // Tablero por etapa: arrastrar cambia la etapa.
  document.querySelectorAll('[data-arr]').forEach(t => t.ondragstart = (e) => e.dataTransfer.setData('text/plain', t.dataset.arr));
  document.querySelectorAll('[data-col]').forEach(c => { if (!c.dataset.col) return;
    c.ondragover = (e) => { e.preventDefault(); c.classList.add('sobre'); };
    c.ondragleave = (e) => { if (!c.contains(e.relatedTarget)) c.classList.remove('sobre'); };
    c.ondrop = (e) => { e.preventDefault(); mover(LEADS.find(x => x.id === +e.dataTransfer.getData('text/plain')), c.dataset.col); pintar(); };
  });
}
// composedPath: el popover se repinta al tocarlo y el target queda fuera del documento.
document.addEventListener('click', (e) => { if (popAbierto && !e.composedPath().some(n => n.id === 'pop' || n.dataset?.pop)) cerrarPop(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (popAbierto) cerrarPop(); else if (sel) { sel = null; pintar(); } } });
$('rol').onchange = (e) => { rol = e.target.value; sel = null; cargar(); pintar(); };
cargar(); pintar();
</script>
</body>
