<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del lead hoy · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mockup de la ficha del lead TAL COMO ES HOY (FichaLeadModal + FichaHeader + las 8 pestañas).
   Sirve para rediseñarla como ficha única por persona (person_uuid) y no por una agenda.
   Tokens: tema Modern oscuro (comercial.css / ficha.css). */
:root{
  --bg:#020617; --page:linear-gradient(135deg,#020617 0%,#0A0E3D 50%,#05082D 100%);
  --el:rgba(255,255,255,.08); --el-h:rgba(255,255,255,.12); --el-2:rgba(255,255,255,.04); --inset:rgba(0,0,0,.30);
  --text:#fff; --muted:rgba(255,255,255,.60); --faint:rgba(255,255,255,.40);
  --b1:rgba(255,255,255,.05); --b2:rgba(255,255,255,.15); --b3:rgba(255,255,255,.38);
  --brand:#FF3FA4; --blue:#1323C6; --flot:#0B1030;
  --ok:#2FBF8F; --ok-s:#071A24; --ok-b:#10413D;
  --warn:#D9A441; --warn-s:#1A171C; --warn-b:#473924;
  --bad:#E85C4A; --bad-s:#1B0F1D; --bad-b:#4C2227;
  --info:#4E8BD8; --info-s:#0A152C; --info-b:#1A3155;
  --idle:#7F8CA8; --idle-s:#0E1326; --idle-b:#252C42;
  --aqua:#2EE6C8; --amber:#FFB547; --lilac:#7D8BFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--text);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,124,255,.55)}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--muted)} .faint{color:var(--faint)} .mono{font-variant-numeric:tabular-nums}
h2,h3,p{margin:0}
h3{font-size:20px;font-weight:900;letter-spacing:-.01em}

/* ---------- barra del mockup (no es parte de la app) ---------- */
.mk{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:12px 24px;background:rgba(2,6,23,.9);backdrop-filter:blur(10px);border-bottom:1px dashed var(--b2)}
.mk .tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#020617;background:var(--amber);padding:3px 8px;border-radius:6px}
.mk b{font-size:13px}
.mk .sp{flex:1}
.mk label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--inset);border:1px solid var(--b1);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--el-h);color:var(--text)}
.mk-btn{border:1px solid var(--b2);background:var(--el-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.mk-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.nota-mk{max-width:1120px;margin:16px auto 0;padding:0 24px;font-size:12.5px;color:var(--muted);line-height:1.6}
.nota-mk b{color:var(--text)}

/* ---------- marcas agenda / persona ---------- */
body.marcar [data-src]{position:relative;outline:1.5px dashed var(--c);outline-offset:3px;border-radius:8px}
body.marcar [data-src]::before{content:attr(data-src);position:absolute;top:-9px;right:-4px;z-index:5;font-size:8.5px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;background:var(--c);color:#020617;pointer-events:none}
[data-src="agenda"]{--c:var(--amber)} [data-src="persona"]{--c:var(--aqua)} [data-src="mixto"]{--c:var(--lilac)}

/* ---------- modal ---------- */
.lay{padding:24px 16px 80px;display:flex;justify-content:center}
.modal{width:min(1120px,100%);border-radius:32px;background:rgba(2,6,23,.92);border:1px solid var(--b2);border-top-color:rgba(255,255,255,.1);
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 30px 80px -30px rgba(19,35,198,.5)}
.cabw{padding:20px 20px 16px}
.cab{display:grid;gap:16px;padding:22px 28px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 70%)}
.cab-tit{display:flex;justify-content:space-between;align-items:center;gap:16px}
.cab-tit h2{font-size:clamp(24px,2.6vw,30px);font-weight:900;letter-spacing:-.025em}
.ibtns{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--b1);background:rgba(0,0,0,.3);display:grid;place-items:center;color:rgba(255,255,255,.6)}
.ibtn.vid{color:var(--brand)}
.ibtn.sm{width:24px;height:24px}
.ibtn.sm svg{width:12px;height:12px}
.datos{display:grid;grid-template-columns:repeat(6,minmax(0,auto));justify-content:start;gap:16px clamp(28px,4vw,56px)}
@media(max-width:900px){.datos{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.datos{grid-template-columns:1fr}}
.dato{display:grid;gap:10px;white-space:nowrap}
.rot{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.rot svg{width:11px;height:11px}
.val{font-size:15px;font-weight:600;line-height:28px;display:inline-flex;align-items:center;gap:8px}
.val b{font-weight:800}
.falta{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--c,var(--ok));
  background:color-mix(in srgb,var(--c,var(--ok)) 14%,transparent)}
.falta i{width:6px;height:6px;border-radius:50%;background:currentColor}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:800;background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.closer-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 4px;border-radius:999px;background:var(--el);border:1px solid var(--b3);font-weight:600}
.closer-btn em{font-style:normal;color:var(--brand);font-size:12px;font-weight:700}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tel{color:var(--text);text-decoration:none}
.ids{display:grid;gap:6px;padding:14px 16px;border-radius:14px;background:var(--inset);border:1px solid var(--b1)}
.ids-f{display:flex;align-items:center;gap:10px;font-size:13px}
.ids-f small{min-width:96px;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--b2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok-b);background:var(--ok-s)} .chip.warn{color:var(--warn);border-color:var(--warn-b);background:var(--warn-s)}
.chip.bad{color:var(--bad);border-color:var(--bad-b);background:var(--bad-s)} .chip.info{color:var(--info);border-color:var(--info-b);background:var(--info-s)}
.chip.idle{color:var(--idle);border-color:var(--idle-b);background:var(--idle-s)}
.chip.brand{color:var(--brand);border-color:rgba(255,63,164,.35)}

.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--b1);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:11px 0 10px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.tab svg{width:14px;height:14px;opacity:.75}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.tab .cnt{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:5px;background:var(--el);font-size:10px;font-weight:800}
.panel{padding:20px;display:grid;gap:12px}

/* piezas comunes */
.tarj{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--s);border:1px solid var(--bb)}
.tarj svg{width:18px;height:18px;color:var(--c)}
.tarj b{display:block;font-size:14px;font-weight:700}
.tarj small{font-size:12px;color:var(--muted)}
.t-ok{--s:var(--ok-s);--bb:var(--ok-b);--c:var(--ok)} .t-info{--s:var(--info-s);--bb:var(--info-b);--c:var(--info)}
.t-warn{--s:var(--warn-s);--bb:var(--warn-b);--c:var(--warn)} .t-bad{--s:var(--bad-s);--bb:var(--bad-b);--c:var(--bad)}
.btn{height:44px;padding:0 20px;border-radius:999px;font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--b3);background:transparent;color:var(--muted)}
.btn.cta{background:var(--brand);border-color:var(--brand);color:#020617}
.btn.sm{height:34px;font-size:11px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.lbl{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.campo{width:100%;min-height:40px;padding:10px 14px;border-radius:14px;border:1px solid var(--b2);background:var(--inset);font-size:14px}
textarea.campo{min-height:104px;resize:vertical}
.pnl{padding:24px;border-radius:16px;background:var(--el);border:1px solid var(--b2)}
.pnl.sm{padding:16px 20px}

/* Confirmación */
.stp-cab{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stp{display:flex;align-items:flex-start;margin-top:16px}
.stp-p{flex:1;display:grid;justify-items:center;gap:8px;position:relative;border:0;background:none;padding:0}
.stp-p+.stp-p::before{content:'';position:absolute;top:15px;right:50%;width:100%;height:2px;background:var(--b2);z-index:0}
.stp-p.hecho+.stp-p::before,.stp-p.hecho+.stp-p.actual::before{background:var(--ok)}
.stp-c{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#020617;border:1px solid var(--b3)}
.hecho .stp-c{background:var(--ok);border-color:var(--ok);color:#020617}
.actual .stp-c{background:var(--brand);border-color:var(--brand);color:#020617;box-shadow:0 0 0 6px rgba(255,63,164,.1)}
.stp-p span{font-size:13px;font-weight:600}
.pie{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding-top:24px;border-top:1px solid var(--b1);padding-right:168px}
.lineas{display:flex;flex-wrap:wrap;gap:10px}
.linea{height:48px;padding:0 18px;border-radius:16px;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);background:color-mix(in srgb,var(--c) 11%,transparent)}
.linea svg{width:18px;height:18px;color:var(--c)}
.c-info{--c:var(--info)} .c-warn{--c:var(--warn)} .c-bad{--c:var(--bad)} .c-ok{--c:var(--ok)}

/* Resultado */
.res{display:grid;grid-template-columns:124px minmax(0,1fr);gap:24px}
@media(max-width:760px){.res{grid-template-columns:1fr}}
.hitos{border-right:1px solid var(--b1);opacity:.72;min-height:300px;padding-right:12px}
.hitos small{font-size:9px;font-weight:900;letter-spacing:.22em;color:var(--faint)}
.hito{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:11.5px;position:relative}
.hito i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3);flex:none}
.hito.hecho i{background:var(--aqua);border-color:var(--aqua)}
.hito.sig i{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,63,164,.15)}
.raices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
@media(max-width:760px){.raices{grid-template-columns:repeat(2,1fr)}}
.raiz{min-height:112px;border-radius:16px;border:1px solid var(--b2);padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
  background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),rgba(255,255,255,.05);font-size:16px;font-weight:700;text-align:left}
.raiz svg{width:26px;height:26px;color:var(--c);filter:drop-shadow(0 0 8px var(--c))}
.otras{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.otra{height:56px;border-radius:16px;border:1px solid var(--b3);background:var(--el-2);font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.otra svg{width:18px;height:18px;color:var(--brand)}
.fathom{display:flex;gap:12px;align-items:center;margin-top:24px;flex-wrap:wrap}
.fathom svg{color:var(--brand)}

/* Acciones */
.acc{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:24px}
@media(max-width:760px){.acc{grid-template-columns:1fr}}
.deuda-n{font-size:clamp(40px,5vw,64px);font-weight:900;letter-spacing:-.03em;color:var(--bad);line-height:1.1;margin:8px 0 18px}
.par{display:grid;gap:4px}
.par small{font-size:12px;color:var(--muted)}
.par b{display:inline-flex;align-items:center;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.accion{min-height:104px;padding:16px 24px;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:16px;font-weight:700;
  border:1px solid color-mix(in srgb,var(--c) 34%,transparent);background:color-mix(in srgb,var(--c) 11%,transparent)}
.accion svg{width:24px;height:24px;color:var(--c)}

/* Historial */
.franja{display:flex;flex-wrap:wrap;gap:32px;padding:16px 20px;border-radius:16px;background:var(--el-2);border:1px solid var(--b1)}
.sec{border-radius:16px;border:1px solid var(--b1);background:var(--el-2)}
.sec>button{width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;border:0;background:none;text-align:left}
.sec>button b{font-size:16px;font-weight:800}
.sec>button small{flex:1;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec>button svg{transition:transform .2s}
.sec.abierta>button svg{transform:rotate(180deg)}
.sec-cuerpo{display:none;padding:0 20px 16px}
.sec.abierta .sec-cuerpo{display:grid;gap:6px}
.fila{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);font-size:13px}
.fila.ag{grid-template-columns:150px 1fr auto}
.fila .acts{display:flex;gap:6px;align-items:center}
.sel{height:30px;border-radius:10px;border:1px solid var(--b2);background:var(--inset);font-size:12px;padding:0 8px}
.objec{margin:2px 0 6px 164px;padding:10px 14px;border-left:2px solid var(--warn);background:var(--warn-s);border-radius:0 10px 10px 0;font-size:12.5px}
.sec-pie{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}

/* Fulfillment */
.ful-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.met{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--b1)}
.barra{height:4px;border-radius:4px;background:var(--b1);overflow:hidden;margin-top:4px}
.barra i{display:block;height:100%;background:var(--aqua)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:8px 6px;border-bottom:1px solid var(--b1)}
td{padding:9px 6px;border-bottom:1px solid var(--b1)}

/* Bitácora */
.bit{display:grid;grid-template-columns:150px 1fr auto;gap:14px;padding:10px 12px;font-size:13px;border-radius:12px;background:rgba(255,255,255,.03)}
.bit small{display:block;color:var(--muted);font-size:12px}

/* Formulario */
.frm{display:grid;grid-template-columns:minmax(160px,1fr) 2fr auto;gap:14px;padding:11px 12px;border-bottom:1px solid var(--b1);font-size:13px}

/* Comunicación */
.hilo{display:grid;gap:14px;padding:20px;border-radius:16px;background:var(--el-2);border:1px solid var(--b1)}
.nota{display:grid;grid-template-columns:32px 1fr;gap:10px}
.nota .av{width:32px;height:32px;font-size:12px}
.burbuja{margin-top:6px;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--el);font-size:13px;line-height:1.5}
.notificar{display:flex;flex-wrap:wrap;gap:6px}
.enviar{display:flex;gap:8px}
.enviar .campo{height:48px}
.enviar button{width:48px;height:48px;border-radius:14px;border:0;background:var(--brand);color:#020617;display:grid;place-items:center}

.vacio{display:grid;justify-items:center;gap:8px;padding:40px 16px;text-align:center;color:var(--muted)}
.vacio svg{width:32px;height:32px}
</style>
</head>
<body>
<div class="mk">
  <span class="tag">Hoy</span><b>Ficha del lead · como es hoy</b>
  <span class="sp"></span>
  <label>Caso</label>
  <div class="seg" id="caso"></div>
  <label id="ancla-lbl">Agenda ancla</label>
  <div class="seg" id="ancla"></div>
  <button class="mk-btn" id="marcar" aria-pressed="false">Ver de dónde sale cada dato</button>
</div>
<p class="nota-mk" id="nota"></p>
<div class="lay"><div class="modal" role="dialog" id="app"></div></div>

<script>
// ---------- íconos (trazos de lucide) ----------
const P = {
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  video: '<path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  copy: '<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  contact: '<path d="M16 2v2M8 2v2"/><rect x="3" y="4" width="18" height="18" rx="2"/><circle cx="12" cy="11" r="3"/><path d="M7 20c0-2.5 2.2-4 5-4s5 1.5 5 4"/>',
  pencil: '<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  grad: '<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  calclock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5M16 2v4M8 2v4M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
  calx: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M10 14l4 4M14 14l-4 4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  userx: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 8l5 5M22 8l-5 5"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/>',

// ---------- barra y render ----------
function barra() {
  document.getElementById('caso').innerHTML = [['cliente', 'Alumna con cuotas'], ['lead', 'Lead nuevo, llamada hoy']]
    .map(([k, l]) => `<button data-caso="${k}" aria-pressed="${S.caso === k}">${l}</button>`).join('');
  const ancla = document.getElementById('ancla');
  const lbl = document.getElementById('ancla-lbl');
  ancla.style.display = lbl.style.display = S.caso === 'cliente' ? '' : 'none';
  ancla.innerHTML = Object.values(AGENDAS).map((a) => `<button data-ancla="${a.id}" aria-pressed="${S.ancla === a.id}">${a.corta} · ${a.chip[0]}</button>`).join('');
  const a = agendaAncla();
  document.getElementById('nota').innerHTML = S.caso === 'cliente'
    ? `La ficha se abre sobre <b>una agenda</b>: hoy es la del <b>${a.corta}</b> (estado «${a.etiqueta}»). Cambiá la agenda ancla arriba y mirá cómo cambian la cabecera (fuente, closer, segmento, grabación), las pestañas visibles, la que abre por defecto, Confirmación, Resultado y Formulario, aunque es la misma persona. Abierta desde el buscador por cliente, el ancla es la agenda más reciente (la del 30 oct).`
    : 'Un lead antes de su primera llamada: la cabecera muestra Examen y Llamada (de la agenda); cuando ya compró, pasan a Programa e Ingresó (de la persona).';
}

function render() {
  const { lista, def } = pestanas();
  if (!S.tab || !lista.some(([id]) => id === S.tab)) S.tab = def;
  barra();
  const a = agendaAncla();
  const triage = S.caso === 'lead' ? `<div class="tarj t-info"${src('agenda')}>${ic('alert')}<div><b>Viene de triage · aprobado por Sofía · segmento A</b><small>Puede invertir; decide solo. Le interesa MIR 2027.</small></div></div>` : '';
  document.getElementById('app').innerHTML = `${cabecera()}${tabs()}<div class="panel">${triage}${PANELES[S.tab]()}</div>`;
  document.getElementById('app').setAttribute('aria-label', `Ficha de ${S.caso === 'cliente' ? PERSONA.nombre : LEAD.nombre} · ancla ${a.id}`);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-caso],[data-ancla],[data-tab],[data-sec],[data-act],#marcar');
  if (!t) return;
  if (t.dataset.caso) { S.caso = t.dataset.caso; S.tab = null; }
  else if (t.dataset.ancla) { S.ancla = t.dataset.ancla; S.tab = null; }
  else if (t.dataset.tab) S.tab = t.dataset.tab;
  else if (t.dataset.sec) { const id = t.dataset.sec; S.abiertas.has(id) ? S.abiertas.delete(id) : S.abiertas.add(id); }
  else if (t.dataset.act === 'ids') S.ids = !S.ids;
  else if (t.id === 'marcar') { const on = document.body.classList.toggle('marcar'); t.setAttribute('aria-pressed', on); }
  render();
});
render();
</script>
