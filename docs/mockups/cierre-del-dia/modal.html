<!doctype html>
<html lang="es" data-tema="learnation" data-tema-modo="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerrar el día · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../frontend/src/temas/temas.css">
<link rel="stylesheet" href="../../../frontend/src/temas/temas-unicos.css">
<link rel="stylesheet" href="../../../frontend/src/components/standard/standard.css">
<style>
:root{--acento:var(--ln-brand-2,#7c6cff);--ok:var(--ln-success,#3ecf8e);--warn:var(--ln-warning,#f5b84a);--mal:#f87171}
body{margin:0;min-height:100vh;background:var(--ln-page-bg);background-color:var(--ln-page-base);color:var(--ln-text-out);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px}
/* Solo para el mockup: elegir el rol y el tema. */
.mk{position:fixed;left:16px;top:16px;z-index:200;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mk select{font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--ln-inset-bg);color:var(--ln-text-in);border:1px solid var(--ln-border-subtle)}

.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;
  background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:50}
.dock__b{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--ln-text-muted);background:none;border:0}
.dock__cierre{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:0;font:inherit;font-weight:800;font-size:13px;cursor:pointer;
  background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.dock__cierre.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}

.cd.ui-modal{width:min(720px,100%);padding:0;display:flex;flex-direction:column}
.cd-cab{padding:20px 24px 14px;border-bottom:1px solid var(--ln-border-subtle);display:grid;gap:12px}
.cd-cab__fila{display:flex;align-items:flex-start;gap:12px}
.cd-cab h2{margin:0;font-size:19px;font-weight:900;color:var(--ln-text-in)}
.cd-cab p{margin:2px 0 0;font-size:13px;color:var(--ln-text-muted)}
.cd-x{margin-left:auto;background:none;border:0;color:var(--ln-text-muted);cursor:pointer;padding:4px}
.cd-pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cd-pasos button{display:grid;gap:6px;background:none;border:0;padding:0;text-align:left;font:inherit;font-size:12px;font-weight:700;color:var(--ln-text-muted);cursor:pointer}
.cd-pasos button::before{content:'';height:4px;border-radius:99px;background:var(--ln-border-subtle);transition:background .3s}
.cd-pasos button.hecho::before{background:var(--acento);opacity:.55}
.cd-pasos button.actual{color:var(--ln-text-in)}
.cd-pasos button.actual::before{background:var(--acento)}
.cd-cuerpo{padding:20px 24px;display:grid;gap:16px;min-height:360px;align-content:start}
.cd-pie{padding:14px 24px;border-top:1px solid var(--ln-border-subtle);display:flex;gap:10px;align-items:center}
.cd-pie .der{margin-left:auto;display:flex;gap:10px}

.cd-sub{margin:0;font-size:13px;color:var(--ln-text-muted);line-height:1.5}
.cd-lista{display:grid;gap:6px}
.cd-persona{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--ln-border-subtle);
  background:var(--ln-inset-bg);color:var(--ln-text-in);font:inherit;text-align:left;cursor:pointer;width:100%}
.cd-persona i,.cd-elegido i{font-style:normal;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--acento);color:#fff}
.cd-persona b{display:block;font-size:14px}
.cd-persona small{color:var(--ln-text-muted);font-size:12px}
.cd-persona .chev{color:var(--ln-text-muted)}
.cd-buscar input{width:100%;box-sizing:border-box;font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);color:var(--ln-text-in)}
.cd-elegido{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle)}
.cd-elegido button{margin-left:auto;background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.cd-campo{display:grid;gap:6px}
.cd-campo label{font-size:13px;font-weight:700;color:var(--ln-text-in)}
.cd-campo label small{font-weight:500;color:var(--ln-text-muted)}
.cd-campo textarea{width:100%;box-sizing:border-box;min-height:68px;resize:vertical;padding:10px 12px;border-radius:12px;font:inherit;
  border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);color:var(--ln-text-in)}
.cd-prueba{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px dashed var(--ln-border-subtle);color:var(--ln-text-muted);font-size:13px;cursor:pointer}
.cd-prueba.ok{border-style:solid;color:var(--ln-text-in)}
.cd-otra{background:none;border:0;color:var(--ln-text-muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;justify-self:start}
.cd-sumar{background:none;border:1px dashed var(--ln-border-subtle);border-radius:12px;color:var(--ln-text-muted);font:inherit;font-size:13px;font-weight:700;padding:10px;cursor:pointer}

/* --- Números ------------------------------------------------------------------------------------ */
.st-hero{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:560px){.st-hero{grid-template-columns:1fr}}
.st-k{position:relative;overflow:hidden;padding:14px 16px 12px;border-radius:16px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;opacity:0;transform:translateY(10px);animation:st-in .5s cubic-bezier(.2,.8,.2,1) forwards}
.st-k::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--acento) 18%,transparent) 50%,transparent 70%);
  transform:translateX(-100%);animation:st-brillo 1.3s .35s ease-out forwards;pointer-events:none}
.st-k__lbl{font-size:12px;font-weight:700;color:var(--ln-text-muted);grid-column:1}
.st-k__val{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ln-text-in);grid-column:1;line-height:1.1}
.st-k__val small{font-size:15px;font-weight:700;color:var(--ln-text-muted);margin-left:2px}
.st-k__delta{grid-column:1;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.st-k__delta.sube{color:var(--ok)} .st-k__delta.baja{color:var(--mal)} .st-k__delta.igual{color:var(--ln-text-muted)}
.st-k__delta span{font-weight:600;color:var(--ln-text-muted)}
.st-k__viz{grid-column:2;grid-row:1/span 3;width:96px;height:56px}
.st-spark path.linea{fill:none;stroke:var(--acento);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:st-trazo 1.1s .25s ease-out forwards}
.st-spark path.area{fill:url(#st-grad);opacity:0;animation:st-fade .6s .9s forwards}
.st-spark circle{fill:var(--acento);r:0;animation:st-punto .3s 1.25s forwards}
.st-anillo{width:62px;height:62px}
.st-anillo circle{fill:none;stroke-width:7}
.st-anillo .fondo{stroke:var(--ln-border-subtle)}
.st-anillo .valor{stroke:var(--acento);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1) .2s}
.st-anillo .valor.lleno{stroke:var(--ok)}
.st-anillo text{font:800 13px Montserrat,sans-serif;fill:var(--ln-text-in);text-anchor:middle;dominant-baseline:central}

.st-embudo{padding:14px 16px;border-radius:16px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);display:grid;gap:10px;opacity:0;animation:st-in .5s .3s forwards}
.st-embudo h4{margin:0;font-size:12px;font-weight:800;color:var(--ln-text-muted);text-transform:uppercase;letter-spacing:.05em}
.st-fila{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.st-fila span{color:var(--ln-text-muted)}
.st-barra{height:12px;border-radius:99px;background:var(--ln-border-subtle);overflow:hidden}
.st-barra i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acento),color-mix(in srgb,var(--acento) 55%,#2fd3ff));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.st-fila b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ln-text-in)}
.st-fila b small{font-weight:600;color:var(--ln-text-muted);margin-left:4px}

.st-mano{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.st-m{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.st-m span{flex:1;font-size:13px;font-weight:700;color:var(--ln-text-in)}
.st-m small{display:block;font-size:11px;font-weight:700;color:var(--warn)}
.st-m input{width:56px;font:inherit;font-size:18px;font-weight:800;text-align:right;background:none;border:0;border-bottom:1px solid var(--ln-border-subtle);color:var(--ln-text-in)}

.cd-det{border-radius:14px;border:1px solid var(--ln-border-subtle)}
.cd-det summary{padding:10px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ln-text-in)}
.cd-det table{width:100%;border-collapse:collapse;font-size:13px}
.cd-det td{padding:7px 14px;border-top:1px solid var(--ln-border-subtle)}
.cd-det td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ln-text-in)}
.cd-det td.grupo{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ln-text-muted);font-weight:800;padding-top:12px}
.cd-det button{background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0;margin-left:8px}

@keyframes st-in{to{opacity:1;transform:none}}
@keyframes st-brillo{to{transform:translateX(100%)}}
@keyframes st-trazo{to{stroke-dashoffset:0}}
@keyframes st-fade{to{opacity:.35}}
@keyframes st-punto{to{r:3.2px}}
@media (prefers-reduced-motion:reduce){
  .st-k,.st-embudo{animation:none;opacity:1;transform:none}
  .st-k::after{display:none}
  .st-spark path.linea{animation:none;stroke-dashoffset:0}
  .st-spark path.area{animation:none;opacity:.35}
  .st-spark circle{animation:none;r:3.2px}
  .st-anillo .valor,.st-barra i{transition:none}
}

.cd-res{display:grid;gap:10px}
.cd-res__b{padding:12px 14px;border-radius:14px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);display:grid;gap:4px}
.cd-res__b h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ln-text-muted)}
.cd-res__b p{margin:0;font-size:13px;color:var(--ln-text-in);line-height:1.5}
.cd-res__b .ed{justify-self:start;background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:0}
.cd-listo{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 0}
.cd-listo .ico{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.cd-listo h3{margin:0;font-size:18px;color:var(--ln-text-in)}
.cd-listo p{margin:0;color:var(--ln-text-muted);font-size:13px;max-width:420px;line-height:1.5}
.oculto{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="st-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></linearGradient>
</defs></svg>

<div class="mk">
  <select id="rol" aria-label="Ver como">
    <option value="closer">Ver como: Closer (Work)</option>
    <option value="setter">Ver como: Setter (Work)</option>
    <option value="triage">Ver como: Triage (Work)</option>
    <option value="fulfillment">Ver como: Fulfillment (Academia)</option>
    <option value="dev">Ver como: Dev (Leadership)</option>
  </select>
  <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" id="irNumeros">Ir a Números</button>
  <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button"
    onclick="const h=document.documentElement;h.dataset.temaModo=h.dataset.temaModo==='oscuro'?'claro':'oscuro'">Claro / oscuro</button>
</div>

<nav class="dock" aria-label="Dock">
  <button class="dock__b" aria-label="Inicio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></button>
  <button class="dock__b" aria-label="Mensajes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
  <button class="dock__cierre" id="dockCierre" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="dockTxt">Cerrar el día</span></button>
</nav>

<div class="ui-scrim" id="scrim">
  <div class="ui-modal cd" role="dialog" aria-modal="true" aria-labelledby="cd-t">
    <header class="cd-cab">
      <div class="cd-cab__fila">
        <div><h2 id="cd-t">Cerrar el día</h2><p>Lunes 23 de noviembre · podés cerrarlo hasta mañana a las 10:00</p></div>
        <button class="cd-x" aria-label="Cerrar" onclick="document.getElementById('scrim').classList.add('oculto')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <nav class="cd-pasos" id="pasos" aria-label="Pasos">
        <button data-p="0">Victoria</button><button data-p="1">Mañana</button><button data-p="2">Números</button><button data-p="3">Revisar</button>
      </nav>
    </header>
    <div class="cd-cuerpo" id="cuerpo"></div>
    <footer class="cd-pie" id="pie">
      <button class="ui-btn ui-btn--secondary ui-btn--sm" id="noLab" type="button">Hoy no trabajé</button>
      <div class="der">
        <button class="ui-btn ui-btn--secondary" id="atras" type="button">Atrás</button>
        <button class="ui-btn ui-btn--primary" id="seguir" type="button">Seguir</button>
      </div>
    </footer>
  </div>
</div>

<script>
// kpis: [etiqueta, valor, promedio de 7 días, formato, viz] · viz: {spark: [7 días]} | {meta: n}
const ROLES = {
  closer: {
    nombre: 'Marlon', fuente: 'Salen de tus agendas y ventas en Work.',
    kpis: [['Cash del día', 3000, 1850, 'usd', { spark: [900, 0, 2200, 1500, 3200, 1100, 3000] }],
      ['Cierres', 2, 1.1, 'n', { meta: 2 }],
      ['Llamadas tomadas', 8, 7, 'n', { spark: [6, 7, 5, 8, 9, 6, 8] }],
      ['Show up', 80, 72, '%', { meta: 100 }]],
    embudo: ['Del día', [['Agendas', 10], ['Llamadas tomadas', 8], ['Presentaciones', 3], ['Cierres', 2]]],
    mano: [['Slots ofrecidos', '12', '']],
    detalle: [['Llamadas', [['Primeras llamadas', 6], ['Segundas llamadas', 2], ['No show', 1], ['Canceladas', 1]]],
      ['Ventas', [['Pago completo (PIF)', 1], ['Split', 0], ['Seña', 1], ['Cuotas', 0], ['Renovación', 0], ['Upsell', 0]]],
      ['Seguimiento', [['Seguimientos hechos', 5], ['Recuperos', 1], ['Referidos pedidos', 2], ['Ofertas presentadas', 3]]]],
    quien: 'lead', gente: [['MR', 'María Rodríguez', 'Cerró pago completo · 16:00'], ['JP', 'Juan Pérez', 'Dejó seña · 11:30'], ['LA', 'Laura Álvarez', 'Segunda llamada · 18:00']],
    sinGente: 'Hoy no trabajé con leads',
  },
  setter: {
    nombre: 'Elu', fuente: 'Salen del Inbox.',
    kpis: [['Agendas', 4, 2.6, 'n', { meta: 4 }],
      ['Conversaciones', 46, 39, 'n', { spark: [31, 40, 36, 44, 38, 42, 46] }],
      ['Tasa de respuesta', 50, 41, '%', { meta: 100 }],
      ['Seguimientos', 12, 14, 'n', { spark: [15, 13, 16, 12, 14, 15, 12] }]],
    embudo: ['Del día', [['Bienvenidas', 18], ['Respondidas', 9], ['Calificadas', 6], ['Link enviado', 5], ['Agendas', 4]]],
    mano: [['Aperturas', '7', 'A confirmar'], ['Aperturas en dolor', '3', 'A confirmar']],
    detalle: [['Por canal', [['Anuncios', 21], ['Inbound', 15], ['Comentarios', 10]]],
      ['Seguimiento', [['Seguimientos', 12], ['Volvieron a responder', 3]]]],
    quien: 'lead', gente: [['DM', 'Diego Martínez', 'Agendó · 15:20'], ['CS', 'Carla Suárez', 'Calificada · 12:10']],
    sinGente: 'Hoy no trabajé con leads',
  },
  triage: {
    nombre: 'Dari', fuente: 'Salen de tus confirmaciones en Work. Si algo no coincide, corregilo en el detalle.',
    kpis: [['Confirmadas', 14, 11, 'n', { meta: 17 }],
      ['Recuperos', 2, 1.4, 'n', { spark: [1, 2, 0, 1, 3, 1, 2] }],
      ['No show', 2, 3.1, 'n', { spark: [4, 3, 3, 2, 4, 3, 2], menosEsMejor: true }],
      ['Agendas a futuro', 6, 5, 'n', { spark: [4, 5, 6, 4, 5, 6, 6] }]],
    embudo: ['Agendas de hoy', [['Agendas del día', 17], ['Confirmadas', 14], ['Se presentaron', 12]]],
    mano: [], corregible: true,
    detalle: [['Hoy', [['Agendas del día', 17], ['Confirmadas', 14], ['No show', 2], ['Canceladas', 1]]],
      ['A futuro', [['Agendas a futuro', 6], ['Confirmadas a futuro', 4]]],
      ['Recuperos', [['Contactados', 8], ['Recuperados', 2], ['Low ticket ofrecido', 1]]]],
    quien: 'lead', gente: [['AG', 'Ana Gómez', 'Recupero · reagendó para el jueves'], ['PF', 'Pablo Fernández', 'Ningún horario le servía · reagendado']],
    sinGente: 'Hoy no trabajé con leads',
  },
  fulfillment: {
    nombre: 'Belén', fuente: 'Salen de la Academia.',
    kpis: [['Sesiones', 5, 4, 'n', { meta: 6 }],
      ['Presentes en clases', 23, 17, 'n', { spark: [12, 15, 14, 18, 20, 19, 23] }],
      ['Seguimientos', 11, 9, 'n', { spark: [7, 9, 8, 10, 9, 11, 11] }],
      ['Entregas corregidas', 4, 4, 'n', { meta: 4 }]],
    embudo: ['Alumnos de hoy', [['Con seguimiento', 11], ['Respondieron', 7], ['Hicieron una entrega', 4]]],
    mano: [],
    detalle: [['Sesiones', [['Onboarding', 1], ['Seguimiento', 3], ['Reactivación', 1]]],
      ['Alumnos', [['Esquemas revisados', 2], ['Observaciones', 6]]]],
    quien: 'alumno', gente: [['RS', 'Renato Silva', 'Sesión · 10:00'], ['IL', 'Iliana López', 'Entrega corregida'], ['MM', 'Marcos Melo', 'Seguimiento']],
    sinGente: 'Hoy no trabajé con alumnos',
  },
  dev: {
    nombre: 'Santi', fuente: 'Salen de Leadership.',
    kpis: [['Tiempo enfocado', 340, 290, 'min', { meta: 360 }],
      ['Tareas completadas', 4, 3, 'n', { spark: [2, 3, 5, 2, 3, 4, 4] }],
      ['Pedidos de otros', 2, 1, 'n', { meta: 2 }],
      ['Commits', 6, 5, 'n', { spark: [3, 6, 4, 7, 5, 4, 6] }]],
    embudo: ['Tiempo del día', [['Enfocado', 340], ['Reuniones', 90], ['Interrupciones', 25]], 'min'],
    mano: [],
    detalle: [['Tareas', [['Completadas', 4], ['Pedidos de otros cerrados', 2], ['Bugs', 1]]]],
    quien: 'tarea', gente: [['1469', 'Segmento C con Mario y Marlon', 'Pedido de Mario'], ['1465', 'Ningún horario me sirve', 'Pedido de Marlon']],
    sinGente: 'Hoy no cerré pedidos de otros',
  },
};

let rol = 'closer', paso = 0, cerrado = false;
const st = {};
function reset() { Object.assign(st, { elegido: null, prueba: false, sinGente: false, motivo: '', que: '', por: '', mejor: '', traba: '', noLab: false, mas: [] }); }
reset();
const $ = (id) => document.getElementById(id);
const ico = { check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>',
  img: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>' };
const avatar = (i) => i.length > 2 ? '#' : i;
const conQuien = () => ({ lead: 'un lead', alumno: 'un alumno', tarea: 'una tarea' })[ROLES[rol].quien];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function fmt(v, f) {
  if (f === 'usd') return 'US$ ' + Math.round(v).toLocaleString('es-AR');
  if (f === '%') return Math.round(v) + '<small>%</small>';
  if (f === 'min') return Math.floor(v / 60) + '<small>h</small> ' + String(Math.round(v % 60)).padStart(2, '0');
  return Math.round(v).toLocaleString('es-AR');
}

function spark(serie, menosEsMejor) {
  const w = 96, h = 50, max = Math.max(...serie), min = Math.min(...serie), r = max - min || 1;
  const pts = serie.map((v, i) => [3 + i * (w - 6) / (serie.length - 1), 4 + (h - 8) * (1 - (v - min) / r)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const [lx, ly] = pts[pts.length - 1];
  return `<svg class="st-k__viz st-spark" viewBox="0 0 ${w} ${h + 6}" aria-hidden="true">
    <path class="area" d="${d} L ${lx} ${h + 6} L 3 ${h + 6} Z"/><path class="linea" d="${d}" style="--l:300"/>
    <circle cx="${lx}" cy="${ly}"/></svg>`;
}
function anillo(v, meta) {
  const c = 2 * Math.PI * 24, p = Math.min(1, v / meta);
  return `<svg class="st-k__viz st-anillo" viewBox="0 0 62 62" aria-hidden="true" style="justify-self:end">
    <circle class="fondo" cx="31" cy="31" r="24"/><circle class="valor ${p >= 1 ? 'lleno' : ''}" cx="31" cy="31" r="24" style="--c:${c.toFixed(1)}" data-off="${(c * (1 - p)).toFixed(1)}"/>
    <text x="31" y="31">${Math.round(p * 100)}%</text></svg>`;
}

function vNumeros() {
  const x = ROLES[rol], [tit, pasos, unidad] = x.embudo, tope = pasos[0][1];
  return `<p class="cd-sub">${x.fuente} Comparado con tu promedio de los últimos 7 días.</p>
    <div class="st-hero">${x.kpis.map(([l, v, prom, f, viz], k) => {
      const dif = v - prom, menos = viz.menosEsMejor, bien = menos ? dif < 0 : dif > 0;
      const pct = prom ? Math.round(Math.abs(dif) / prom * 100) : 0;
      const cls = Math.abs(dif) < 0.05 * (prom || 1) ? 'igual' : bien ? 'sube' : 'baja';
      const flecha = cls === 'igual' ? '=' : dif > 0 ? '▲' : '▼';
      return `<div class="st-k" style="animation-delay:${k * 90}ms">
        <span class="st-k__lbl">${l}</span>
        <span class="st-k__val" data-v="${v}" data-f="${f}">${fmt(0, f)}</span>
        <span class="st-k__delta ${cls}">${flecha} ${cls === 'igual' ? 'como siempre' : pct + '%'} <span>${viz.meta ? 'meta ' + fmt(viz.meta, f).replace(/<[^>]+>/g, '') : 'vs. promedio'}</span></span>
        ${viz.meta ? anillo(v, viz.meta) : spark(viz.spark)}
      </div>`;
    }).join('')}</div>
    <div class="st-embudo"><h4>${tit}</h4>${pasos.map(([l, v], k) =>
      `<div class="st-fila"><span>${l}</span><div class="st-barra"><i data-w="${(v / tope * 100).toFixed(0)}" style="transition-delay:${400 + k * 120}ms"></i></div>
        <b>${unidad === 'min' ? fmt(v, 'min').replace(/<[^>]+>/g, '') : v}${k && unidad !== 'min' ? `<small>${Math.round(v / pasos[k - 1][1] * 100)}%</small>` : ''}</b></div>`).join('')}</div>
    ${x.mano.length ? `<div class="st-mano">${x.mano.map(([l, v, t]) => `<label class="st-m"><span>${l}${t ? `<small>${t}</small>` : ''}</span><input value="${v}" aria-label="${l}"></label>`).join('')}</div>` : ''}
    <details class="cd-det"><summary>Ver todos los números</summary><table>
      ${x.detalle.map(([g, filas]) => `<tr><td class="grupo" colspan="2">${g}</td></tr>` + filas.map(([l, v]) =>
        `<tr><td>${l}${x.corregible ? '<button type="button">Corregir</button>' : ''}</td><td>${v}</td></tr>`).join('')).join('')}
    </table></details>`;
}

function animarNumeros() {
  document.querySelectorAll('.st-k__val').forEach((el, k) => {
    const v = +el.dataset.v, f = el.dataset.f;
    if (reduce) { el.innerHTML = fmt(v, f); return; }
    const t0 = performance.now() + 150 + k * 90, dur = 1100;
    const tick = (t) => {
      const p = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = fmt(v * e, f);
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.st-anillo .valor').forEach(c => c.style.strokeDashoffset = c.dataset.off);
    document.querySelectorAll('.st-barra i').forEach(i => i.style.width = i.dataset.w + '%');
  }));
}

function vVictoria() {
  const x = ROLES[rol];
  if (st.sinGente) {
    return `<p class="cd-sub">Contá por qué no hubo ${({ lead: 'leads', alumno: 'alumnos', tarea: 'pedidos' })[x.quien]} hoy.</p>
      <div class="cd-campo"><label for="motivo">Motivo</label><textarea id="motivo" placeholder="Por ejemplo: estuve todo el día armando el workshop">${st.motivo}</textarea></div>
      <button class="cd-otra" type="button" onclick="st.sinGente=false;pintar()">Mejor elijo ${conQuien()}</button>`;
  }
  if (st.elegido == null) {
    return `<p class="cd-sub">¿Con quién fue? Elegí ${conQuien()} con ${x.quien === 'tarea' ? 'la' : 'el'} que trabajaste hoy.</p>
      <div class="cd-lista">${x.gente.map(([i, n, s], k) => `<button type="button" class="cd-persona" data-k="${k}"><i>${avatar(i)}</i><span><b>${i.length > 2 ? '#' + i + ' ' : ''}${n}</b><small>${s}</small></span><span class="chev">${ico.chev}</span></button>`).join('')}</div>
      <div class="cd-buscar"><input placeholder="Buscar otr${x.quien === 'tarea' ? 'a tarea' : 'o ' + x.quien}" aria-label="Buscar"></div>
      <button class="cd-otra" type="button" onclick="st.sinGente=true;pintar()">${x.sinGente}</button>`;
  }
  const [i, n, s] = x.gente[st.elegido];
  return `<div class="cd-elegido"><i>${avatar(i)}</i><span><b>${n}</b><br><small style="color:var(--ln-text-muted)">${s}</small></span><button type="button" onclick="st.elegido=null;pintar()">Cambiar</button></div>
    <div class="cd-campo"><label for="que">Qué pasó</label><textarea id="que" placeholder="Lo concreto: qué hizo, qué logró">${st.que}</textarea></div>
    <div class="cd-campo"><label for="por">Por qué es una victoria <small>· opcional</small></label><textarea id="por" placeholder="Qué cambia para esa persona o para el equipo">${st.por}</textarea></div>
    <div class="cd-prueba ${st.prueba ? 'ok' : ''}" id="prueba">${ico.img}<span>${st.prueba ? 'captura-whatsapp.png · <u>cambiar</u>' : 'Sumar una captura <small style="opacity:.75">· opcional</small>'}</span></div>
    ${st.mas.map(m => `<div class="cd-elegido"><i>${avatar(x.gente[m][0])}</i><span><b>${x.gente[m][1]}</b> · otra victoria</span></div>`).join('')}
    ${x.gente.length > 1 + st.mas.length ? '<button class="cd-sumar" type="button" id="sumar">+ Sumar otra victoria</button>' : ''}`;
}

function vManana() {
  return `<div class="cd-campo"><label for="mejor">Qué harías mejor mañana</label><textarea id="mejor" placeholder="Una o dos líneas">${st.mejor}</textarea></div>
    <div class="cd-campo"><label for="traba">Algo de la plataforma que te trabó <small>· opcional, les llega a los devs</small></label><textarea id="traba" placeholder="Por ejemplo: el filtro de Contacto se borra al volver">${st.traba}</textarea></div>`;
}

function vRevisar() {
  const x = ROLES[rol];
  const vic = st.sinGente ? `<p>${x.sinGente}: ${st.motivo || '—'}</p>`
    : st.elegido == null ? '<p style="color:var(--warn)">Falta elegir con quién</p>'
    : `<p><b>${x.gente[st.elegido][1]}</b>: ${st.que || '—'}</p>${st.prueba ? '<p style="color:var(--ln-text-muted)">Con captura</p>' : ''}`;
  return `<div class="cd-res">
    <div class="cd-res__b"><h4>Victoria</h4>${vic}<button class="ed" data-ir="0">Editar</button></div>
    <div class="cd-res__b"><h4>Mañana</h4><p>${st.mejor || '<span style="color:var(--warn)">Falta</span>'}</p>${st.traba ? `<p style="color:var(--ln-text-muted)">Para los devs: ${st.traba}</p>` : ''}<button class="ed" data-ir="1">Editar</button></div>
    <div class="cd-res__b"><h4>Números</h4><p>${x.kpis.map(([l, v, , f]) => `${fmt(v, f).replace(/<[^>]+>/g, '')} ${l.toLowerCase()}`).join(' · ')}</p><button class="ed" data-ir="2">Editar</button></div>
  </div><p class="cd-sub">Al cerrar, sale en el reporte de mañana a las 10:00. Lo podés editar hasta esa hora.</p>`;
}

function vListo() {
  return `<div class="cd-listo"><span class="ico">${ico.check}</span><h3>${st.noLab ? 'Marcaste el día como no laborable' : 'Día cerrado, ' + ROLES[rol].nombre}</h3>
    <p>${st.noLab ? 'No vas a figurar como pendiente.' : 'Lo podés editar hasta mañana a las 10:00.'}</p>
    <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" onclick="cerrado=false;paso=3;pintar()">Editar</button></div>`;
}

const VISTAS = [vVictoria, vManana, vNumeros, vRevisar];
const okVictoria = () => st.sinGente ? st.motivo.trim().length >= 5 : st.elegido != null && !!st.que.trim();
const okManana = () => !!st.mejor.trim();
function guardarCampos() { ['motivo', 'que', 'por', 'mejor', 'traba'].forEach(k => { const e = $(k); if (e) st[k] = e.value; }); }
function actualizarBoton() {
  $('seguir').disabled = paso === 3 ? !(okVictoria() && okManana()) : (paso === 0 && !okVictoria()) || (paso === 1 && !okManana());
}

function pintar() {
  $('cuerpo').innerHTML = cerrado ? vListo() : VISTAS[paso]();
  $('pasos').classList.toggle('oculto', cerrado);
  $('pie').classList.toggle('oculto', cerrado);
  document.querySelectorAll('#pasos button').forEach(b => {
    const p = +b.dataset.p, hecho = [okVictoria(), okManana(), paso > 2, false][p];
    b.className = p === paso ? 'actual' : hecho ? 'hecho' : '';
    b.onclick = () => { guardarCampos(); paso = p; pintar(); };
  });
  $('atras').classList.toggle('oculto', paso === 0);
  $('seguir').textContent = paso === 3 ? 'Cerrar el día' : 'Seguir';
  $('noLab').classList.toggle('oculto', paso !== 0);
  actualizarBoton();
  document.querySelectorAll('.cd-persona').forEach(b => b.onclick = () => { st.elegido = +b.dataset.k; pintar(); });
  const pr = $('prueba'); if (pr) pr.onclick = () => { guardarCampos(); st.prueba = !st.prueba; pintar(); };
  const su = $('sumar'); if (su) su.onclick = () => { guardarCampos(); const libre = ROLES[rol].gente.findIndex((_, k) => k !== st.elegido && !st.mas.includes(k)); if (libre >= 0) st.mas.push(libre); pintar(); };
  document.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { paso = +b.dataset.ir; pintar(); });
  ['motivo', 'que', 'mejor'].forEach(k => { const e = $(k); if (e) e.oninput = () => { st[k] = e.value; actualizarBoton(); }; });
  $('dockTxt').textContent = cerrado ? 'Día cerrado' : 'Cerrar el día';
  $('dockCierre').classList.toggle('ok', cerrado);
  if (!cerrado && paso === 2) animarNumeros();
}
$('seguir').onclick = () => { guardarCampos(); if (paso < 3) { paso++; pintar(); } else { cerrado = true; pintar(); } };
$('atras').onclick = () => { guardarCampos(); paso = Math.max(0, paso - 1); pintar(); };
$('noLab').onclick = () => { st.noLab = true; cerrado = true; pintar(); };
$('dockCierre').onclick = () => { $('scrim').classList.remove('oculto'); };
$('irNumeros').onclick = () => { cerrado = false; paso = 2; $('scrim').classList.remove('oculto'); pintar(); };
$('rol').onchange = (e) => { rol = e.target.value; const enNum = paso === 2; paso = enNum ? 2 : 0; cerrado = false; reset(); $('scrim').classList.remove('oculto'); pintar(); };
pintar();
</script>
</body>
</html>
