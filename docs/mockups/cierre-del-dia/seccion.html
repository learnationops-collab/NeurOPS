<!doctype html>
<html lang="es" data-tema="learnation" data-tema-modo="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cierre del día · sección · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../frontend/src/temas/temas.css">
<link rel="stylesheet" href="../../../frontend/src/temas/temas-unicos.css">
<link rel="stylesheet" href="../../../frontend/src/components/standard/standard.css">
<style>
:root{--acento:var(--ln-brand-2,#7c6cff);--ok:var(--ln-success,#3ecf8e);--warn:var(--ln-warning,#f5b84a);--mal:#f87171}
body{margin:0;min-height:100vh;background:var(--ln-page-bg);background-color:var(--ln-page-base);color:var(--ln-text-out);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px}
.mk{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;gap:8px;align-items:center}
.mk select{font:inherit;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--ln-inset-bg);color:var(--ln-text-in);border:1px solid var(--ln-border-subtle)}

.app{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.riel{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--ln-border-subtle);position:sticky;top:0;height:100vh;box-sizing:border-box}
.riel button{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ln-text-muted);background:none;border:0;cursor:pointer}
.riel button.on{background:color-mix(in srgb,var(--acento) 18%,transparent);color:var(--acento)}
.riel .pto{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:99px;background:var(--warn)}
.riel .pto.ok{background:var(--ok)}

.main{width:100%;max-width:1180px;margin:0 auto;padding:28px 32px 90px;box-sizing:border-box;display:grid;gap:20px;align-content:start}
.cab{display:flex;align-items:center;gap:16px 20px}
.cab__t{flex:1 1 auto;min-width:0}
.semana{flex:none}
@media (max-width:1100px){.cab{flex-wrap:wrap}}
.cab h1{margin:0;font-size:26px;font-weight:900;color:var(--ln-text-in)}
.cab p{margin:4px 0 0;color:var(--ln-text-muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cab__acc{margin-left:auto;display:flex;gap:10px;align-items:center}
.cab__acc .tabs{margin-left:0}
.estado{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}
.estado::before{content:'';width:7px;height:7px;border-radius:99px;background:currentColor}
.estado.curso{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.estado.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.estado.inc{background:color-mix(in srgb,var(--mal) 15%,transparent);color:var(--mal)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);margin-left:auto}
.tabs button{white-space:nowrap;border:0;background:none;font:inherit;font-size:13px;font-weight:800;color:var(--ln-text-muted);padding:7px 16px;border-radius:999px;cursor:pointer;transition:all .2s}
.tabs button.on{background:var(--acento);color:#fff}
.semana{display:flex;gap:6px;flex-wrap:wrap}
.sd{display:grid;justify-items:center;gap:3px;width:52px;padding:8px 0 7px;border-radius:14px;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);
  color:var(--ln-text-muted);font:inherit;font-size:11px;font-weight:700;cursor:pointer;transition:border-color .2s,transform .2s}
.sd b{font-size:16px;color:var(--ln-text-in)}
.sd i{width:7px;height:7px;border-radius:99px;background:var(--ln-border-subtle)}
.sd.ok i{background:var(--ok)} .sd.pend i{background:var(--warn)} .sd.venc i{background:var(--mal)}
.sd.sel{border-color:var(--acento);transform:translateY(-2px)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}.lado{position:static!important}}
.col{display:grid;gap:16px;min-width:0}
.card.ui-panel{display:grid;gap:14px;padding:20px 22px}
.card__cab{display:flex;align-items:center;gap:10px}
.card__n{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:900;background:var(--ln-inset-bg);color:var(--ln-text-muted);border:1px solid var(--ln-border-subtle);transition:all .3s;flex:none}
.card__n.ok{background:var(--ok);border-color:var(--ok);color:#06281a}
.card__n.warn{background:var(--warn);border-color:var(--warn);color:#2b1d00}
.card__cab h3{margin:0;font-size:16px;font-weight:900;color:var(--ln-text-in)}
.card__cab small{margin-left:auto;font-size:12px;color:var(--ln-text-muted);text-align:right}
.card__cab .ed{margin-left:auto;background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:700;cursor:pointer}

.cd-sub{margin:0;font-size:13px;color:var(--ln-text-muted);line-height:1.5}
.cd-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cd-persona{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--ln-border-subtle);
  background:var(--ln-inset-bg);color:var(--ln-text-in);font:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .2s}
.cd-persona:hover{border-color:var(--acento)}
.cd-persona i,.cd-elegido i{font-style:normal;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--acento);color:#fff;flex:none}
.cd-persona b{display:block;font-size:13px}
.cd-persona small{color:var(--ln-text-muted);font-size:12px}
.cd-fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cd-buscar{flex:1;min-width:200px;box-sizing:border-box;font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);color:var(--ln-text-in)}
.cd-elegido{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle)}
.cd-elegido button{margin-left:auto;background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.cd-dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.cd-dos{grid-template-columns:1fr}}
.cd-campo{display:grid;gap:6px;align-content:start}
.cd-campo label{font-size:13px;font-weight:700;color:var(--ln-text-in)}
.cd-campo label small{font-weight:500;color:var(--ln-text-muted)}
.cd-campo textarea{width:100%;box-sizing:border-box;min-height:76px;resize:vertical;padding:10px 12px;border-radius:12px;font:inherit;
  border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);color:var(--ln-text-in)}
.cd-prueba{display:flex;gap:8px;flex-wrap:wrap}
.cd-prueba button{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px dashed var(--ln-border-subtle);background:none;color:var(--ln-text-muted);font:inherit;font-size:13px;cursor:pointer}
.cd-prueba button.ok{border-style:solid;color:var(--ln-text-in)}
.cd-nota{font-size:12px;color:var(--ln-text-muted);display:flex;align-items:center;gap:6px}
.cd-otra{background:none;border:0;color:var(--ln-text-muted);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.cd-sumar{background:none;border:1px dashed var(--ln-border-subtle);border-radius:12px;color:var(--ln-text-muted);font:inherit;font-size:13px;font-weight:700;padding:10px;cursor:pointer}
.leer{display:grid;gap:4px}
.leer p{margin:0;font-size:14px;line-height:1.55;color:var(--ln-text-in)}
.leer .m{color:var(--ln-text-muted);font-size:13px}

/* Revisar antes de cerrar */
.rv{display:grid;gap:8px}
.rv__i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);transition:opacity .35s,transform .35s}
.rv__i.bloquea{border-color:color-mix(in srgb,var(--mal) 55%,transparent)}
.rv__i.aviso{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.rv__i.hecho{opacity:.55}
.rv__i .tag{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:3px 7px;border-radius:99px;flex:none}
.rv__i.bloquea .tag{background:color-mix(in srgb,var(--mal) 18%,transparent);color:var(--mal)}
.rv__i.aviso .tag{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.rv__i.hecho .tag{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.rv__i span{flex:1;font-size:13px;color:var(--ln-text-in);line-height:1.4}
.rv__i span small{display:block;color:var(--ln-text-muted);font-size:12px}
.rv__i select{font:inherit;font-size:12px;padding:6px 8px;border-radius:10px;background:var(--ln-page-base);color:var(--ln-text-in);border:1px solid var(--ln-border-subtle)}

/* --- Números ------------------------------------------------------------------------------------ */
.st-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:1100px){.st-hero{grid-template-columns:repeat(2,1fr)}}
.st-k{position:relative;overflow:hidden;padding:14px 14px 12px;border-radius:16px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);
  display:grid;gap:4px;opacity:0;transform:translateY(10px);animation:st-in .5s cubic-bezier(.2,.8,.2,1) forwards}
.st-k::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--acento) 18%,transparent) 50%,transparent 70%);
  transform:translateX(-100%);animation:st-brillo 1.3s .35s ease-out forwards;pointer-events:none}
.st-k__lbl{font-size:12px;font-weight:700;color:var(--ln-text-muted)}
.st-k__val{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ln-text-in);line-height:1.1}
.st-k__val small{font-size:14px;font-weight:700;color:var(--ln-text-muted);margin-left:2px}
.st-k__delta{font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.st-k__delta.sube{color:var(--ok)} .st-k__delta.baja{color:var(--mal)} .st-k__delta.igual{color:var(--ln-text-muted)}
.st-k__delta span{font-weight:600;color:var(--ln-text-muted)}
.st-k__viz{width:100%;height:46px}
.st-spark path.linea{fill:none;stroke:var(--acento);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:st-trazo 1.1s .25s ease-out forwards}
.st-spark path.area{fill:url(#st-grad);opacity:0;animation:st-fade .6s .9s forwards}
.st-spark circle{fill:var(--acento);r:0;animation:st-punto .3s 1.25s forwards}
.st-meta{display:grid;gap:5px;margin-top:6px}
.st-meta__b{height:8px;border-radius:99px;background:var(--ln-border-subtle);overflow:hidden}
.st-meta__b i{display:block;height:100%;width:0;border-radius:99px;background:var(--acento);transition:width 1.2s cubic-bezier(.2,.8,.2,1) .25s}
.st-meta__b i.lleno{background:var(--ok)}
.st-meta small{font-size:11px;color:var(--ln-text-muted);font-weight:700}

.st-bajo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:1100px){.st-bajo{grid-template-columns:1fr}}
.st-caja{padding:14px 16px;border-radius:16px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);display:grid;gap:10px;align-content:start;opacity:0;animation:st-in .5s .3s forwards}
.st-caja h4{margin:0;font-size:12px;font-weight:800;color:var(--ln-text-muted);text-transform:uppercase;letter-spacing:.05em}
.st-fila{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.st-fila span{color:var(--ln-text-muted)}
.st-barra{height:12px;border-radius:99px;background:var(--ln-border-subtle);overflow:hidden}
.st-barra i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acento),color-mix(in srgb,var(--acento) 55%,#2fd3ff));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.st-fila b{text-align:right;font-variant-numeric:tabular-nums;color:var(--ln-text-in)}
.st-fila b small{font-weight:600;color:var(--ln-text-muted);margin-left:4px}
.st-bloques{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;grid-auto-flow:dense;align-items:start}
.st-bloques .full{grid-column:1/-1}
.st-caja h4{display:flex;align-items:center;gap:8px}
.st-caja h4 button{margin-left:auto;background:none;border:0;color:var(--acento);font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-transform:none;letter-spacing:0}
.tag-m{font-style:normal;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--warn);padding:2px 6px;border-radius:99px;background:color-mix(in srgb,var(--warn) 14%,transparent)}
.vacio{color:var(--ln-text-muted);font-weight:700}
/* comparar */
.cmp{display:grid;grid-template-columns:minmax(140px,1.3fr) repeat(var(--n),minmax(70px,1fr));gap:8px 16px;align-items:center}
.cmp .h{font-size:11px;font-weight:900;color:var(--ln-text-muted);text-transform:uppercase;letter-spacing:.05em}
.cmp .l{font-size:13px;color:var(--ln-text-out)}
.cmp .c{display:grid;gap:4px}
.cmp .c b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in);line-height:1}
.cmp .pct{font-size:13px;font-weight:900;color:var(--ln-text-in);font-variant-numeric:tabular-nums}
.bl-vacio{display:grid;gap:6px;justify-items:start;padding:14px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);font-size:13px;color:var(--ln-text-muted)}
.cmp .mini{height:5px;border-radius:99px;background:var(--ln-border-subtle);overflow:hidden}
.cmp .mini i{display:block;height:100%;width:0;border-radius:99px;background:var(--acento);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.cmp input{width:64px;font:inherit;font-size:16px;font-weight:900;padding:3px 6px;border-radius:8px;border:1px dashed var(--acento);background:var(--ln-page-base);color:var(--ln-text-in)}
/* mix */
.mix__tot{display:flex;align-items:baseline;gap:10px;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in);line-height:1}
.mix__tot>span:last-child{font-size:13px;font-weight:600;color:var(--ln-text-muted)}
.mix__barra{display:flex;gap:3px;height:14px;border-radius:99px;overflow:hidden;background:var(--ln-border-subtle)}
.mix__barra i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.mix__ley{display:grid;gap:6px}
.mix__ley span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ln-text-out)}
.mix__ley span i{width:10px;height:10px;border-radius:3px}
.mix__ley b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ln-text-in)}
.mix__ley small{width:56px;text-align:right;color:var(--ln-text-muted);font-size:11px}
.mix__cero{margin:0;font-size:12px;color:var(--ln-text-muted)}
.mix__pie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:10px;border-top:1px solid var(--ln-border-subtle)}
.mix__pie div{display:grid;gap:2px}
.mix__pie b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in)}
.mix__pie div>span{font-size:11px;color:var(--ln-text-muted)}
/* pasos */
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.serie{display:grid;gap:8px}
.serie h5{margin:0;font-size:12px;font-weight:800;color:var(--ln-text-in)}
.serie__fila{display:flex;align-items:flex-end;gap:6px}
.paso{flex:1;display:grid;gap:3px;min-width:0}
.paso .col{height:64px;display:flex;align-items:flex-end;border-radius:8px;background:color-mix(in srgb,var(--ln-text-in) 4%,transparent)}
.paso .col i{display:block;width:100%;height:0;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--acento),color-mix(in srgb,var(--acento) 35%,transparent));transition:height .9s cubic-bezier(.2,.8,.2,1)}
.paso b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in);line-height:1.1}
.paso>span:last-child{font-size:11px;color:var(--ln-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:grid;justify-items:center;align-self:center;font-size:12px;color:var(--ln-text-muted);margin-bottom:28px}
.conv b{font-size:10px;font-weight:900;color:var(--ln-text-muted)}
/* cifras */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px 12px}
.cifra{display:grid;gap:2px;align-content:start}
.cifra b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in);line-height:1.1}
.cifras.chicas{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));padding-top:12px;border-top:1px solid var(--ln-border-subtle)}
.cifras.chicas .cifra b{font-size:20px}
.cifra b small{font-size:13px;font-weight:700;color:var(--ln-text-muted)}
.cifra>span{font-size:12px;color:var(--ln-text-muted)}
.cifra .tag-m{justify-self:start}
/* tasas y logros */
.tasas-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.st-tasa{display:grid;justify-items:center;gap:6px;text-align:center}
.st-tasa>span{font-size:12px;font-weight:700;color:var(--ln-text-muted);line-height:1.3}
.st-anillo{width:66px;height:66px}
.st-anillo circle{fill:none;stroke-width:7}
.st-anillo .fondo{stroke:var(--ln-border-subtle)}
.st-anillo .valor{stroke:var(--acento);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.st-anillo text{font:800 15px Montserrat,sans-serif;fill:var(--ln-text-in);text-anchor:middle;dominant-baseline:central}
.logros-g{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--ln-border-subtle)}
.st-logro{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:99px;border:1px solid var(--ln-border-subtle);opacity:0;animation:st-in .4s forwards}
.st-logro .med{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;border:2px dashed var(--ln-border-subtle);color:var(--ln-text-muted)}
.st-logro.si{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.st-logro.si .med{border:0;background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:inherit}
.st-logro span:last-child{font-size:12px;font-weight:800;color:var(--ln-text-muted)}
.st-logro.si span:last-child{color:var(--ln-text-in)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tile{position:relative;padding:9px 10px;border-radius:12px;display:grid;gap:2px;align-content:start;opacity:0;transform:scale(.92);animation:tile-in .45s cubic-bezier(.2,1.2,.4,1) forwards}
.tile span{font-size:11px;font-weight:600;color:var(--ln-text-muted);line-height:1.3}
.tile em{font-style:normal;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--warn)}
.tile input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;font-weight:900;padding:2px 6px;border-radius:8px;border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 7%,transparent);color:var(--ln-text-in)}
.tile.mano{background:color-mix(in srgb,var(--warn) 6%,transparent);border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent)}
.tile.mano.lleno{border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 6%,transparent)}
.tile.mano.lleno em{color:var(--ok)}
.pend-sec{display:grid;gap:8px}
.pend-sec h4{margin:4px 0 0;font-size:12px;font-weight:800;color:var(--ln-text-muted);text-transform:uppercase;letter-spacing:.05em}
.pend-sec .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@keyframes tile-in{to{opacity:1;transform:none}}

/* --- Lado ---------------------------------------------------------------------------------------- */
.lado{position:sticky;top:24px;display:grid;gap:16px}
.est.ui-panel{display:grid;gap:14px;padding:20px}
.est h3{margin:0;font-size:15px;font-weight:900;color:var(--ln-text-in)}
.est__venc{font-size:12px;color:var(--ln-text-muted);margin:0}
.chk{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.chk li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ln-text-muted);cursor:pointer}
.chk li i{width:20px;height:20px;border-radius:99px;border:2px solid var(--ln-border-subtle);display:grid;place-items:center;transition:all .25s;flex:none;font-style:normal}
.chk li.ok{color:var(--ln-text-in)}
.chk li.ok i{background:var(--ok);border-color:var(--ok);color:#06281a}
.chk li.mal i{border-color:var(--mal);color:var(--mal);font-size:12px;font-weight:900}
.chk li small{margin-left:auto;font-size:11px}
.est .ui-btn--primary{width:100%;justify-content:center}
.est__listo{display:grid;justify-items:center;gap:8px;text-align:center;padding:6px 0}
.est__listo .ico{width:52px;height:52px;border-radius:999px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.est__listo b{color:var(--ln-text-in);font-size:15px}
.est__listo p{margin:0;font-size:12px;color:var(--ln-text-muted);line-height:1.5}
.racha.ui-panel{display:grid;gap:10px;padding:18px 20px}
.racha h4{margin:0;font-size:12px;font-weight:800;color:var(--ln-text-muted);text-transform:uppercase;letter-spacing:.05em}
.racha__n{display:flex;align-items:baseline;gap:8px}
.racha__n b{font-size:30px;font-weight:900;color:var(--ln-text-in)}
.racha__n span{font-size:13px;color:var(--ln-text-muted)}
.racha p{margin:0;font-size:12px;color:var(--ln-text-muted);line-height:1.5}
.aviso{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.5;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);color:var(--ln-text-in)}
.aviso.mal{border-color:color-mix(in srgb,var(--mal) 50%,transparent);background:color-mix(in srgb,var(--mal) 8%,transparent)}

/* --- Historial ----------------------------------------------------------------------------------- */
.hi-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hi-top h3{margin:0;font-size:16px;font-weight:900;color:var(--ln-text-in)}
.hi-top .tabs{margin-left:auto}
.consta{display:grid;grid-template-columns:repeat(auto-fill,22px);gap:5px}
.consta i{width:22px;height:22px;border-radius:6px;background:var(--ln-border-subtle);transform:scale(0);animation:pop-c .35s cubic-bezier(.2,1.6,.4,1) forwards}
.consta i.ok{background:var(--ok)} .consta i.venc{background:var(--mal)} .consta i.libre{background:transparent;border:1px dashed var(--ln-border-subtle);box-sizing:border-box}
.consta i.hoy{background:var(--warn)}
.leyenda{display:flex;gap:14px;font-size:11px;color:var(--ln-text-muted);flex-wrap:wrap}
.leyenda span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.barras{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.barras div{flex:1;display:grid;align-items:end;height:100%;position:relative}
.barras div i{display:block;width:100%;height:0;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acento),color-mix(in srgb,var(--acento) 40%,transparent));transition:height .8s cubic-bezier(.2,.8,.2,1)}
.barras div.vacio i{background:var(--ln-border-subtle)}
.barras div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--ln-page-base);color:var(--ln-text-in);border:1px solid var(--ln-border-subtle)}
.ejes{display:flex;justify-content:space-between;font-size:11px;color:var(--ln-text-muted)}
.dias{display:grid;gap:6px}
.dia{border-radius:14px;border:1px solid var(--ln-border-subtle);background:var(--ln-inset-bg);overflow:hidden;opacity:0;animation:st-in .4s forwards}
.dia summary{display:grid;grid-template-columns:86px 92px 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;font-size:13px;list-style:none}
.dia summary::-webkit-details-marker{display:none}
.dia summary b{color:var(--ln-text-in)}
.dia summary .txt{color:var(--ln-text-out);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia summary .num{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ln-text-in)}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;justify-self:start}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.venc{background:color-mix(in srgb,var(--mal) 16%,transparent);color:var(--mal)}
.chip.libre{background:var(--ln-border-subtle);color:var(--ln-text-muted)}
.chip.pend{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.dia__cuerpo{padding:4px 14px 14px;display:grid;gap:6px;font-size:13px;color:var(--ln-text-out);line-height:1.5}
.dia__cuerpo b{color:var(--ln-text-in)}

@keyframes st-in{to{opacity:1;transform:none}}
@keyframes st-brillo{to{transform:translateX(100%)}}
@keyframes st-trazo{to{stroke-dashoffset:0}}
@keyframes st-fade{to{opacity:.35}}
@keyframes st-punto{to{r:3.2px}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes pop-c{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){
  .st-k,.st-caja,.tile,.dia,.st-logro,.st-logro .med{animation:none;opacity:1;transform:none}
  .st-k::after{display:none}
  .st-spark path.linea{animation:none;stroke-dashoffset:0}
  .st-spark path.area{animation:none;opacity:.35}
  .st-spark circle{animation:none;r:3.2px}
  .st-meta__b i,.st-barra i,.barras div i,.st-anillo .valor,.cmp .mini i,.mix__barra i,.paso .col i{transition:none}
  .est__listo .ico{animation:none}
  .consta i{animation:none;transform:none}
}
/* Detalle de un número */
[data-exp]{cursor:pointer;transition:box-shadow .2s,background .2s}
[data-exp]:hover,[data-exp]:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--acento) 55%,transparent);outline:none;border-radius:10px}
.st-k[data-exp]:hover{border-radius:16px}
.barras div[data-exp]:hover{box-shadow:none}
.barras div[data-exp]:hover i{filter:brightness(1.3)}
.ex.ui-modal{width:min(680px,100%);padding:0;max-height:86vh;display:flex;flex-direction:column}
.ex__cab{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 12px}
.ex__ctx{margin:0;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ln-text-muted)}
.ex__cab h2{margin:2px 0 0;font-size:20px;font-weight:900;color:var(--ln-text-in)}
.ex__x{margin-left:auto;background:none;border:0;color:var(--ln-text-muted);font-size:26px;line-height:1;cursor:pointer}
.ex__cuerpo{padding:0 24px 16px;overflow:auto;display:grid;gap:14px}
.ex__val{display:flex;align-items:baseline;gap:10px;font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ln-text-in);line-height:1}
.ex__val small{font-size:18px;color:var(--ln-text-muted)}
.ex__como{padding:12px 14px;border-radius:12px;background:var(--ln-inset-bg);border:1px solid var(--ln-border-subtle);font-size:13px;line-height:1.5;color:var(--ln-text-out)}
.ex__como b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ln-text-muted);margin-bottom:2px}
.ex__como p{margin:0}
.ex__tabla{width:100%;border-collapse:collapse;font-size:13px}
.ex__tabla th{text-align:left;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ln-text-muted);padding:6px 8px}
.ex__tabla td{padding:9px 8px;border-top:1px solid var(--ln-border-subtle);color:var(--ln-text-in)}
.ex__tabla tbody tr{opacity:0;animation:st-in .35s forwards}
.ex__tabla tbody tr:hover td{background:color-mix(in srgb,var(--acento) 8%,transparent)}
.ex__si{color:var(--ok);font-weight:800}
.ex__no{color:var(--ln-text-muted)}
.ex__mas{margin:0;font-size:12px;color:var(--ln-text-muted)}
.ex__pie{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--ln-border-subtle);font-size:12px;color:var(--ln-text-muted)}
.ex__pie .ui-btn{margin-left:auto}
@media (prefers-reduced-motion:reduce){.ex__tabla tbody tr{animation:none;opacity:1}}
.oculto{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="st-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#7c6cff" stop-opacity="0"/></linearGradient>
</defs></svg>

<div class="mk">
  <select id="rol" aria-label="Ver como">
    <option value="closer">Ver como: Closer (Work)</option>
    <option value="setter">Ver como: Setter (Work)</option>
    <option value="triage">Ver como: Triage (Work)</option>
    <option value="fulfillment">Ver como: Fulfillment (Academia)</option>
    <option value="dev">Ver como: Dev (Leadership)</option>
  </select>
  <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" id="simular">Simular las 10:00 de mañana</button>
  <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button"
    onclick="const h=document.documentElement;h.dataset.temaModo=h.dataset.temaModo==='oscuro'?'claro':'oscuro'">Claro / oscuro</button>

<div class="app">
  <nav class="riel" aria-label="Secciones">

    <button aria-label="Mensajes"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <button aria-label="Agendas"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    <button class="on" aria-label="Reporte"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="pto" id="rielPto"></span></button>
  </nav>

  <main class="main">
    <header class="cab">
      <div class="cab__t"><h1>Reporte</h1><p id="cabSub"></p></div>
      <div class="semana" id="semana" aria-label="Tu semana"></div>
      <div class="cab__acc">
        <div class="tabs" id="tabs"><button data-tab="hoy" class="on">Hoy</button><button data-tab="hist">Historial</button></div>
        <button class="ui-btn ui-btn--secondary ui-btn--sm" type="button" id="noLab">Hoy no trabajé</button>
      </div>
    </header>
    <div class="col" id="vistaHoy"></div>

</div>
