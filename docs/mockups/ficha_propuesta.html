<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha por persona · propuesta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Propuesta: una ficha por persona (person_uuid). Tres zonas: quién es (cabecera), qué toca ahora
   (tarjetas con una acción principal) y su historia (una sola línea de tiempo), con dos paneles
   de consulta: Plata y Academia. Reemplaza las 8 pestañas de ficha_hoy.html. */
:root{
  --bg:#020617; --page:linear-gradient(135deg,#020617 0%,#0A0E3D 50%,#05082D 100%);
  --el:rgba(255,255,255,.08); --el-h:rgba(255,255,255,.12); --el-2:rgba(255,255,255,.04); --inset:rgba(0,0,0,.30);
  --text:#fff; --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.40);
  --b1:rgba(255,255,255,.06); --b2:rgba(255,255,255,.15); --b3:rgba(255,255,255,.38);
  --brand:#FF3FA4; --blue:#1323C6; --flot:#0B1030;
  --ok:#2FBF8F; --ok-s:#071A24; --ok-b:#10413D;
  --warn:#D9A441; --warn-s:#1A171C; --warn-b:#473924;
  --bad:#E85C4A; --bad-s:#1B0F1D; --bad-b:#4C2227;
  --info:#4E8BD8; --info-s:#0A152C; --info-b:#1A3155;
  --idle:#7F8CA8; --idle-s:#0E1326; --idle-b:#252C42;
  --aqua:#2EE6C8; --amber:#FFB547; --lilac:#7D8BFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--text);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,124,255,.55)}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--muted)} .faint{color:var(--faint)} .mono{font-variant-numeric:tabular-nums}
h2,h3,h4,p{margin:0}

/* barra del mockup */
.mk{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 24px;
  background:rgba(2,6,23,.9);backdrop-filter:blur(10px);border-bottom:1px dashed var(--b2)}
.mk .tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#020617;background:var(--aqua);padding:3px 8px;border-radius:6px}
.mk b{font-size:13px} .mk .sp{flex:1}
.mk a{color:var(--muted);font-size:12px;font-weight:600}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--inset);border:1px solid var(--b1);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--el-h);color:var(--text)}

.lay{padding:24px 16px 80px;display:flex;justify-content:center}
.modal{width:min(1180px,100%);border-radius:32px;background:rgba(2,6,23,.93);border:1px solid var(--b2);
  box-shadow:0 8px 32px rgba(0,0,0,.4),0 30px 80px -30px rgba(19,35,198,.5);overflow:hidden}

/* ---------- 1. quién es ---------- */
.cab{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:22px 24px 18px;border-bottom:1px solid var(--b1);
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent)}
.foto{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:20px;font-weight:900;color:#020617;
  background:conic-gradient(from 200deg,var(--aqua),var(--lilac),var(--brand),var(--amber),var(--aqua))}
.cab h2{font-size:26px;font-weight:900;letter-spacing:-.025em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.estado{margin-top:6px;font-size:14px;line-height:1.5;color:var(--muted)}
.estado b{color:var(--text);font-weight:700}
.estado .malo{color:var(--bad);font-weight:700}
.contactos{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cto{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--el-2);border:1px solid var(--b1);font-size:12.5px;font-weight:600}
.cto svg{width:13px;height:13px;color:var(--muted)}
.cto.wa svg{color:var(--ok)}
.cto .cp{opacity:.5;margin-left:2px}
.cab-der{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.ibtns{display:flex;gap:6px}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--b1);background:rgba(0,0,0,.3);display:grid;place-items:center;color:rgba(255,255,255,.65)}
.duenio{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:800;background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--b2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok-b);background:var(--ok-s)} .chip.warn{color:var(--warn);border-color:var(--warn-b);background:var(--warn-s)}
.chip.bad{color:var(--bad);border-color:var(--bad-b);background:var(--bad-s)} .chip.info{color:var(--info);border-color:var(--info-b);background:var(--info-s)}
.chip.idle{color:var(--idle);border-color:var(--idle-b);background:var(--idle-s)} .chip.brand{color:var(--brand);border-color:rgba(255,63,164,.4)}
@media(max-width:760px){.cab{grid-template-columns:1fr}.cab-der{align-items:flex-start}.foto{display:none}}

/* ---------- 2. ahora ---------- */
.ahora{padding:18px 24px;display:grid;gap:10px;border-bottom:1px solid var(--b1)}
.zona-tit{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.tareas{display:grid;gap:10px}
.tarea{display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border-radius:18px;
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  background:radial-gradient(120% 160% at 0% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 55%),rgba(255,255,255,.04)}
.tarea.sec{--c:var(--idle);opacity:.92}
.tarea .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tarea .ico svg{width:22px;height:22px}
.tarea h4{font-size:16px;font-weight:800}
.tarea p{font-size:13px;color:var(--muted);margin-top:3px}
.tarea .bts{display:flex;gap:8px;align-items:center}
@media(max-width:760px){.tarea{grid-template-columns:1fr}.tarea .ico{display:none}}
.btn{height:42px;padding:0 18px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--b3);background:transparent;color:var(--muted);white-space:nowrap}
.btn.cta{background:var(--brand);border-color:var(--brand);color:#020617}
.btn.sm{height:32px;font-size:10.5px;padding:0 12px}
.mas{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:260px;padding:6px;border-radius:16px;background:var(--flot);border:1px solid var(--b2);
  box-shadow:0 20px 40px rgba(0,0,0,.5);display:grid}
.menu button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:13px;font-weight:600}
.menu button:hover{background:var(--el)}
.menu small{display:block;font-size:11px;color:var(--faint);font-weight:500}
.menu hr{border:0;border-top:1px solid var(--b1);margin:6px 4px}
.menu .peligro{color:var(--bad)}
.flujo{padding:16px 18px;border-radius:18px;border:1px dashed var(--b3);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.flujo b{color:var(--text)}

/* ---------- 3. historia + paneles ---------- */
.cuerpo{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);min-height:420px}
@media(max-width:900px){.cuerpo{grid-template-columns:1fr}}
.historia{padding:18px 24px 0;border-right:1px solid var(--b1);display:flex;flex-direction:column;gap:12px;min-width:0}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtro{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--b1);background:var(--el-2);font-size:12px;font-weight:700;color:var(--muted)}
.filtro[aria-pressed="true"]{background:var(--text);color:#020617;border-color:var(--text)}
.linea{position:relative;display:grid;gap:4px;padding-left:22px}
.linea::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--aqua),var(--lilac),var(--brand));opacity:.35;border-radius:2px}
.mes{font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px -22px;padding-left:22px}
.ev{position:relative;display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 12px;border-radius:12px}
.ev::before{content:'';position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;background:#020617;border:2px solid var(--c)}
.ev:hover{background:var(--el-2)}
.ev b{font-size:13.5px;font-weight:700}
.ev p{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.ev .cuando{font-size:11.5px;color:var(--faint);white-space:nowrap;text-align:right}
.ev.nota .bur{margin-top:6px;padding:9px 12px;border-radius:4px 12px 12px 12px;background:var(--el);font-size:13px;line-height:1.5}
.ev.agenda{grid-template-columns:1fr;padding:12px 14px;border:1px solid var(--b1);background:rgba(255,255,255,.03);border-radius:14px}
.ag-cab{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.ag-cab b{font-size:14px}
.ag-det{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--b1);gap:10px}
.ev.agenda.abierta .ag-det{display:grid}
.kv{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px}
.kv span{color:var(--muted)} .kv b{font-weight:600;color:var(--text)}
.objec{padding:9px 12px;border-left:2px solid var(--warn);background:var(--warn-s);border-radius:0 10px 10px 0;font-size:12.5px}
.ag-bts{display:flex;gap:6px;flex-wrap:wrap}
.escribir{position:sticky;bottom:0;margin:6px -24px 0;padding:12px 24px 16px;background:linear-gradient(transparent,rgba(2,6,23,.95) 30%);display:grid;gap:8px}
.escribir .fila{display:flex;gap:8px}
.campo{flex:1;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--b2);background:var(--inset);font-size:14px}
.enviar{width:46px;height:46px;border-radius:14px;border:0;background:var(--brand);color:#020617;display:grid;place-items:center}
.avisar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--faint)}
.avisar button{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--b1);background:none;font-size:11.5px;color:var(--muted)}
.avisar button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}

.lado{padding:18px 20px;display:grid;gap:14px;align-content:start;background:rgba(255,255,255,.015)}
.pnl{border-radius:18px;border:1px solid var(--b1);background:var(--el-2);padding:16px 18px;display:grid;gap:12px}
.pnl-tit{display:flex;justify-content:space-between;align-items:center}
.pnl-tit h3{font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{display:grid;gap:2px}
.cifra small{font-size:11px;color:var(--faint)}
.cifra b{font-size:17px;font-weight:800}
.barra{height:6px;border-radius:6px;background:var(--b1);overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.cuotas{display:grid;gap:4px}
.cuota{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:12.5px;padding:6px 8px;border-radius:10px}
.cuota.venc{background:var(--bad-s)}
.mini{display:grid;gap:6px;font-size:12.5px}
.mini div{display:flex;justify-content:space-between;gap:10px}
.mini span{color:var(--muted)}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.peligro-zona{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 24px;border-top:1px solid var(--b1);font-size:12px;color:var(--faint)}
.peligro-zona button{border:0;background:none;color:var(--faint);font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.peligro-zona button:hover{color:var(--bad)}
.nota-mk{max-width:1180px;margin:16px auto 0;padding:0 24px;font-size:12.5px;color:var(--muted);line-height:1.6}
.nota-mk b{color:var(--text)}
</style>
</head>

</div>
<p class="nota-mk" id="nota"></p>
<div class="lay"><div class="modal" role="dialog" id="app"></div></div>

  lead: {
    nombre: 'Diego Ramírez Soto', ini: 'DR', chips: [['Lead · segmento A', 'brand'], ['Viene de triage', 'info']],
    estado: '<b>Llamada hoy a las 17:35</b> (en 2 h 10 m) · todavía no compró · MIR 2027 · decide solo',
    contactos: [['wa', '+57 300 412 9087'], ['mail', 'diego.ramirez.s@gmail.com'], ['ig', '@diegors.med']],
    closer: ['JC', 'Jean Carlo'],
    tareas: [
      { c: 'var(--brand)', ico: 'phonecall', tit: 'Llamada hoy · 17:35', sub: 'Con Jean Carlo · contactado, falta confirmar · aprobado por Sofía (triage)', cta: 'Confirmar', flujo: 'confirmar',
        sec: ['Reprogramar', 'Canceló', 'No califica'] },
    ],
    eventos: [
      { mes: 'Octubre 2026' },
      { t: 'agenda', tipo: 'llamadas', id: 'l1', c: 'var(--brand)', tit: 'Llamada · hoy 17:35', chip: ['Confirmando', 'info'], cuando: 'en 2 h',
        kv: [['Closer', 'Jean Carlo'], ['Fuente', 'Instagram · ManyChat'], ['Confirmación', 'Contactado']], bts: ['Confirmar', 'Reprogramar', 'Canceló'] },
      { t: 'nota', tipo: 'notas', c: 'var(--info)', quien: 'Sofía · Triage', cuando: 'ayer 18:02', txt: 'Puede invertir; decide solo. Le interesa MIR 2027. Pasó a closing.' },
      { t: 'nota', tipo: 'notas', c: 'var(--ok)', quien: 'Ana · Setter', cuando: 'lun 20:15', txt: 'Muy interesado. Pidió que lo llamen después de las 17.' },
      { t: 'ev', tipo: 'llamadas', c: 'var(--idle)', tit: 'Agendó la llamada', txt: 'Por Ana (setter)', cuando: 'lun 27 oct' },
      { t: 'ev', tipo: 'form', c: 'var(--lilac)', tit: 'Completó el formulario · segmento A (+5)', txt: 'MIR · residente · invierte más de $1,000 · decide solo', cuando: 'sáb 25 oct', form: true },
      { t: 'ev', tipo: 'notas', c: 'var(--info)', tit: 'Primer contacto por Instagram', txt: 'Escribió «MIR»', cuando: 'sáb 25 oct' },
    ],
    plata: false, academia: false,
  },
};
const FILTROS = [['todo', 'Todo'], ['llamadas', 'Llamadas'], ['plata', 'Plata'], ['notas', 'Notas'], ['academia', 'Academia'], ['form', 'Formulario']];

const S = { caso: 'cliente', filtro: 'todo', abiertas: new Set(['a30', 'l1']), menu: false, flujo: null, avisar: new Set(), extra: [] };

// ---------- zonas ----------
function cabecera(c) {
  return `<header class="cab">
    <div class="foto">${c.ini}</div>
    <div>
      <h2>${c.nombre} ${c.chips.map(([t, k]) => `<span class="chip ${k}">${t}</span>`).join('')}</h2>
      <p class="estado">${c.estado}</p>
      <div class="contactos">${c.contactos.map(([i, v]) => `<button class="cto ${i}">${ic(i)}${v}<span class="cp">${ic('copy', 11)}</span></button>`).join('')}
        <button class="cto" title="Todos sus correos, teléfonos e instagrams">+2 datos</button></div>
    </div>
    <div class="cab-der">
      <div class="ibtns"><button class="ibtn" title="Editar los datos de la persona">${ic('pencil')}</button><button class="ibtn" title="Cerrar">${ic('x')}</button></div>
      <span class="duenio"><span class="av">${c.closer[0]}</span>Lo lleva <b style="color:var(--text)">${c.closer[1]}</b> <button class="link">Pasar</button></span>
    </div>
  </header>`;
}

function ahora(c) {
  const flujo = S.flujo ? `<div class="flujo">${{
    pago: '<span>Acá se abre el <b>camino del pago</b> (3 pantallas: qué cuota, cuánto y por dónde, revisión) dentro de la ficha, con la cuota 2 ya elegida. Al terminar, vuelve acá.</span>',
    confirmar: '<span>Acá se abre <b>la confirmación de esa llamada</b>: la etapa (Por contactar · Contactado · Confirmado) y la nota. Al terminar, vuelve acá.</span>',
    venta: '<span>Acá se abre <b>Registrar una venta</b> (venta nueva o pago, ADR-W013) dentro de la ficha.</span>',
    reporte: '<span>Acá se abre <b>el reporte de esa llamada</b> (Asistió, No asistió, Canceló, Reagenda).</span>',
  }[S.flujo]}<button class="btn sm" data-act="cerrar-flujo">Volver a la ficha</button></div>` : '';
  return `<section class="ahora" aria-label="Qué toca ahora">
    <div class="zona-tit"><span>Ahora</span>
      <span class="mas"><button class="btn sm" data-act="menu">${ic('dots', 14)}Más acciones</button>
      ${S.menu ? `<div class="menu">
        <button data-flujo="venta">${ic('dollar')}<span>Registrar una venta<small>Venta nueva o pago de algo que ya compró</small></span></button>
        <button>${ic('cal')}<span>Agendar otra llamada</span></button>
        <button>${ic('clock')}<span>Agendar seguimiento</span></button>
        ${c.plata ? `<button>${ic('wallet')}<span>Armar o editar el plan de cuotas</span></button>` : ''}
        <button>${ic('user')}<span>Pasar a otro closer o a triage</span></button>
      </div>` : ''}</span></div>
    <div class="tareas">${c.tareas.map((t, i) => `<div class="tarea" style="--c:${t.c}">
      <span class="ico">${ic(t.ico)}</span>
      <div><h4>${t.tit}</h4><p>${t.sub}</p></div>
      <div class="bts">${t.sec.map((s) => `<button class="btn sm">${s}</button>`).join('')}
        <button class="btn ${i === 0 ? 'cta' : ''}" data-flujo="${t.flujo}">${t.cta}</button></div></div>`).join('')}</div>
    ${flujo}
  </section>`;
}

function evento(e) {
  if (e.mes) return `<div class="mes">${e.mes}</div>`;
  if (e.t === 'nota') {
    return `<div class="ev nota" style="--c:${e.c}"><div><b>${e.quien}</b><div class="bur">${e.txt}</div></div><span class="cuando">${e.cuando}</span></div>`;
  }
  if (e.t === 'agenda') {
    const ab = S.abiertas.has(e.id);
    return `<div class="ev agenda ${ab ? 'abierta' : ''}" style="--c:${e.c}">
      <div class="ag-cab"><span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${ic('phonecall', 14)}<b>${e.tit}</b><span class="chip ${e.chip[1]}">${e.chip[0]}</span>
        ${e.grabacion ? `<span class="chip brand">${ic('video', 11)}Grabación</span>` : ''}</span>
        <span style="display:flex;gap:10px;align-items:center"><span class="cuando">${e.cuando}</span><button class="link" data-ag="${e.id}">${ab ? 'Cerrar' : 'Ver'}</button></span></div>
      <div class="ag-det">
        <div class="kv">${e.kv.map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('')}</div>
        ${e.objecion ? `<div class="objec"><b>“ Objeción</b> · ${e.objecion}</div>` : ''}
        <div class="ag-bts">${e.bts.map((b, i) => `<button class="btn sm${i === 0 && b === 'Confirmar' ? ' cta' : ''}" ${b === 'Confirmar' ? 'data-flujo="confirmar"' : b === 'Ver reporte' ? 'data-flujo="reporte"' : ''}>${b}</button>`).join('')}</div>
      </div></div>`;
  }
  return `<div class="ev" style="--c:${e.c}"><div><b>${e.tit}</b><p>${e.txt}</p>${e.form ? '<button class="link" style="margin-top:4px">Ver las respuestas</button>' : ''}</div><span class="cuando">${e.cuando}</span></div>`;
}

function historia(c) {
  const lista = [...S.extra, ...c.eventos].filter((e) => e.mes || S.filtro === 'todo' || e.tipo === S.filtro);
  return `<section class="historia" aria-label="Su historia">
    <div class="zona-tit"><span>Su historia</span></div>
    <div class="filtros">${FILTROS.map(([k, l]) => `<button class="filtro" data-filtro="${k}" aria-pressed="${S.filtro === k}">${l}</button>`).join('')}</div>
    <div class="linea">${lista.map(evento).join('')}</div>
    <div class="escribir">
      <div class="avisar">Avisar a ${['Jean Carlo', 'Kerwin', 'Ana', 'Sofía'].map((p) => `<button data-avisar="${p}" aria-pressed="${S.avisar.has(p)}">${p}</button>`).join('')}</div>
      <div class="fila"><input class="campo" id="nota-in" placeholder="Escribí una nota sobre ${c.nombre.split(' ')[0]}…"><button class="enviar" data-act="enviar" title="Enviar nota">${ic('send')}</button></div>
    </div>
  </section>`;
}

function lado(c) {
  const plata = c.plata ? `<div class="pnl">
      <div class="pnl-tit"><h3>${ic('wallet', 14)}Plata</h3><button class="link">Corregir</button></div>
      <div class="cifras"><div class="cifra"><small>Total</small><b class="mono">$1,800</b></div><div class="cifra"><small>Pagó</small><b class="mono" style="color:var(--ok)">$1,000</b></div>
        <div class="cifra"><small>Debe</small><b class="mono" style="color:var(--bad)">$800</b></div></div>
      <div class="barra"><i style="width:55.5%;background:var(--ok)"></i><i style="width:22.2%;background:var(--bad)"></i></div>
      <div class="cuotas">
        <div class="cuota"><span class="chip ok">${ic('check', 10)}</span><span>Cuota 1 · 20 oct</span><b class="mono">$400</b><span class="faint" style="font-size:11px">pagada</span></div>
        <div class="cuota venc"><span class="chip bad">!</span><span>Cuota 2 · 25 oct</span><b class="mono">$400</b><button class="btn sm cta" data-flujo="pago" style="height:26px">Cobrar</button></div>
        <div class="cuota"><span class="chip idle">3</span><span>Cuota 3 · 25 nov</span><b class="mono">$400</b><span class="faint" style="font-size:11px">pendiente</span></div>
      </div>
      <button class="link" style="justify-self:start">Ver las 2 ventas y los 2 pagos</button>
    </div>` : `<div class="pnl"><div class="pnl-tit"><h3>${ic('wallet', 14)}Plata</h3></div><p class="mut" style="font-size:13px">Todavía no compró. Precio de lista de MIR: <b style="color:var(--text)">$1,800</b>.</p>
      <button class="btn sm" data-flujo="venta" style="justify-self:start">${ic('dollar', 13)}Registrar una venta</button></div>`;
  const academia = c.academia ? `<div class="pnl">
      <div class="pnl-tit"><h3>${ic('grad', 14)}Academia</h3><span class="chip ok">Vigente</span></div>
      <div class="mini"><div><span>Acceso</span><b>RR · hasta el 14 feb (109 días)</b></div><div><span>Entra con</span><b>mfernanda.lopez@gmail.com</b></div>
        <div><span>Lecciones</span><b>22 de 140</b></div><div><span>Esta semana</span><b>6 h · racha de 5 días</b></div><div><span>Tickets abiertos</span><b style="color:var(--warn)">1</b></div></div>
      <div style="display:flex;gap:12px"><button class="link">Prórroga</button><button class="link">Corregir mail</button><button class="link">Ver todo</button></div>
    </div>` : `<div class="pnl"><div class="pnl-tit"><h3>${ic('grad', 14)}Academia</h3><span class="chip idle">Sin cuenta</span></div>
      <p class="mut" style="font-size:13px">Se le crea al registrar la venta, con su correo.</p></div>`;
  const perfil = `<div class="pnl">
      <div class="pnl-tit"><h3>${ic('file', 14)}Perfil</h3><button class="link">Ver formulario</button></div>
      <div class="mini">${(S.caso === 'cliente'
    ? [['Examen', 'ENARM'], ['Profesión', 'Médica general'], ['Meta', 'Residencia en pediatría'], ['Llegó por', 'Instagram · ManyChat'], ['Segmento', 'B · +2']]
    : [['Examen', 'MIR 2027'], ['Profesión', 'Residente'], ['Invierte', 'Más de $1,000'], ['Llegó por', 'Instagram · ManyChat'], ['Segmento', 'A · +5']])
    .map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div></div>`;
  return `<aside class="lado">${S.caso === 'cliente' ? plata + academia + perfil : perfil + plata + academia}</aside>`;
}

function render() {
  const c = CASOS[S.caso];
  document.getElementById('caso').innerHTML = [['cliente', 'Alumna con cuotas'], ['lead', 'Lead nuevo, llamada hoy']]
    .map(([k, l]) => `<button data-caso="${k}" aria-pressed="${S.caso === k}">${l}</button>`).join('');
  document.getElementById('nota').innerHTML = S.caso === 'cliente'
    ? 'Misma alumna que en <b>ficha_hoy.html</b>. Ya no hay agenda ancla: la ficha es de la persona, y cada llamada es una tarjeta en su historia. Lo urgente (la cuota vencida) y lo próximo (la llamada del jueves) están arriba, cada uno con su botón.'
    : 'El mismo lead de hoy. Antes de la llamada, lo que manda es confirmarla: arriba la tarjeta, a la derecha el perfil (formulario y segmento) en vez del cobro.';
  document.getElementById('app').innerHTML = `${cabecera(c)}${ahora(c)}<div class="cuerpo">${historia(c)}${lado(c)}</div>
    <footer class="peligro-zona"><span>Ficha de la persona · se abre por person_uuid desde el buscador, el mazo o cualquier lista</span>
      <span><button>Dar de baja</button> · <button>Unir con otra persona</button> · <button>Eliminar</button></span></footer>`;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-caso],[data-filtro],[data-ag],[data-act],[data-flujo],[data-avisar]');
  if (!t) { if (S.menu) { S.menu = false; render(); } return; }
  if (t.dataset.caso) { S.caso = t.dataset.caso; S.flujo = null; S.extra = []; S.filtro = 'todo'; }
  else if (t.dataset.filtro) S.filtro = t.dataset.filtro;
  else if (t.dataset.ag) { const id = t.dataset.ag; S.abiertas.has(id) ? S.abiertas.delete(id) : S.abiertas.add(id); }
  else if (t.dataset.flujo) { S.flujo = t.dataset.flujo; S.menu = false; }
  else if (t.dataset.avisar) { const p = t.dataset.avisar; S.avisar.has(p) ? S.avisar.delete(p) : S.avisar.add(p); }
  else if (t.dataset.act === 'menu') S.menu = !S.menu;
  else if (t.dataset.act === 'cerrar-flujo') S.flujo = null;
  else if (t.dataset.act === 'enviar') {
    const v = document.getElementById('nota-in').value.trim();
    if (!v) return;
    S.extra.unshift({ t: 'nota', tipo: 'notas', c: 'var(--brand)', quien: `Jean Carlo · Closer${S.avisar.size ? ` · avisó a ${[...S.avisar].join(', ')}` : ''}`, cuando: 'recién', txt: v });
    S.avisar.clear();
  }
  render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'nota-in') document.querySelector('[data-act="enviar"]').click(); });
render();
</script>
</body>
</html>
