<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportar venta · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mockup de la pestaña «Resultado» de la ficha cuando el closer reporta una venta.
   Recrea el árbol de frontend/src/components/ficha/arbolResultado*.js (mismas preguntas, mismo
   orden, mismas ramas) para poder rediseñar el frontend sin tocar la app.
   Tokens: tema Modern oscuro (learnation-ds.css). */
:root{
  --bg:#020617; --page:linear-gradient(135deg,#020617 0%,#0A0E3D 50%,#05082D 100%);
  --el:rgba(255,255,255,.08); --el-h:rgba(255,255,255,.12); --el-2:rgba(255,255,255,.04); --inset:rgba(0,0,0,.34);
  --text:#fff; --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.42);
  --b1:rgba(255,255,255,.07); --b2:rgba(255,255,255,.15); --b3:rgba(255,255,255,.34);
  --brand:#FF3FA4; --blue:#1323C6; --focus-blue:#5B7CFF;
  --ok:#2FBF8F; --warn:#D9A441; --bad:#E85C4A; --info:#4E8BD8;
  --ok-bg:#071A24; --ok-b:#10413D; --warn-bg:#1A171C; --warn-b:#473924; --bad-bg:#1B0F1D; --bad-b:#4C2227;
  --aqua:#2EE6C8; --magenta:#FF3FA4; --amber:#FFB547; --lilac:#7D8BFF;
  --rc:16px; --pill:999px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--text);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(91,124,255,.55)}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)} .faint{color:var(--faint)}
h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
p{margin:0}

/* ---------- barra del mockup (no es parte de la app) ---------- */
.mk{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;
  padding:12px 24px;background:rgba(2,6,23,.86);backdrop-filter:blur(10px);border-bottom:1px dashed var(--b2)}
.mk b{font-size:13px;letter-spacing:.04em}
.mk .tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#020617;background:var(--amber);
  padding:3px 8px;border-radius:6px}
.mk .sp{flex:1}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:var(--pill);background:var(--inset);border:1px solid var(--b1);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:var(--pill);font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--el-h);color:var(--text)}
.mk-cont{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.mk-cont b{color:var(--text);font-size:15px;margin-right:4px}
.mk-btn{border:1px solid var(--b2);background:var(--el-2);border-radius:var(--pill);padding:7px 14px;font-weight:600;font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px}
.mk-btn[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}

/* ---------- ventana de la ficha ---------- */
.lay{display:flex;gap:20px;align-items:flex-start;justify-content:center;padding:28px 24px 120px}
.win{width:min(1120px,100%);border-radius:28px;background:rgba(2,6,23,.96);border:1px solid var(--b1);
  box-shadow:0 30px 80px -30px rgba(19,35,198,.55)}
.win-cab{padding:20px 20px 0}
.cab{display:grid;gap:16px;padding:22px 28px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 70%)}
.cab-tit{display:flex;align-items:center;justify-content:space-between;gap:16px}
.cab-tit h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.cab-x{width:36px;height:36px;border-radius:12px;border:1px solid var(--b1);background:var(--el-2);display:grid;place-items:center}
.cab-datos{display:grid;grid-template-columns:repeat(5,minmax(0,auto));justify-content:start;gap:16px clamp(28px,4vw,56px)}
.dato{display:grid;gap:10px;white-space:nowrap}
.rot{display:inline-flex;align-items:center;gap:6px;letter-spacing:.16em;font-size:10px;font-weight:700;text-transform:uppercase;opacity:.75}
.rot svg{width:12px;height:12px}
.val{font-size:15px;font-weight:600;line-height:28px;display:inline-flex;align-items:center;gap:8px}
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:800;
  background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,191,143,.18)}
@media (max-width:860px){.cab-datos{grid-template-columns:repeat(2,minmax(0,1fr))}.dato{white-space:normal}}

.tabs{display:flex;gap:20px;padding:0 20px;margin-top:16px;border-bottom:1px solid var(--b1);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:12px 0;border:0;background:none;
  color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.tab svg{width:14px;height:14px;opacity:.75}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
.panel{padding:20px}

/* ---------- pestaña Resultado ---------- */
.res{display:grid;grid-template-columns:124px minmax(0,1fr);gap:24px;align-items:stretch}
.res-main{display:flex;flex-direction:column;gap:24px;min-width:0}
.hitos{display:flex;flex-direction:column;gap:12px;min-height:300px;padding:4px 16px 8px 0;border-right:1px solid var(--b1);opacity:.75}
.hitos:hover{opacity:1}
.hitos-tit{font-size:9px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.stp{flex:1;display:flex;flex-direction:column}
.paso{position:relative;flex:1 1 0;min-height:44px;display:grid;grid-template-columns:14px 1fr;column-gap:8px;align-content:start;
  font-size:11.5px;line-height:14px;color:var(--muted)}
.paso:last-child{flex:0 0 auto;min-height:0}
.paso:not(:last-child)::after{content:'';position:absolute;left:6px;top:17px;bottom:3px;width:2px;border-radius:2px;background:var(--b1)}
.paso.fill:not(:last-child)::after{background:linear-gradient(180deg,var(--aqua),var(--lilac),var(--magenta))}
.paso i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3);background:var(--bg);display:grid;place-items:center}
.paso[data-e="hecho"] i{background:var(--aqua);border-color:var(--aqua);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.paso[data-e="alerta"] i{background:var(--amber);border-color:var(--amber);animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.paso.sig i{border-color:var(--brand);animation:late 2s ease-in-out infinite}
.paso.sig{color:var(--text)}
.paso small{grid-column:2;font-size:10px;color:var(--faint);margin-top:3px;white-space:normal}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(255,63,164,.55)}50%{box-shadow:0 0 0 4px rgba(255,63,164,.12),0 0 10px 2px rgba(125,139,255,.45)}}
@media (max-width:760px){
  .res{grid-template-columns:1fr;gap:16px}
  .hitos{min-height:0;padding:0 0 12px;border-right:0;border-bottom:1px solid var(--b1)}
  .stp{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
  .paso,.paso:last-child{flex:0 0 auto;min-height:0}.paso::after{display:none}
}

.prog{display:grid;gap:8px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prog-riel{height:3px;border-radius:3px;background:var(--b1);overflow:hidden}
.prog-riel i{display:block;height:100%;background:var(--brand);transition:width .25s ease-out}

.entra{animation:entra .18s ease-out}
@keyframes entra{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.raices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.raiz{--c:#fff;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:18px;border-radius:20px;text-align:left;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),
    radial-gradient(90% 120% at 100% 100%,rgba(19,35,198,.22),transparent 65%),rgba(255,255,255,.05);
  font-weight:700;font-size:15px;transition:transform .2s,box-shadow .25s,border-color .2s}
.raiz:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 10px 28px -14px var(--c)}
.raiz svg{width:24px;height:24px;color:var(--c);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 60%,transparent))}
.otras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.otra{height:56px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--rc);
  border:1px solid var(--b2);background:var(--el-2);font-weight:600;font-size:14.5px}
.otra:hover{border-color:var(--b3)}
@media (max-width:640px){.raices{grid-template-columns:repeat(2,minmax(0,1fr))}.otras{grid-template-columns:1fr}}

.ayuda{font-size:13px;color:var(--muted);margin-top:6px}
.ops{display:grid;gap:12px;margin-top:16px}
.op{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:2px;align-items:center;
  min-height:64px;padding:16px 20px;border-radius:var(--rc);text-align:left;border:1px solid var(--b3);
  background:rgba(255,255,255,.056);transition:border-color .25s,transform .15s}
.entra .op,.entra .ficha{animation:cae .16s ease-out both}
.op:hover{transform:translateY(-2px);border-color:rgba(255,63,164,.35)}
.op[aria-pressed="true"]{border-color:rgba(255,63,164,.6);background:linear-gradient(120deg,rgba(255,63,164,.16),rgba(78,139,216,.12),rgba(91,124,255,.1))}
.op > :not(.op-ico){grid-column:2}
.op.sin-ico > *{grid-column:1 / -1}
.op-ico{grid-row:span 3;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.06)}
.op b{font-size:14.5px;font-weight:700}
.op small{font-size:12px;color:var(--muted)}
.op .aviso{color:var(--warn);display:flex;gap:4px}
.op[data-aviso]{border-color:rgba(217,164,65,.45)}
@keyframes cae{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- campos ---------- */
.form{display:grid;gap:16px;margin-top:16px}
.form.par{grid-template-columns:repeat(2,minmax(0,1fr))}
.form.par > .fw-ancho{grid-column:1 / -1}
@media (max-width:560px){.form.par{grid-template-columns:1fr}}
.fw{display:grid;gap:6px;min-width:0}
.fw-lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.origen{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:var(--pill)}
.origen.agenda{color:#7DEAC0;background:var(--ok-bg);border:1px solid var(--ok-b)}
.origen.corregido{color:#F3D08A;background:var(--warn-bg);border:1px solid var(--warn-b)}
.origen.vos{color:#93C5FD;background:#0A152C;border:1px solid #1A3155}
.field{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:var(--rc);border:1px solid var(--b3);background:rgba(255,255,255,.04)}
.field:focus-within{border-color:rgba(255,63,164,.55);box-shadow:0 0 0 3px rgba(255,63,164,.14)}
.field input,.field textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;box-shadow:none;font-size:15px;padding:12px 0}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field .pre{color:var(--faint);font-weight:600}
.field input[type=date],.field input[type=time]{color-scheme:dark}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--b2);background:var(--el-2);border-radius:var(--pill);padding:5px 12px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
.minimo{display:flex;align-items:center;gap:8px}
.minimo-riel{flex:1;max-width:160px;height:3px;border-radius:3px;background:var(--b1);overflow:hidden}
.minimo-riel i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--lilac));transition:width .3s}
.minimo small{font-size:11px;font-weight:700;color:var(--faint)}
.minimo.listo .minimo-riel i{background:var(--aqua)} .minimo.listo small{color:var(--aqua)}
.toggle2{display:inline-flex;gap:4px;padding:4px;border-radius:var(--rc);background:var(--inset);border:1px solid var(--b1)}
.toggle2 button{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;color:var(--muted)}
.toggle2 button[aria-pressed="true"]{background:var(--el-h);color:var(--text)}
.contador{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contador .n{width:64px;text-align:center;font-size:24px;font-weight:800}
.redondo{width:40px;height:40px;border-radius:12px;border:1px solid var(--b2);background:var(--el-2);font-size:18px;font-weight:700}
.check{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:var(--rc);border:1px solid var(--b2);background:var(--el-2)}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.check .field{min-height:36px;margin-left:auto}

.cuotas{display:grid;gap:8px}
.cuota{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--rc);
  border:1px solid var(--b2);background:var(--el-2);text-align:left}
.cuota[aria-pressed="true"]{border-color:var(--brand);background:rgba(255,63,164,.08)}
.cuota .radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--b3)}
.cuota[aria-pressed="true"] .radio{border-color:var(--brand);background:radial-gradient(circle,var(--brand) 45%,transparent 50%)}

.crono{display:grid;gap:6px}
.crono-fila{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,140px);gap:10px;align-items:center}
.crono-fila .field{min-height:40px}
.crono-fila .field input{padding:8px 0;font-size:14px}
.crono-pie{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.linkbtn{border:0;background:none;color:var(--info);font-weight:600;font-size:12px;padding:4px;display:inline-flex;gap:4px;align-items:center}
.linkbtn:hover{text-decoration:underline}

.filas{display:grid;gap:8px}
.filas-row{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px}
.filas-row .field{min-height:42px}
.quitar{border:1px solid var(--b1);background:none;border-radius:10px;color:var(--muted)}

.acceso{display:grid;gap:10px;padding:18px;border-radius:20px;border:1px solid rgba(255,63,164,.4);
  background:radial-gradient(120% 140% at 0% 0%,rgba(255,63,164,.14),transparent 60%),rgba(255,255,255,.04)}
.acceso-tit{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.acceso .field input{font-size:20px;font-weight:700}
.acceso .check{background:transparent;border-color:var(--b1)}
.cajita{padding:16px;border-radius:var(--rc);border:1px solid var(--b1);background:var(--el-2);display:grid;gap:8px}
.cajita-fila{display:flex;justify-content:space-between;gap:16px;font-size:13px}
.cajita-fila b{font-size:15px}
.hueso{height:18px;border-radius:6px;background:linear-gradient(90deg,var(--el) 0%,var(--el-h) 50%,var(--el) 100%);background-size:200% 100%;animation:hueso 1.2s linear infinite}
@keyframes hueso{to{background-position:-200% 0}}
.saldo{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.saldo b{font-size:22px;font-weight:800}

.faltan{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:16px;font-size:12px;color:var(--muted)}
.faltan > i{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:flat 1.8s ease-out infinite}
.faltan > span{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.faltan > b{padding:3px 10px;border-radius:var(--pill);font-weight:600;color:var(--text);border:1px solid rgba(255,181,71,.3);background:rgba(255,181,71,.1)}
@keyframes flat{0%{box-shadow:0 0 0 0 rgba(255,181,71,.6)}100%{box-shadow:0 0 0 7px transparent}}

.botonera{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:24px}
.atras{display:flex;gap:8px;margin-right:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--pill);font-weight:700;font-size:14px;border:1px solid transparent}
.btn-linea{border-color:var(--b2);background:transparent;color:var(--text)}
.btn-linea:hover{border-color:var(--b3)}
.btn-cta{background:var(--brand);color:#fff;box-shadow:0 8px 24px -10px rgba(255,63,164,.8)}
.btn-cta:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-sm{min-height:34px;padding:0 12px;font-size:12.5px}

.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--rc);border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-b)} .alert.warn > svg{color:var(--warn)}
.alert.err{background:var(--bad-bg);border-color:var(--bad-b)} .alert.err > svg{color:var(--bad)}
.alert.ok{background:var(--ok-bg);border-color:var(--ok-b)} .alert.ok > svg{color:var(--ok)}
.alert-body{display:grid;gap:4px;flex:1}
.alert-body b{font-size:14px} .alert-body span{font-size:13px;color:var(--muted)}
.alert ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.alert li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;font-size:13px}

/* ---------- revisión ---------- */
.rev{display:grid;gap:20px}
.hero{display:grid;gap:16px;padding:20px;border:1px solid var(--b2);border-radius:var(--rc);background:var(--el)}
.hero-monto{font-size:34px;font-weight:800;line-height:1.1}
.cifras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-top:16px;border-top:1px solid var(--b1)}
.cifras > div{display:grid;gap:4px}
.hero-acceso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;font-size:13.5px;
  border:1px solid rgba(255,63,164,.35);background:rgba(255,63,164,.07)} .hero-acceso > svg{color:var(--brand)}
.hero-acceso span{flex:1;min-width:0;overflow-wrap:anywhere} .hero-acceso b{font-size:15px}
.detalles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.detalles .fw-ancho{grid-column:1 / -1}
@media (max-width:640px){.detalles{grid-template-columns:1fr}}
.cifras b{font-size:20px;font-weight:800}
.sec{display:grid;gap:8px}
.sec-tit{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));grid-auto-flow:row dense;gap:8px}
.ficha{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"r e" "v v";align-items:center;column-gap:8px;row-gap:2px;
  padding:8px 8px 8px 12px;border:1px solid var(--b1);border-radius:var(--rc);background:var(--el)}
.ficha.ancha{grid-column:1 / -1}
.ficha .r{grid-area:r;font-size:12px;color:var(--muted)}
.ficha .v{grid-area:v;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.ficha.vacia .v{font-weight:400;font-style:italic;color:var(--warn)}

  border:1px dashed var(--b2);background:rgba(2,6,23,.8)}

<body>
<div id="app"></div>
<script>
// ======================================================================================
// Datos de ejemplo. Los precios y las cuotas son inventados: en la app vienen de
// GET /ficha/<id>/estado-venta?programa=XX y de ficha.cobro.cuotas.
// ======================================================================================
const PRECIOS = { RR: 3000, AL: 2000, SI: 4500, LT: 100 };
const FICHA = {
  nombre: 'Lucía Fernández', instagram: 'lu.fernandez.md', email: 'lucia.fernandez@gmail.com',
  telefono: '+54 9 11 5555-0192', examen: 'ENARM 2027', closer: { id: 1, nombre: 'Kerwin Rojas' },
  setter: 'Agustina', llamada: 'Hoy · 16:30', fuente: 'Instagram · palabra «RESIDENCIA»',
};
const enDias = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const ESCENARIOS = {
  nuevo: { label: 'Cliente nuevo', estado: () => null, cuotas: [], programa: null },
  sena: {
    label: 'Ya dejó una seña (AL)', programa: 'AL',
    estado: (p) => (p === 'AL' ? {
      total_paid: 300, balance_remaining: 1700, sales_count: 1,
      allowed_types: { completo: { ok: false, reason: 'Ya tiene una seña: lo que sigue es parcial o cuota' }, seña: { ok: false, reason: 'Ya tiene una seña registrada' } },
    } : null),
    cuotas: [],
  },
  plan: {
    label: 'Plan de cuotas en curso (RR)', programa: 'RR',
    estado: (p) => (p === 'RR' ? {
      total_paid: 1500, balance_remaining: 1500, sales_count: 2, can_settle_balance_with_installment: true,
      allowed_types: { completo: { ok: false, reason: 'Ya tiene un plan: va Cuota, Renovación o Upsell' }, seña: { ok: false, reason: 'Ya tiene un plan en curso' }, parcial: { ok: false, reason: 'Ya tiene un plan en curso' } },
    } : null),
    cuotas: [
      { id: 11, numero_cuota: 2, fecha_vencimiento: enDias(-6), monto: 750, estado: 'vencido', programa_code: 'RR' },
      { id: 12, numero_cuota: 3, fecha_vencimiento: enDias(24), monto: 750, estado: 'pendiente', programa_code: 'RR' },
    ],
  },
};
const CLOSERS = [{ id: 1, nombre: 'Kerwin Rojas' }, { id: 2, nombre: 'Valentina Paz', pista: 'Hizo la primera llamada' }];
const TRANSFERIDO_A = [
  { clave: 'pedro', label: 'Pedro', descuenta: true }, { clave: 'jean_carlo', label: 'Jean Carlo', descuenta: true },
  { clave: 'otro', label: 'Otro', descuenta: false },
];

// ======================================================================================
// Aritmética (arbolResultado.venta.js + acciones/planCuotas.js)
// ======================================================================================
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const hoyIso = () => enDias(0);
const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const moneda = (n) => `$${Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
function sumarMeses(s, meses) {
  const [y, m, d] = String(s).split('-').map(Number);
  const base = new Date(y, m - 1 + meses, 1);
  const ultimo = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  return iso(new Date(base.getFullYear(), base.getMonth(), Math.min(d, ultimo)));
}
function repartirCuotas(n, total, fijados = {}) {
  const out = []; let resto = round2(total);
  const libres = Array.from({ length: n - 1 }, (_, i) => i + 1).filter((i) => fijados[i] === undefined || fijados[i] === '').length;
  const fijo = Object.entries(fijados).filter(([k, v]) => Number(k) < n && v !== '').reduce((a, [, v]) => a + (parseFloat(v) || 0), 0);
  const parejo = libres ? Math.floor(((total - fijo) / (libres + 1)) * 100) / 100 : 0;
  for (let i = 1; i < n; i += 1) {
    const v = fijados[i] !== undefined && fijados[i] !== '' ? round2(parseFloat(fijados[i]) || 0) : parejo;
    out.push(v); resto = round2(resto - v);
  }
  out.push(resto);
  return out;
}
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fechaCorta = (v) => { const [, m, d] = String(v || '').split('-').map(Number); return m && d ? `${d} ${MESES[m - 1]}` : String(v || ''); };

// PROPUESTA: la venta se parte en dos caminos que no se mezclan.
//   · Venta nueva: compra un programa, lo renueva o suma otro (completo, parcial, seña, renovación, upsell).
//   · Pago: cobra algo que ya compró (una cuota del plan o un pago suelto del saldo).
// Desde la llamada, «Sí, cerró» es siempre venta nueva; «Registrar una venta» pregunta cuál de las dos.
const esVenta = (r = {}) => r.cierre === true || r.venta_directa === true;
const esNueva = (r = {}) => r.cierre === true || (r.venta_directa === true && r.registro === 'venta');
const esPago = (r = {}) => r.venta_directa === true && r.registro === 'pago';
const esCompleto = (r) => r.tipo_pago_simple === 'completo';
const esRenovacionOUpsell = (r) => ['Renovacion', 'Upsell'].includes(r.tipo_pago_simple);
const pagadoAntes = (c) => Number(c.estadoVenta?.total_paid) || 0;
const saldoPrevio = (c) => Number(c.estadoVenta?.balance_remaining) || 0;
function saldoVenta(r, c) {
  if (esPago(r)) return Math.max(0, round2(saldoPrevio(c) - (parseFloat(r.monto) || 0)));
  if (esCompleto(r)) return 0;
  return Math.max(0, round2((parseFloat(r.precio_total) || 0) - pagadoAntes(c) - (parseFloat(r.monto) || 0)));
}
const quedaSaldo = (r, c) => saldoVenta(r, c) > 0.009;
const cuotasPendientes = (r, c) => (c.cuotas || []).filter((q) => q.estado !== 'pagado');
const armaPlan = (r, c) => esNueva(r) && !esCompleto(r) && quedaSaldo(r, c);
const MAXIMO_CUOTAS = 12;
const cantidadCuotas = (r) => Math.max(1, Math.min(MAXIMO_CUOTAS, Math.trunc(Number(r.num_cuotas) || 1)));
function fechasCuotas(r) {
  const n = cantidadCuotas(r);
  if (r.installmentMode === 'custom') return Array.from({ length: n }, (_, i) => r.cuotaFechas?.[i + 1] || sumarMeses(hoyIso(), i + 1));
  const dia = Math.max(1, Math.min(31, Math.trunc(Number(r.dia_de_pago) || 10)));
  const base = `${hoyIso().slice(0, 8)}${String(dia).padStart(2, '0')}`;
  return Array.from({ length: n }, (_, i) => sumarMeses(base, i + 1));
}
const montosCuotas = (r, c) => repartirCuotas(cantidadCuotas(r), saldoVenta(r, c), r.cuotaMontos || {});
const cronogramaEnTexto = (r, c) => { const m = montosCuotas(r, c); return fechasCuotas(r).map((f, i) => `${fechaCorta(f)} ${moneda(m[i])}`).join(' · '); };

// ======================================================================================
// Catálogo de preguntas (arbolResultado.preguntas.js, modo «llamada» + venta directa)
// ======================================================================================
const RAICES = [
  { valor: 'asistio', label: 'Asistió', color: '#2EE6C8', ico: 'checkc' },
  { valor: 'no_asistio', label: 'No asistió', color: '#FF3FA4', ico: 'xc' },
  { valor: 'cancelo', label: 'Canceló', color: '#FFB547', ico: 'calx' },
  { valor: 'reagenda', label: 'Reagenda', color: '#7D8BFF', ico: 'calc' },
];
const PROGRAMAS = [
  { valor: 'RR', label: 'Residency Roadmap', sub: 'RR' }, { valor: 'AL', label: 'Ace Learner', sub: 'AL' },
  { valor: 'SI', label: 'Specialist Initiative', sub: 'SI' }, { valor: 'LT', label: 'Low Ticket', sub: 'LT · 100 USD por mes' },
];
const MEDIOS_PAGO = ['Stripe', 'PayPal', 'Transferencia Bancaria', 'Binance / USDT', 'Hotmart', 'Otro'];
const TIPOS_PAGO = [
  { valor: 'completo', clave: 'completo', label: 'Completo (PIF)', sub: 'Paga todo hoy' },
  { valor: 'parcial', clave: 'parcial', label: 'Parcial (primer pago)', sub: 'Arranca un plan de cuotas' },
  { valor: 'Seña', clave: 'seña', label: 'Seña', sub: 'Promesa de pago, sin cronograma todavía' },
  { valor: 'Cuota', clave: 'cuota', label: 'Cuota', sub: 'Cobra una cuota del plan ya armado' },
  { valor: 'Renovacion', clave: 'renovacion', label: 'Renovación', sub: 'Ya fue alumno, compra de nuevo' },
  { valor: 'Upsell', clave: 'upsell', label: 'Upsell', sub: 'Suma otro programa o una mejora' },
];
const ESTADOS_VENTA = [
  { valor: 'Completada', label: 'Completada', sub: 'todo en orden' }, { valor: 'Pendiente', label: 'Pendiente', sub: 'falta algo para cerrarla' },
  { valor: 'Cancelada', label: 'Cancelada', sub: 'no va a concretarse' },
];
const opts = (l) => l.map((x) => ({ valor: x, label: x }));
const si = { valor: true, label: 'Sí' }; const no = { valor: false, label: 'No' };
const texto = (campo, label, extra = {}) => ({ campo, label, tipo: 'texto', ...extra });
const enLlamada = (r) => r.venta_directa !== true;
const vaASeguimiento = (r) => [r.nocierre_next, r.nopres_next, r.noshow_next, r.cancel_next].includes('seguimiento') || r.reag_dejo_fecha === false;
const vaADescartar = (r) => ['perdido', 'descartar', 'no_lead'].some((v) => [r.nocierre_next, r.nopres_next, r.noshow_next, r.cancel_next].includes(v));
const huboContacto = (r) => r.res === 'asistio' || r.venta_directa === true;
function closersDeLaVenta() {
  return CLOSERS.map((x) => ({ valor: x.id, label: x.nombre, sub: x.id === FICHA.closer.id ? 'Closer de esta agenda' : x.pista }))
    .sort((a, b) => (b.sub === 'Closer de esta agenda') - (a.sub === 'Closer de esta agenda'));
}
const muestraEstadoCliente = (r, c) => esVenta(r) && !!r.programa && (!!c.cargandoVenta || (Number(c.estadoVenta?.sales_count) || 0) > 0);
const enPlata = (v) => (v === '' || v == null ? null : moneda(v));

const PREGUNTAS = [
  { clave: 'res', hito: 'resultado', campo: 'res', tipo: 'opciones', enunciado: '¿Qué pasó con esta llamada?', opciones: RAICES, cuando: enLlamada },
  { clave: 'decisor', campo: 'with_decision_maker', tipo: 'opciones', enunciado: '¿Estuvo el decisor?',
    opciones: [{ ...si, label: 'Sí, con decisor', ico: 'userok' }, { ...no, label: 'No, sin decisor', ico: 'userx' }], cuando: (r) => enLlamada(r) && r.res === 'asistio' },
  { clave: 'oferta', campo: 'offer_presented', tipo: 'opciones', enunciado: '¿Se presentó la oferta?',
    opciones: [{ ...si, label: 'Sí, se presentó', ico: 'eye' }, { ...no, label: 'No se presentó', ico: 'eyeoff' }], cuando: (r) => enLlamada(r) && r.res === 'asistio' },
  { clave: 'cierre', campo: 'cierre', tipo: 'opciones', enunciado: '¿Se cerró la venta?',
    opciones: [{ ...si, label: 'Sí, cerró', sub: 'Registrar el pago', ico: 'up' }, { ...no, label: 'No cerró', ico: 'down' }], cuando: (r) => r.offer_presented === true },
  { clave: 'objecion', tipo: 'formulario', enunciado: '¿Por qué no cerró? ¿Cuál es la objeción?',
    ayuda: 'Lo que dijo, con sus palabras si podés. Queda en Comunicación y en la base de no cerradas.',
    campos: [{ campo: 'objecion', label: 'Objeción', tipo: 'parrafo', requerido: true, minimoTexto: 10 }], cuando: (r) => r.cierre === false },
  { clave: 'motivo_sin_oferta', tipo: 'formulario', enunciado: '¿Por qué no se cerró?',
    ayuda: 'Contá por qué no se presentó la oferta, por qué no hubo ni una seña, o qué faltó para que terminara mejor.',
    campos: [{ campo: 'motivo_sin_oferta', label: 'Motivo', tipo: 'parrafo', requerido: true, minimoTexto: 10 }], cuando: (r) => r.offer_presented === false },

  // ---------- venta (PROPUESTA) ----------
  // Venta directa: lo primero es decir si es una venta nueva o el pago de algo que ya compró.
  { clave: 'que_registra', campo: 'registro', tipo: 'opciones', enunciado: '¿Qué estás registrando?',
    opciones: (r, c) => [
      { valor: 'venta', label: 'Una venta nueva', sub: 'Compra un programa, lo renueva o suma otro', ico: 'dollar' },
      { valor: 'pago', label: 'Un pago de algo que ya compró', sub: c.programaCliente ? `Una cuota o parte del saldo de ${c.programaCliente}` : 'No tiene compras: no hay nada que cobrar', ico: 'wallet' },
    ],
    cuando: (r) => r.venta_directa === true },

  // Venta nueva · 1. Los datos que ya tenemos se confirman de un vistazo; el correo va aparte y grande
  // porque con él se crea la suscripción. Sin documento ni examen.
  { clave: 'venta_datos', tipo: 'formulario', par: true, enunciado: 'Confirmá sus datos', ayuda: 'Vienen de la agenda. Corregí solo lo que esté mal.',
    campos: () => [
      { campo: 'mail_cliente', label: 'Correo del acceso', tipo: 'acceso', requerido: true },
      { campo: 'dar_acceso_academia', label: 'Acceso a la Academia', tipo: 'oculto', etiquetas: { true: 'Sí, al registrar', false: 'No por ahora' } },
      { campo: 'acceso_hasta', label: 'Acceso hasta', tipo: 'oculto', resumir: (v) => (v ? fechaCorta(v) : null) },
      texto('nombre_cliente', 'Nombre y apellido', { requerido: true, precargado: true }),
      texto('instagram', 'Instagram', { prefijo: '@', precargado: true }),
      texto('telefono', 'Teléfono (WhatsApp)', { tipo: 'tel', precargado: true }),
      ...(closersDeLaVenta().length > 1 ? [{ campo: 'vendedor_id', label: 'La comisión va a', tipo: 'chips', requerido: true, opciones: closersDeLaVenta() }] : []),
    ],
    validar: (r) => (r.mail_cliente && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.mail_cliente.trim()) ? ['El correo no parece válido'] : []),
    cuando: esNueva },
  // 2. Qué compró.
  { clave: 'programa', campo: 'programa', tipo: 'opciones', enunciado: '¿Qué programa compró?', opciones: PROGRAMAS, cuando: esNueva },
  // 3. Cómo paga: solo los tipos de una venta nueva. La Cuota ya no está acá: es el camino «Pago».
  { clave: 'tipo_pago', campo: 'tipo_pago_simple', tipo: 'opciones', enunciado: '¿Cómo paga?',
    ayuda: (r, c) => (c.cargandoVenta ? 'Revisando si ya compró este programa…' : (pagadoAntes(c) > 0 ? `Ya pagó ${moneda(pagadoAntes(c))} de este programa: se descuenta solo.` : null)),
    opciones: (r, c) => TIPOS_PAGO.filter((t) => t.clave !== 'cuota').map((t) => { const g = c.estadoVenta?.allowed_types?.[t.clave]; return { ...t, aviso: g && g.ok === false ? g.reason : null }; }),
    cuando: esNueva },
  { clave: 'liquidar', campo: 'settleBalanceWithSale', tipo: 'opciones',
    enunciado: (r, c) => `Todavía debe ${moneda(saldoPrevio(c))} del programa. ¿Lo liquidás junto con esta venta?`,
    ayuda: 'Se registra primero un pago por ese saldo y, si sale bien, la venta nueva.',
    opciones: [{ valor: true, label: 'Sí, liquidarlo', sub: 'Pago del saldo + la venta nueva' }, { valor: false, label: 'No, solo la venta nueva', sub: 'El saldo sigue pendiente' }],
    cuando: (r, c) => esNueva(r) && esRenovacionOUpsell(r) && !!c.estadoVenta?.can_settle_balance_with_installment && saldoPrevio(c) > 0.009 },
  // 4. La plata, en una pantalla: cuánto, cuánto hoy, por dónde (y a quién, si fue transferencia).
  { clave: 'venta_montos', tipo: 'formulario', par: true, enunciado: (r) => (esCompleto(r) ? '¿Cuánto cobraste y por dónde?' : '¿Cuánto vale y cuánto cobraste hoy?'),
    campos: (r) => [
      ...(r.tipo_pago_simple === 'Renovacion' ? [{ campo: 'meses_renovacion', label: 'Renueva por', tipo: 'chips', requerido: true, opciones: [{ valor: 1, label: '1 mes' }, { valor: 4, label: '4 meses' }] }] : []),
      ...(esCompleto(r) ? [] : [{ campo: 'precio_total', label: 'Precio total', tipo: 'monto', requerido: true, minimo: 0.01, resumir: enPlata }]),
      { campo: 'monto', label: esCompleto(r) ? 'Monto cobrado' : 'Cobrado hoy', tipo: 'monto', requerido: true, minimo: 0.01, resumir: enPlata },
      ...camposDelMedio(r),
    ], cuando: esNueva },
  // 5. Solo si queda saldo: cuántas cuotas y cuándo, en una pantalla con el cronograma a la vista.
  { clave: 'venta_plan', tipo: 'formulario', par: true, enunciado: (r, c) => `Te deben ${moneda(saldoVenta(r, c))}. ¿Cómo lo paga?`,
    campos: (r) => [
      { campo: 'num_cuotas', label: 'Cuotas', tipo: 'contador', requerido: true, atajos: [2, 3, 4, 6], resumir: (v, x) => `${cantidadCuotas(x)} ${cantidadCuotas(x) === 1 ? 'cuota' : 'cuotas'}` },
      { campo: 'installmentMode', label: 'Fechas', tipo: 'chips', requerido: true, opciones: [{ valor: 'monthly', label: 'Mismo día cada mes' }, { valor: 'custom', label: 'Fechas a mano' }] },
      ...(r.installmentMode === 'monthly' ? [{ campo: 'dia_de_pago', label: 'Día de pago', tipo: 'dia_mes', requerido: true, resumir: (v) => `El ${v} de cada mes` }] : []),
      { campo: 'cuotaMontos', label: 'Cronograma', tipo: 'cronograma', resumir: (v, x, c) => cronogramaEnTexto(x, c) },
    ],
    cuando: armaPlan },

  // Pago · 1. Qué cobra: el plan a la vista y se elige la cuota (o un pago suelto del saldo).
  { clave: 'pago_que', campo: 'pago_de', tipo: 'opciones', enunciado: '¿Qué está pagando?',
    ayuda: (r, c) => (c.programaCliente ? `${c.programaCliente} · le falta ${moneda(saldoPrevio(c))}` : 'Este cliente no tiene compras: volvé y registrá una venta nueva.'),
    opciones: (r, c) => [
      ...cuotasPendientes(r, c).map((q) => ({ valor: q.id, label: `Cuota ${q.numero_cuota} · ${moneda(q.monto)}`, sub: `${q.estado === 'vencido' ? 'Vencida' : 'Vence'} el ${fechaCorta(q.fecha_vencimiento)}`, cuota: q })),
      ...(c.programaCliente ? [{ valor: 'saldo', label: 'Un pago suelto del saldo', sub: 'Sin cuota: baja lo que debe' }] : []),
    ],
    cuando: esPago },
  // 2. Cuánto y por dónde.
  { clave: 'pago_monto', tipo: 'formulario', par: true, enunciado: '¿Cuánto pagó y por dónde?',
    campos: (r) => [{ campo: 'monto', label: 'Monto', tipo: 'monto', requerido: true, minimo: 0.01, resumir: enPlata }, ...camposDelMedio(r)],
    cuando: esPago },

  // ---------- sin venta ----------
  { clave: 'nocierre_next', campo: 'nocierre_next', tipo: 'opciones', enunciado: 'Se presentó la oferta pero no se cerró. ¿Siguiente acción?',
    opciones: [{ valor: 'seguimiento', label: 'Programar seguimiento' }, { valor: 'perdido', label: 'Lead perdido / descartado', sub: 'Descartar prospecto' }], cuando: (r) => r.cierre === false },
  { clave: 'nopres_next', campo: 'nopres_next', tipo: 'opciones', enunciado: 'No se le presentó la oferta. ¿Siguiente paso?',
    opciones: [{ valor: 'segunda', label: 'Agendar 2ª llamada', sub: 'Enviar a confirmación' }, { valor: 'seguimiento', label: 'Seguimiento', sub: 'Agendar más tarde' }, { valor: 'descartar', label: 'Descartar lead', sub: 'No califica' }],
    cuando: (r) => r.offer_presented === false },
  { clave: 'segunda_llamada', tipo: 'formulario', enunciado: 'Agendar la 2ª llamada',
    campos: [{ campo: 'nueva_fecha_agenda', label: 'Nueva fecha', tipo: 'fecha', requerido: true }, { campo: 'nueva_hora_agenda', label: 'Nueva hora', tipo: 'hora' },

const ic = (n, s) => `<svg viewBox="0 0 24 24"${s ? ` style="width:${s}px;height:${s}px"` : ''}>${P[n] || ''}</svg>`;

// ======================================================================================
// Pintado
// ======================================================================================
function render() {
  const foco = document.activeElement; const fk = foco?.dataset?.k; let sel = null;
  try { sel = foco?.selectionStart; } catch (e) { sel = null; }
  vigilarPrograma();
  const c = contexto();
  document.getElementById('app').innerHTML = `${barraMockup(c)}<div class="lay"><div class="win">${cabecera()}${pestanas()}<div class="panel">${resultado(c)}</div></div>${S.recorrido ? recorrido(c) : ''}</div>`;
  if (fk) {
    const el = document.querySelector(`[data-k="${fk}"]`);
    if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { /* date/number */ } }
  } else {
    const auto = document.querySelector('[data-auto]'); if (auto && S.autofoco) { auto.focus(); S.autofoco = false; }
  }
}

function barraMockup(c) {
  const camino = arrancado(S.R) ? caminoActivo(S.R, c) : [];
  const hechas = camino.filter((q) => contestada(q, S.R)).length;
  return `<div class="mk"><span class="tag">Propuesta</span><b>Reportar una venta · versión corta</b><a class="mk-btn" href="reportar_venta_hoy.html" style="text-decoration:none">Ver cómo es hoy</a>
    <div class="seg" role="group" aria-label="Escenario">${Object.entries(ESCENARIOS).map(([k, e]) => `<button data-act="escenario" data-v="${k}" aria-pressed="${S.escenario === k}">${e.label}</button>`).join('')}</div>
    <span class="sp"></span>
    <span class="mk-cont"><span><b>${hechas}</b>/ ${camino.length || '–'} pantallas</span><span><b>${S.clics}</b>clics</span></span>
    <button class="mk-btn" data-act="recorrido" aria-pressed="${S.recorrido}">${ic('map', 14)} Recorrido</button>
    <button class="mk-btn" data-act="atajo">${ic('dollar', 14)} Saltar a la venta</button></div>`;
}

function cabecera() {
  const d = (ico, rot, val) => `<div class="dato"><span class="rot">${ic(ico)} ${rot}</span><span class="val">${val}</span></div>`;
  return `<div class="win-cab"><div class="cab"><div class="cab-tit"><h2>${esc(FICHA.nombre)}</h2><button class="cab-x" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="cab-datos">${d('user', 'Closer', `<span class="avatar">KR</span>${FICHA.closer.nombre}`)}${d('phone', 'Teléfono', `<span class="punto"></span>${FICHA.telefono}`)}
    ${d('clock', 'Llamada', FICHA.llamada)}${d('send', 'Fuente', FICHA.fuente)}${d('user', 'Setter', FICHA.setter)}</div></div></div>`;
}
function pestanas() {
  const t = [['clip', 'Confirmación'], ['phone', 'Resultado'], ['wallet', 'Acciones'], ['hist', 'Historial'], ['book', 'Bitácora'], ['file', 'Formulario'], ['msg', 'Comunicación']];
  return `<div class="tabs" role="tablist">${t.map(([i, l]) => `<button class="tab" role="tab" aria-selected="${l === 'Resultado'}">${ic(i)} ${l}</button>`).join('')}</div>`;
}

function resultado(c) {
  const hs = hitos(S.R, c);
  const stp = hs.map((h, i) => {
    const sig = h.estado === 'pendiente' && i > 0 && hs[i - 1].estado !== 'pendiente';
    const fill = h.estado !== 'pendiente' && hs[i + 1] && hs[i + 1].estado !== 'pendiente';
    return `<div class="paso${sig ? ' sig' : ''}${fill ? ' fill' : ''}" data-e="${h.estado}" title="${esc(h.sub)}"><i></i><span>${h.label}</span><small>${esc(h.sub)}</small></div>`;
  }).join('');
  let main; let clave;
  if (S.hecho) { main = hecho(); clave = 'hecho'; }
  else if (!arrancado(S.R)) { main = raices(); clave = 'raices'; }
  else if (completo(S.R, c)) { main = revision(c); clave = 'revision'; }
  else { const q = preguntaActual(S.R, c); main = pregunta(q, c); clave = q.clave; }
  // Solo se anima la entrada a una pantalla nueva, no cada tecla que re-pinta la misma.
  const animar = clave !== S.ultima; S.ultima = clave;
  const pr = progresoVenta(S.R, c);
  const barra = pr && !S.hecho ? `<div class="prog"><span class="eyebrow">${pr.listo ? 'Venta · revisión' : `Venta · paso ${pr.paso} de ${pr.total}`}</span>
    <div class="prog-riel"><i style="width:${Math.round((pr.listo ? 1 : (pr.paso - 1) / pr.total) * 100)}%"></i></div></div>` : '';
  return `<div class="res"><aside class="hitos"><span class="hitos-tit">Progreso</span><div class="stp">${stp}</div></aside>
    <div class="res-main">${barra}<section${animar ? ' class="entra"' : ''}>${main}</section></div></div>`;
}

function raices() {
  return `<h3>¿Qué pasó con esta llamada?</h3><div class="raices">${RAICES.map((o) => `<button class="raiz" style="--c:${o.color}" data-act="raiz" data-v="${o.valor}">${ic(o.ico)}${o.label}</button>`).join('')}</div>
    <div class="otras"><button class="otra" data-act="directa">${ic('dollar', 18)} Registrar una venta</button><button class="otra">${ic('rot', 18)} Pasar a seguimiento</button></div>`;
}

function botonesAtras(disabled) {
  return `<span class="atras"><button class="btn btn-linea" data-act="anterior"${disabled ? ' disabled' : ''}>${ic('left')} Anterior</button>
    <button class="btn btn-linea" data-act="reiniciar"${disabled ? ' disabled' : ''}>${ic('rot')} Empezar de nuevo</button></span>`;
}

function pregunta(q, c) {
  const R = S.R;
  const cab = `<h3>${esc(q.enunciado)}</h3>${q.ayuda ? `<p class="ayuda">${esc(q.ayuda)}</p>` : ''}`;
  if (q.tipo !== 'formulario') {
    const min = q.opciones.length > 2 ? 180 : 220;
    const ops = q.opciones.map((o, i) => {
      const ico = o.ico || (o.valor === true ? 'up' : o.valor === false ? 'down' : null);
      return `<button class="op${ico ? '' : ' sin-ico'}" style="animation-delay:${i * 30}ms" data-act="op" data-i="${i}" aria-pressed="${elegida(R, q.campo) === o.valor}"${o.aviso ? ' data-aviso' : ''}>
        ${ico ? `<span class="op-ico">${ic(ico, 18)}</span>` : ''}<b>${esc(o.label)}</b>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}${o.aviso ? `<small class="aviso">${ic('alert', 12)}${esc(o.aviso)}</small>` : ''}</button>`;
    }).join('');
    const aviso = q.opciones.some((o) => o.aviso) ? `<div class="alert warn" style="margin-top:16px">${ic('alert')}<span class="alert-body"><b>Algunos tipos no siguen el historial de pagos de este cliente</b><span>Podés declararlo igual. Si es un dato viejo mal cargado, corregilo en el historial.</span></span><button class="btn btn-linea btn-sm">${ic('hist', 14)} Ver historial</button></div>` : '';
    return `${cab}<div class="ops" style="grid-template-columns:repeat(auto-fit,minmax(${min}px,1fr))">${ops}</div>${aviso}<div class="botonera" style="justify-content:flex-start">${botonesAtras()}</div>`;
  }
  const falta = faltantesDe(q, R, c);
  const enCampo = new Set(q.campos.filter((f) => f.minimoTexto).map((f) => faltaDelCampo(f, R)).filter(Boolean));
  const par = q.par || q.campos.some((f) => f.junto);
  const primero = q.campos.find((f) => ['texto', 'monto', undefined].includes(f.tipo) || f.tipo === 'parrafo');
  const campos = q.campos.filter((f) => !f.junto).map((f) => campo(f, q, c, f === primero)).join('');
  const saldo = q.clave === 'venta_montos' && !esCompleto(R) ? `<div class="cajita saldo"><span class="eyebrow">Saldo a financiar</span><b class="mono" style="color:${quedaSaldo(R, c) ? 'var(--warn)' : 'var(--ok)'}">${quedaSaldo(R, c) ? moneda(saldoVenta(R, c)) : 'Sin saldo'}</b></div>` : '';
  const chips = falta.filter((f) => !enCampo.has(f));
  const pend = chips.length ? `<div class="faltan" role="status"><i></i><span>Falta</span>${chips.map((f) => `<b>${esc(f.replace(/^(Completá|Elegí|Cargá)\s+/i, ''))}</b>`).join('')}</div>` : '';
  return `${cab}<div class="form${par ? ' par' : ''}">${campos}</div>${saldo}${pend}
    <div class="botonera">${botonesAtras()}<button class="btn btn-cta" data-act="continuar"${falta.length ? ' disabled' : ''}>Continuar ${ic('right')}</button></div>`;
}

function origen(f) {
  if (!f.precargado) return '';
  const antes = String(S.precarga[f.campo] ?? '').trim(); const ahora = String(S.R[f.campo] ?? '').trim();
  const o = !antes ? 'vos' : antes === ahora ? 'agenda' : 'corregido';
  return `<span class="origen ${o}">${{ agenda: 'De la agenda', corregido: 'Corregido', vos: 'Cargado por vos' }[o]}</span>`;
}

function campo(f, q, c, auto) {
  const R = S.R; const v = R[f.campo];
  const lbl = (extra = '') => `<span class="fw-lbl"><span>${esc(f.label)}${f.requerido ? '' : ' <span class="faint">(opcional)</span>'}</span>${extra}</span>`;
  const a = auto ? ' data-auto' : '';
  switch (f.tipo) {
    case 'oculto': return '';
    case 'chips':
      return `<div class="fw fw-ancho">${lbl()}<div class="presets">${f.opciones.map((o) => `<button class="chip" data-act="chip" data-f="${f.campo}" data-v='${esc(JSON.stringify(o.valor))}' aria-pressed="${v === o.valor}">${esc(o.label)}${o.sub ? ` <span class="faint">· ${esc(o.sub)}</span>` : ''}</button>`).join('')}</div></div>`;
    case 'acceso': {
      // El dato que más importa: con este correo se crea o renueva la suscripción.
      const hasta = [{ label: '4 meses', meses: 4 }, { label: '6 meses', meses: 6 }, { label: '1 año', meses: 12 }]
        .map((p) => { const val = sumarMeses(hoyIso(), p.meses); return `<button class="chip" data-act="preset" data-f="acceso_hasta" data-v="${val}" aria-pressed="${R.acceso_hasta === val}">${p.label}</button>`; }).join('');
      return `<div class="acceso fw-ancho"><span class="acceso-tit">${ic('send', 14)} Correo del acceso ${origen({ ...f, precargado: true })}</span>
        <span class="field"><input type="email" data-k="mail_cliente" value="${esc(v)}"${a}></span>
        <small class="mut">Con este correo se crea o renueva su suscripción en la Academia. Revisalo letra por letra.</small>
        <label class="check"><input type="checkbox" data-k="dar_acceso_academia" data-bool${R.dar_acceso_academia ? ' checked' : ''}> Darle acceso al registrar la venta</label>
        ${R.dar_acceso_academia ? `<div class="presets"><span class="faint" style="font-size:12px;align-self:center">Hasta:</span><button class="chip" data-act="preset" data-f="acceso_hasta" data-v="" aria-pressed="${!R.acceso_hasta}">Lo de siempre</button>${hasta}</div>` : ''}</div>`;
    }
    case 'parrafo': {
      const largo = String(v || '').trim().length;
      const min = f.minimoTexto ? `<div class="minimo${largo >= f.minimoTexto ? ' listo' : ''}"><span class="minimo-riel"><i style="width:${Math.min(100, (largo / f.minimoTexto) * 100)}%"></i></span><small>${largo >= f.minimoTexto ? '✓ Listo' : `${largo}/${f.minimoTexto}`}</small></div>` : '';
      return `<label class="fw fw-ancho">${lbl()}<span class="field"><textarea data-k="${f.campo}"${a}>${esc(v)}</textarea></span>${min}</label>`;
    }
    case 'monto':
      return `<label class="fw">${lbl()}<span class="field"><span class="pre">$</span><input inputmode="decimal" data-k="${f.campo}" value="${esc(v)}"${a}></span></label>`;
    case 'fecha': {
      const presets = (f.presets || []).map((p) => { const val = p.meses ? sumarMeses(hoyIso(), p.meses) : enDias(p.dias); return `<button class="chip" data-act="preset" data-f="${f.campo}" data-v="${val}" aria-pressed="${v === val}">${p.label}</button>`; }).join('');
      return `<div class="fw">${lbl()}<span class="field"><input type="date" data-k="${f.campo}" value="${esc(v)}"></span>${presets ? `<div class="presets">${presets}</div>` : ''}</div>`;
    }
    case 'hora':
      return `<label class="fw">${lbl()}<span class="field"><input type="time" data-k="${f.campo}" value="${esc(v)}"></span></label>`;
    case 'opcion':
      return `<div class="fw">${lbl()}<div class="toggle2">${f.opciones.map((o) => `<button data-act="opcion" data-f="${f.campo}" data-v="${o}" aria-pressed="${v === o}">${f.etiquetas[String(o)]}</button>`).join('')}</div></div>`;
    case 'contador': {
      const n = cantidadCuotas(R);
      return `<div class="fw">${lbl()}<div class="contador"><button class="redondo" data-act="cont" data-d="-1">−</button><span class="n mono">${n}</span><button class="redondo" data-act="cont" data-d="1">+</button>
        <span class="presets">${f.atajos.map((x) => `<button class="chip" data-act="cont-set" data-v="${x}" aria-pressed="${n === x}">${x} cuotas</button>`).join('')}</span></div>
        <small class="mut">${n} × ${moneda(saldoVenta(R, c) / n)} aprox.</small></div>`;
    }
    case 'dia_mes':
      return `<div class="fw">${lbl()}<div class="presets">${[1, 5, 10, 15, 20, 25, 28, 30].map((d) => `<button class="chip" data-act="dia" data-v="${d}" aria-pressed="${Number(v) === d}">${d}</button>`).join('')}
        <span class="field" style="min-height:32px;width:90px"><input type="number" min="1" max="31" data-k="dia_de_pago" value="${esc(v)}" style="padding:4px 0"></span></div></div>`;
    case 'cronograma': return `<div class="fw fw-ancho">${cronograma(c, false)}</div>`;
    case 'cuota': {
      const ps = cuotasPendientes(R, c);
      return `<div class="fw fw-ancho">${lbl()}<div class="cuotas">${ps.map((x) => `<button class="cuota" data-act="cuota" data-v="${x.id}" aria-pressed="${v === x.id}"><span class="radio"></span>
        <span><b>Cuota ${x.numero_cuota}</b> <small class="mut">· vence ${fechaCorta(x.fecha_vencimiento)} · <span style="color:${x.estado === 'vencido' ? 'var(--bad)' : 'var(--warn)'}">${x.estado === 'vencido' ? 'Vencida' : 'Pendiente'}</span></small></span><b class="mono">${moneda(x.monto)}</b></button>`).join('')}</div></div>`;
    }
    case 'estado_cliente': {
      const e = c.estadoVenta;
      if (c.cargandoVenta || !e) return `<div class="cajita fw-ancho"><div class="hueso" style="width:60%"></div><div class="hueso" style="width:45%"></div><div class="hueso" style="width:35%"></div></div>`;
      return `<div class="cajita fw-ancho"><div class="cajita-fila"><span class="mut">Pagó</span><b class="mono">${moneda(e.total_paid)} de ${moneda(e.program_price)}</b></div>
        <div class="cajita-fila"><span class="mut">Le falta</span><b class="mono" style="color:${e.balance_remaining > 0 ? 'var(--warn)' : 'var(--ok)'}">${moneda(e.balance_remaining)}</b></div>
        <div class="cajita-fila"><span class="mut">Ventas registradas</span><b>${e.sales_count}</b></div></div>`;
    }
    case 'filas': {
      const rows = R.refs_rows || [];
      return `<div class="fw fw-ancho">${lbl()}<div class="filas">${rows.map((row, i) => `<div class="filas-row"><span class="field"><input placeholder="Nombre" data-k="ref-${i}-nombre" value="${esc(row.nombre)}"></span>
        <span class="field"><input placeholder="@instagram o teléfono" data-k="ref-${i}-contacto" value="${esc(row.contacto)}"></span><button class="quitar" data-act="ref-del" data-i="${i}" aria-label="Quitar">${ic('x', 14)}</button></div>`).join('')}
        <button class="linkbtn" data-act="ref-add">+ Agregar otro referido</button></div></div>`;
    }
    case 'booleano': {
      const p = q.campos.find((x) => x.junto === f.campo);
      return `<div class="fw"><span class="fw-lbl">&nbsp;</span><label class="check"><input type="checkbox" data-k="${f.campo}" data-bool${v ? ' checked' : ''}> ${esc(f.label)}
        ${p && v ? `<span class="field"><input type="time" data-k="${p.campo}" value="${esc(R[p.campo])}"></span>` : ''}</label></div>`;
    }
    default:
      return `<label class="fw">${lbl(origen(f))}<span class="field">${f.prefijo ? `<span class="pre">${f.prefijo}</span>` : ''}<input type="${f.tipo === 'email' ? 'email' : 'text'}" data-k="${f.campo}" value="${esc(v)}"${a}></span></label>`;
  }
}

function cronograma(c, soloLectura) {
  const R = S.R; const saldo = saldoVenta(R, c); const m = montosCuotas(R, c); const fs = fechasCuotas(R); const mensual = R.installmentMode !== 'custom';
  const filas = fs.map((f, i) => {
    const ultima = i === fs.length - 1;
    const fecha = soloLectura || mensual ? `<span>${fechaCorta(f)}</span>` : `<span class="field"><input type="date" data-k="cf-${i + 1}" value="${f}"></span>`;
    const monto = soloLectura || ultima ? `<b class="mono" style="text-align:right">${moneda(m[i])}</b>` : `<span class="field"><span class="pre">$</span><input inputmode="decimal" data-k="cm-${i + 1}" value="${R.cuotaMontos?.[i + 1] ?? m[i]}"></span>`;
    return `<div class="crono-fila"><span class="mut">Cuota ${i + 1}</span>${fecha}${monto}</div>`;
  }).join('');
  return `<span class="eyebrow">Saldo a financiar · ${moneda(saldo)}</span><div class="crono">${filas}</div>
    ${soloLectura ? '' : `<div class="crono-pie"><span>La última cuota se ajusta sola.</span><button class="linkbtn" data-act="repartir">Repartir parejo</button></div>`}`;
}

function revision(c) {
  const R = S.R; const venta = esVenta(R); const rev = revisionVenta(R, c);
  const errores = rev.avisos.filter((a) => a.nivel === 'error'); const avisos = rev.avisos.filter((a) => a.nivel !== 'error');
  const frena = venta && errores.some((a) => a.frena);
  const n = rev.numeros;
  const pago = esPago(R);
  // El correo del acceso, a la vista arriba de todo: es lo que no se puede equivocar.
  const acceso = esNueva(R) ? `<div class="hero-acceso">${ic('send', 14)}<span>${R.dar_acceso_academia
    ? `Acceso a la Academia con <b>${esc(R.mail_cliente)}</b>${R.acceso_hasta ? ` hasta el ${fechaCorta(R.acceso_hasta)}` : ''}`
    : `Sin acceso a la Academia por ahora · ${esc(R.mail_cliente)}`}</span><button class="linkbtn" data-act="editar" data-paso="venta_datos">${ic('pen', 12)} Cambiar</button></div>` : '';
  const hero = venta ? `<section class="hero"><div><span class="sec-tit">${pago ? 'Pago' : 'Total de la venta'}</span><div class="hero-monto mono">${moneda(n.total)}</div>
    <small class="mut">${[n.programa, n.tipoPago].filter(Boolean).join(' · ')}${n.antes > 0 && !pago ? ` · ya había pagado ${moneda(n.antes)}` : ''}</small></div>
    <div class="cifras"><div><span class="sec-tit">Cobrado hoy</span><b class="mono">${moneda(n.cobrado)}</b></div>
    <div><span class="sec-tit">${pago ? 'Le queda debiendo' : 'Saldo'}</span><b class="mono" style="color:${n.saldo > 0.009 ? 'var(--warn)' : 'var(--ok)'}">${n.saldo > 0.009 ? moneda(n.saldo) : 'Sin saldo'}</b></div>
    <div><span class="sec-tit">Medio de pago</span><b style="font-size:15px">${esc(R.metodo_pago || 'Sin elegir')}</b></div></div>${acceso}</section>` : '';
  const caja = (lista, tipo, titulo) => (lista.length ? `<div class="alert ${tipo}">${ic('alert')}<span class="alert-body"><b>${titulo}</b><ul>${lista.map((a) => `<li><span>${esc(a.texto)}</span>${a.paso ? `<button class="linkbtn" data-act="editar" data-paso="${a.paso}">${ic('pen', 12)} Corregir</button>` : ''}</li>`).join('')}</ul></span></div>` : '');
  // Lo que antes eran cuatro pantallas (fecha, en la llamada, estado, notas) viene puesto y se cambia acá.
  const chips = (campo, ops) => `<div class="presets">${ops.map(([val, l]) => `<button class="chip" data-act="chip" data-f="${campo}" data-v='${esc(JSON.stringify(val))}' aria-pressed="${R[campo] === val}">${l}</button>`).join('')}</div>`;
  const fechas = [['Hoy', 0], ['Ayer', -1]].map(([l, d]) => `<button class="chip" data-act="preset" data-f="date" data-v="${enDias(d)}" aria-pressed="${R.date === enDias(d)}">${l}</button>`).join('');
  const detalles = venta ? `<section class="sec"><span class="sec-tit">Detalles ${pago ? 'del pago' : 'de la venta'}</span><div class="cajita detalles">
    <div class="fw"><span class="fw-lbl">Fecha</span><div class="presets">${fechas}<span class="field" style="min-height:34px"><input type="date" data-k="date" value="${esc(R.date)}" style="padding:4px 0"></span></div></div>
    ${pago ? '' : `<div class="fw"><span class="fw-lbl">¿Cerró en la llamada?</span>${chips('sold_in_call', [[true, 'Sí, en el Meet'], [false, 'No, fuera de la llamada']])}</div>
    <div class="fw"><span class="fw-lbl">Estado</span>${chips('estado', ESTADOS_VENTA.map((e) => [e.valor, e.label]))}</div>`}
    ${n.saldo > 0.009 ? `<div class="fw"><span class="fw-lbl">Próximo seguimiento de cobro (opcional)</span><div class="presets">${[['En 1 semana', 7], ['En 1 mes', 30]].map(([l, d]) => `<button class="chip" data-act="preset" data-f="fecha_cobro" data-v="${enDias(d)}" aria-pressed="${R.fecha_cobro === enDias(d)}">${l}</button>`).join('')}</div></div>` : ''}
    <label class="fw fw-ancho"><span class="fw-lbl">Notas (opcional)</span><span class="field"><textarea data-k="notas" placeholder="Detalles del cierre, lo que sirva después">${esc(R.notas)}</textarea></span></label></div></section>` : '';
  const secciones = venta ? rev.secciones : [{ id: 'r', titulo: 'Lo que reportaste', filas: rev.secciones.flatMap((s) => s.filas) }];
  const secs = secciones.map((s) => `<section class="sec"><span class="sec-tit">${s.titulo}</span><div class="fichas">${s.filas.map((f, i) => `<div class="ficha${f.vacia ? ' vacia' : ''}${String(f.valor).length > 40 ? ' ancha' : ''}" style="animation-delay:${i * 30}ms">
    <span class="r">${esc(f.label)}</span><button class="linkbtn" data-act="editar" data-paso="${f.paso}">${ic('pen', 12)} ${f.vacia ? 'Completar' : 'Editar'}</button><span class="v">${esc(f.valor)}</span></div>`).join('')}</div></section>`).join('');
  const plan = venta && armaPlan(R, c) ? `<section class="sec"><span class="sec-tit">Cronograma de cuotas</span><div class="cajita">${cronograma(c, true)}</div></section>` : '';
  const saldo = venta && n.saldo > 0.009 ? `<div class="alert warn">${ic('alert')}<span class="alert-body"><b>Queda saldo por cobrar: ${moneda(n.saldo)}</b><span>Al guardar se abre la pestaña «Acciones» para seguir el cobro.</span></span></div>` : '';
  const hook = venta ? `<label class="webhook"><input type="checkbox" data-k="enviar_webhook" data-bool${R.enviar_webhook !== false ? ' checked' : ''}><span><b>Avisar por la automatización (n8n)</b><small>Dispara los mensajes automáticos al cliente y las notificaciones del equipo. Apagalo solo si ya avisaste vos o si es una venta de prueba.</small></span></label>` : '';
  const que = pago ? 'el pago' : 'la venta';
  const txt = frena ? 'Corregí los datos del cliente' : venta ? (rev.avisos.length ? `Registrar ${que} de todos modos` : `Registrar ${que}`) : 'Guardar el resultado';
  return `<div class="rev"><header><h3>${venta ? `Revisá ${que} antes de registrarl${pago ? 'o' : 'a'}` : 'Revisá el resultado antes de guardarlo'}</h3><p class="ayuda">Tocá «Editar» en cualquier dato para corregirlo.</p></header>
    ${hero}${caja(errores, 'err', errores.length === 1 ? 'Hay un dato que parece incorrecto' : `Hay ${errores.length} datos que parecen incorrectos`)}
    ${caja(avisos, 'warn', avisos.length === 1 ? 'Un dato para mirar' : `${avisos.length} datos para mirar`)}${secs}${plan}${detalles}${saldo}${hook}
    <div class="botonera">${botonesAtras()}<button class="btn btn-cta" data-act="guardar"${frena ? ' disabled' : ''}>${ic('checkc')} ${txt}</button></div></div>`;
}

function hecho() {
  const h = S.hecho;
  let linea = 'Resultado guardado'; let det = 'Ya podés cerrar la ficha.';
  if (h.venta && h.saldo > 0.009) { linea = `Queda un saldo de ${moneda(h.saldo)}`; det = 'El cobro sigue en «Acciones»: el plan, los pagos y los seguimientos.'; }
  else if (h.venta) { linea = 'Pagó todo: no queda saldo por cobrar'; det = 'Ya podés cerrar la ficha, o revisar el historial del cliente.'; }
  return `<div style="display:grid;gap:16px"><div class="alert ok">${ic('checkc', 20)}<span class="alert-body"><b>${linea}</b><span>${det}</span></span></div>
    <div class="botonera"><button class="btn btn-linea" data-act="reiniciar">${ic('rot')} Reportar otra (mockup)</button><button class="btn btn-linea">${ic('hist')} Ver historial</button>${h.venta ? `<button class="btn btn-cta">Ir a Acciones ${ic('right')}</button>` : ''}</div></div>`;
}

function recorrido(c) {
  if (!arrancado(S.R)) return `<aside class="reco"><h4>Recorrido</h4><p>Elegí qué pasó con la llamada (o «Registrar una venta») para ver todas las pantallas que tiene el camino.</p></aside>`;
  const camino = caminoActivo(S.R, c); const actual = preguntaActual(S.R, c);
  let grupo = ''; let html = '';
  camino.forEach((q, i) => {
    const g = ETAPA(q); if (g !== grupo) { grupo = g; html += `<div class="reco-g">${g}</div>`; }
    const est = contestada(q, S.R) ? 'hecho' : actual?.clave === q.clave ? 'actual' : '';
    const enun = resolver(q.enunciado, S.R, c);
    html += `<button class="reco-i ${est}" ${est === 'hecho' ? `data-act="editar" data-paso="${q.clave}"` : ''}><span class="n">${est === 'hecho' ? '✓' : i + 1}</span><span>${esc(enun)}</span><em>${q.tipo === 'formulario' ? 'form' : 'opciones'}</em></button>`;
  });
  const venta = camino.filter((q) => ETAPA(q) !== 'La llamada').length;
  return `<aside class="reco"><h4>Recorrido · ${camino.length} pantallas</h4><p>${esVenta(S.R) ? `${venta} son de la venta (antes eran 20 para un alumno nuevo con cuotas). ` : ''}Fecha, estado, «en la llamada» y notas ya no son pantallas: vienen puestos y se cambian en la revisión. Tocá una hecha para volver a ella.</p>${html}</aside>`;
}

// ======================================================================================
// Eventos
// ======================================================================================
function elegir(clave, valores) { S.R = responder(S.R, clave, valores); S.autofoco = true; }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const act = t.dataset.act; const c = contexto(); const v = t.dataset.v;
  if (!['escenario', 'recorrido'].includes(act)) S.clics += 1;
  switch (act) {
    case 'escenario': S.escenario = v; S.R = precargar(); S.hecho = null; S.leido = null; S.sugerido = ''; consultando = null; S.clics = 0; break;
    case 'recorrido': S.recorrido = !S.recorrido; break;
    case 'atajo': S.R = responder(responder(responder(responder(precargar(), 'res', { res: 'asistio' }), 'decisor', { with_decision_maker: true }), 'oferta', { offer_presented: true }), 'cierre', { cierre: true }); S.hecho = null; S.clics = 0; break;
    case 'raiz': elegir('res', { res: v }); break;
    case 'directa': S.R = { ...S.R, venta_directa: true }; break;
    case 'op': {
      const q = preguntaActual(S.R, c); const o = q.opciones[Number(t.dataset.i)];
      const val = { [q.campo]: o.valor };
      if (q.clave === 'que_registra' && o.valor === 'pago') { val.programa = c.programaCliente || undefined; val.tipo_pago_simple = 'Cuota'; val.sold_in_call = false; }
      if (q.clave === 'que_registra' && o.valor === 'venta') { delete S.R.programa; delete S.R.tipo_pago_simple; }
      if (q.clave === 'tipo_pago' && o.valor === 'completo' && !S.R.monto && c.estadoVenta?.program_price) val.monto = String(c.estadoVenta.program_price);
      if (q.clave === 'pago_que') { val.monto = o.cuota ? String(o.cuota.monto) : ''; val.selectedCuotaId = o.cuota?.id; }
      elegir(q.clave, val); break;
    }
    case 'continuar': { const q = preguntaActual(S.R, c); if (!faltantesDe(q, S.R, c).length) elegir(q.clave, {}); break; }
    case 'anterior': { const a = anterior(S.R, c); if (a) S.R = a; break; }
    case 'reiniciar': S.R = precargar(); S.hecho = null; S.leido = null; S.sugerido = ''; consultando = null; break;
    case 'preset': S.R[t.dataset.f] = v; break;
    case 'chip': S.R[t.dataset.f] = JSON.parse(v); if (t.dataset.f === 'refs_ask' && S.R.refs_ask === 'si' && !(S.R.refs_rows || []).length) S.R.refs_rows = [{ nombre: '', contacto: '' }]; break;
    case 'cont': S.R.num_cuotas = Math.max(1, Math.min(MAXIMO_CUOTAS, cantidadCuotas(S.R) + Number(t.dataset.d))); S.R.cuotaMontos = {}; break;
    case 'cont-set': S.R.num_cuotas = Number(v); S.R.cuotaMontos = {}; break;
    case 'dia': S.R.dia_de_pago = Number(v); break;
    case 'cuota': S.R.selectedCuotaId = Number(v); break;
    case 'repartir': S.R.cuotaMontos = {}; break;
    case 'ref-add': S.R.refs_rows = [...(S.R.refs_rows || []), { nombre: '', contacto: '' }]; break;
    case 'ref-del': S.R.refs_rows = S.R.refs_rows.filter((_, i) => i !== Number(t.dataset.i)); break;
    case 'editar': S.R = volverA(S.R, t.dataset.paso); S.autofoco = true; break;
    case 'guardar': S.hecho = { venta: esVenta(S.R), saldo: saldoVenta(S.R, c) }; break;
    default: return;
  }
  render();
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset?.k; if (!k) return;
  let m;
  if (e.target.dataset.bool !== undefined) S.R[k] = e.target.checked;
  else if ((m = k.match(/^ref-(\d+)-(\w+)$/))) S.R.refs_rows[Number(m[1])][m[2]] = e.target.value;
  else if ((m = k.match(/^cm-(\d+)$/))) S.R.cuotaMontos = { ...(S.R.cuotaMontos || {}), [m[1]]: e.target.value };
  else if ((m = k.match(/^cf-(\d+)$/))) S.R.cuotaFechas = { ...(S.R.cuotaFechas || {}), [m[1]]: e.target.value };
  else S.R[k] = e.target.value;
  if (k === 'followup_reminder_enabled' && S.R[k] && !S.R.followup_reminder_time) S.R.followup_reminder_time = '09:00';
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const b = document.querySelector('[data-act="continuar"]'); if (b && !b.disabled) b.click();
});
render();
</script>
</body>
</html>
