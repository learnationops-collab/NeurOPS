<!doctype html>
<html lang="es" data-tema="learnation" data-tema-modo="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi sueldo · herramienta · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../frontend/src/temas/temas.css">
<link rel="stylesheet" href="../../../frontend/src/temas/temas-unicos.css">
<link rel="stylesheet" href="../../../frontend/src/components/standard/standard.css">
<style>
:root{--acento:#ff3f9e;--ok:var(--ln-success,#3ecf8e);--warn:var(--ln-warning,#f5b84a);--mal:#f87171;--info:#5aa9ff;--lila:#b48cff;
  --linea:var(--ln-border-subtle,rgba(0,0,0,.08));--suave:var(--ln-inset-bg,rgba(0,0,0,.04));--tarjeta:var(--ln-popover-bg,#fff)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ln-page-bg);background-color:var(--ln-page-base);color:var(--ln-text-out);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:13.5px}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* Controles del mockup */
.mk{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:400;display:grid;gap:6px;padding:10px;border-radius:14px;
  background:var(--tarjeta);border:1px solid var(--linea);box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:11px;width:160px}
.mk b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ln-text-faint);margin-top:4px}
.mk button{all:unset;cursor:pointer;padding:6px 9px;border-radius:8px;font-weight:700;color:var(--ln-text-in);background:var(--suave)}
.mk button.on{background:var(--acento);color:#fff}
.mk p{margin:4px 0 0;color:var(--ln-text-muted);line-height:1.4}

/* Pantalla de fondo (atenuada) y dock */
.fondo{position:fixed;inset:0;padding:24px 200px;display:grid;gap:12px;align-content:start;opacity:.35;pointer-events:none}
.fondo i{display:block;height:70px;border-radius:16px;background:var(--suave);border:1px solid var(--linea)}
.fondo i.alto{height:300px}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:20px;z-index:50;
  background:var(--tarjeta);border:1px solid var(--linea);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.dock span{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--suave);font-size:16px}
.dock span.fijada{background:color-mix(in srgb,var(--ok) 18%,var(--tarjeta));outline:2px solid var(--ok)}
.velo{position:fixed;inset:0;background:rgba(10,10,20,.28);z-index:100}

/* Ventana */
/* No se monta sobre el panel del mockup (176 px a la izquierda) */
.ventana{position:fixed;left:max(196px,calc(50% - 520px));top:50%;transform:translateY(-50%);z-index:110;width:min(1040px,calc(100vw - 212px));height:min(720px,calc(100vh - 32px));display:flex;flex-direction:column;
  background:var(--tarjeta);border:1px solid var(--ln-border-main,var(--linea));border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.3);overflow:hidden}
.v-cab{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea)}
.v-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 18%,transparent);font-size:15px}
.v-cab h2{margin:0;font-size:14px;font-weight:900;color:var(--ln-text-in);flex:1}
.x{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ln-text-muted)}
.x:hover{background:var(--suave)}
.v-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
/* max-content: con overflow:hidden la caja de conceptos tiene mínimo 0 y la grilla la aplastaba */
.col-izq{overflow:auto;padding:16px 18px 18px;display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;border-right:1px solid var(--linea)}
.col-der{display:flex;flex-direction:column;min-height:0}
.p-cab{display:flex;align-items:center;gap:8px;padding:14px 18px 10px;flex-wrap:wrap}
.p-cab h3{margin:0;font-size:13px;font-weight:900;color:var(--ln-text-in);flex:1;min-width:0}
.p-cab h3 span{color:var(--ln-text-faint);font-weight:700}
.filtros{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px;border-bottom:1px solid var(--linea)}
.chipf{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--suave);color:var(--ln-text-muted)}
.chipf .pt{width:8px;height:8px}
.chipf.on{background:color-mix(in srgb,var(--c,var(--acento)) 20%,var(--tarjeta));color:var(--ln-text-in);box-shadow:inset 0 0 0 1px var(--c,var(--acento))}
.pagos{flex:1;overflow:auto;padding:0 18px}
.pagos table{width:100%;border-collapse:collapse;font-size:12px}
.pagos th{position:sticky;top:0;background:var(--tarjeta);text-align:left;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ln-text-faint);padding:10px 0 6px;border-bottom:1px solid var(--linea)}
.pagos td{padding:8px 0;border-bottom:1px solid var(--linea);color:var(--ln-text-out)}
.pagos .d{text-align:right;white-space:nowrap;padding-left:10px}
.pagos td.f{color:var(--ln-text-faint);width:48px}
.pagos .cpt{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ln-text-muted)}
.pagos .cpt .pt{width:7px;height:7px}
.p-pie{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:2px solid var(--linea);background:var(--suave);font-size:12px;color:var(--ln-text-muted)}
.p-pie b{color:var(--ln-text-in)}
.pagos tr.excl td{color:var(--ln-text-faint)}
.pagos tr.excl td.tch{text-decoration:line-through}
.marca{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;font-size:10px;font-weight:800;vertical-align:1px;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.pagos td small{display:block;color:var(--ln-text-faint);font-size:10.5px}
.reglas{margin:0;padding:0 0 0 16px;font-size:11.5px;color:var(--ln-text-muted);line-height:1.5;display:grid;gap:3px}
/* Pantallas chicas: una columna, los pagos abajo */
@media (max-width:980px){
  .mk{display:none}
  .ventana{left:16px;width:calc(100vw - 32px)}
}
@media (max-width:820px){
  .v-cuerpo{grid-template-columns:minmax(0,1fr);overflow:auto}
  .col-izq{overflow:visible;border-right:0;border-bottom:1px solid var(--linea)}
  .col-der{min-height:460px}
  .pagos th{position:static}
}
.vacio{padding:30px 0;text-align:center;color:var(--ln-text-faint);font-size:12px}

/* Selector de mes y de persona */
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mes{display:flex;align-items:center;gap:2px;padding:3px;border-radius:12px;background:var(--suave)}
.mes button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:900;color:var(--ln-text-muted)}
.mes button:hover:not(:disabled){background:var(--tarjeta)}
.mes button:disabled{opacity:.3;cursor:default}
.mes b{min-width:130px;text-align:center;font-size:12.5px;color:var(--ln-text-in)}
.persona{all:unset;cursor:pointer;margin-left:auto;padding:7px 12px;border-radius:12px;background:var(--suave);font-weight:700;font-size:12px;color:var(--ln-text-in)}
.persona[hidden]{display:none}
select.persona{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}

/* Total */
.total{display:grid;gap:4px}
.total small{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ln-text-faint)}
.total .n{font-size:34px;font-weight:900;color:var(--ln-text-in);line-height:1.1}
.total .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--ln-text-muted);font-size:12px}
.estado{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}

/* Barra apilada */
.apilada{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--suave)}
.apilada i{display:block;height:100%;transition:width .3s}

/* Conceptos */
.conceptos{display:grid;border:1px solid var(--linea);border-radius:14px;overflow:hidden}
/* minmax(0,1fr): sin esto la descripción empujaba el monto fuera de la caja en anchos chicos */
.fila{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:10px minmax(0,1fr) auto 36px 10px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.fila:hover{background:var(--suave)}
.fila.fija{cursor:default}
.fila.fija:hover{background:none}
.pt{width:10px;height:10px;border-radius:3px}
.fila .tx{display:grid;min-width:0}
.fila .tx b{font-size:13px;color:var(--ln-text-in)}
.fila .tx span{font-size:11.5px;color:var(--ln-text-muted);line-height:1.4;overflow-wrap:anywhere}
.fila .m{font-weight:800;color:var(--ln-text-in);text-align:right;white-space:nowrap}
.fila .m.neg{color:var(--mal)}
.fila .pc{font-size:11.5px;color:var(--ln-text-faint);text-align:right}
.fila .fl{color:var(--ln-text-faint);font-size:11px;transition:transform .2s}
.fila.sel{background:color-mix(in srgb,var(--c) 12%,var(--tarjeta));box-shadow:inset 3px 0 0 var(--c)}
.pie{display:grid;grid-template-columns:10px minmax(0,1fr) auto 36px 10px;white-space:nowrap;gap:10px;padding:12px 14px;border-top:2px solid var(--linea);background:var(--suave);font-weight:900;color:var(--ln-text-in)}

/* Historia */
.hist{display:grid;gap:8px}
.hist h3{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ln-text-faint)}
.meses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:120px}
.col{all:unset;cursor:pointer;display:grid;gap:5px;justify-items:center;align-content:end;height:100%}
.col .pila{width:34px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;gap:1px}
.col small{font-size:11px;color:var(--ln-text-muted);font-weight:700}
.col em{font-style:normal;font-size:11px;color:var(--ln-text-faint)}
.col.on small{color:var(--acento)}
/* «?» de Cómo se calcula: el texto aparece al pasar el mouse (o con foco, para teclado) */
.total-cab{display:flex;align-items:center;gap:6px}
.ayuda{position:relative;display:inline-flex}
.ayuda button{all:unset;cursor:help;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:900;
  background:var(--suave);color:var(--ln-text-muted);border:1px solid var(--linea)}
.ayuda:hover button,.ayuda button:focus-visible{background:var(--acento);color:#fff;border-color:var(--acento)}
.globo{position:absolute;left:-8px;top:calc(100% + 8px);z-index:20;width:340px;padding:12px 14px;border-radius:12px;
  background:var(--tarjeta);border:1px solid var(--ln-border-main,var(--linea));box-shadow:0 14px 34px rgba(0,0,0,.2);
  font-size:11.5px;line-height:1.5;color:var(--ln-text-muted);text-transform:none;letter-spacing:0;font-weight:500;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s}
.ayuda:hover .globo,.ayuda:focus-within .globo{opacity:1;visibility:visible;transform:none}
.globo b{display:block;margin-bottom:4px;color:var(--ln-text-in);font-size:12px}
.globo p{margin:6px 0 0}
.nota{margin:0;font-size:11.5px;color:var(--ln-text-muted);line-height:1.5;padding:10px 12px;border-radius:12px;background:var(--suave)}
</style>
</head>
<body>

<div class="mk">
  <b>Rol de la sesión</b>
  <button data-rol="closer" class="on">Closer</button>
  <button data-rol="setter">Setter</button>
  <button data-rol="director">Director comercial</button>
  <p>Cada uno ve lo suyo. El director, además, elige a cualquiera del equipo comercial.</p>
  <b>Mes</b>
  <p>Con ‹ › o tocando una barra de «Últimos meses».</p>
</div>

<div class="fondo"><i></i><i class="alto"></i><i></i></div>
<div class="dock"><span>🏠</span><span>📅</span><span>💬</span><span class="fijada" title="Mi sueldo, fijada">💵</span><span>🔧</span></div>
<div class="velo"></div>

<div class="ventana" role="dialog" aria-label="Mi sueldo">
  <div class="v-cab">
    <span class="v-ico">💵</span>
    <h2 id="titulo">Mi sueldo</h2>
    <button class="x" aria-label="Cerrar">✕</button>
  </div>
  <div class="v-cuerpo">
   <div class="col-izq">
    <div class="barra">
      <div class="mes">
        <button id="ant" aria-label="Mes anterior">‹</button>
        <b id="mesTx"></b>
        <button id="sig" aria-label="Mes siguiente">›</button>
      </div>
      <select id="quien" class="persona" hidden></select>
    </div>

    <div class="total">
      <span class="total-cab"><small id="totalRot">A cobrar</small>
        <span class="ayuda"><button type="button" aria-label="Cómo se calcula" aria-describedby="nota">?</button>
          <span class="globo" id="nota" role="tooltip"></span></span></span>
      <span class="n num" id="totalN"></span>
      <span class="sub" id="totalSub"></span>
    </div>

    <div class="apilada" id="apilada"></div>

    <div class="conceptos" id="conceptos"></div>

    <div class="hist">
      <h3>Últimos meses</h3>
      <div class="meses" id="meses"></div>
    </div>
   </div>
   <div class="col-der">
    <div class="p-cab"><h3 id="pTit"></h3></div>
    <div class="filtros" id="filtros"></div>
    <div class="pagos" id="pagos"></div>
    <div class="p-pie" id="pPie"></div>
   </div>
  </div>
</div>

<script>
// Reglas reales (app/services/nomina_service.py, comision_tasas_service.py, commission_service.py):
// · % sobre el cash NETO de cada pago completado o confirmado (fee real si está verificado, si no el promedio de la plataforma).
// · Setter 8%: pagos cuya agenda salió de él. Closer 10%: pagos donde figura como vendedor, de cualquier tipo.
// · Marlon: 10% de sus ventas propias + 5% como director de las de los otros closers, SIN renovaciones.
// · Cada pago con el % del mes en que entró. Sin comprobante se paga igual (marcado). Excluidas: se ven, no suman.
// · Sueldo base y bonos: la Nómina de Finanzas del mes. Descuentos: lo recibido por transferencia de un cliente.
// · Comisión escrita a mano en Finanzas: manda sobre la calculada (va como «Ajuste manual»).
const C = { base:'var(--info)', primer:'var(--acento)', cuotas:'var(--lila)', renov:'#ff9ecf', upsell:'#2dd4bf',
  propias:'var(--acento)', director:'var(--warn)', bono:'var(--ok)', ajuste:'#94a3b8' };
const MESES = ['2026-08','2026-09','2026-10','2026-11'];
const NOMBRE_MES = { '2026-08':'Agosto 2026','2026-09':'Septiembre 2026','2026-10':'Octubre 2026','2026-11':'Noviembre 2026' };
const CORTO = { '2026-08':'Ago','2026-09':'Sep','2026-10':'Oct','2026-11':'Nov' };
const ESTADO = { pagado:['Pagado','var(--ok)'], transito:['En camino','var(--info)'], pendiente:['Pendiente','var(--warn)'], curso:['Mes en curso','var(--acento)'] };
const ESTADOS = { '2026-08':'pagado','2026-09':'pagado','2026-10':'transito','2026-11':'curso' };
const ESCALA = { '2026-08':.8, '2026-09':.92, '2026-10':1.15, '2026-11':.7 };
const FEE = { Stripe:.055, Hotmart:.099, Transferencia:0 };
const MONTO = { Completo:[1800,2600], Parcial:[900,1300], 'Seña':[200,400], Cuota:[250,450], 'Renovación':[800,1200], Upsell:[500,900] };
const CONCEPTO_DE_TIPO = { Completo:'primer', Parcial:'primer', 'Seña':'primer', Cuota:'cuotas', 'Renovación':'renov', Upsell:'upsell' };
const POR_TIPO = [
  { k:'primer', t:'Primer pago', d:'Completo, parcial o seña de un cliente nuevo' },
  { k:'cuotas', t:'Cuotas', d:'Cuotas de ventas anteriores' },
  { k:'renov', t:'Renovaciones', d:'Clientes que renovaron' },
  { k:'upsell', t:'Upsells', d:'Un programa más a un cliente' },
];
const NOMBRES = ['Lucía M.','Andrés P.','Camila R.','Diego S.','Valentina G.','Martín L.','Sofía T.','Julián B.','Paula C.','Tomás F.',
  'Florencia D.','Mateo V.','Agustina N.','Bruno A.','Carla E.','Nicolás H.','Micaela O.','Federico I.','Renata Q.','Gonzalo U.'];
const CLOSERS = ['Jean Carlo','Facundo','Nerina','Gabriel'];

// Generador fijo: las mismas cifras cada vez que se abre.
const rng = (semilla) => { let h = 7; for (const ch of semilla) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return () => { h = (Math.imul(h, 1664525) + 1013904223) >>> 0; return h / 4294967296; }; };

function pagos(semilla, mes, cuantos, conCloser = false) {
  const r = rng(semilla + mes), lista = [], hasta = mes === '2026-11' ? 25 : 30;
  for (const [tipo, n] of Object.entries(cuantos)) {
    for (let i = 0; i < Math.round(n * ESCALA[mes]); i++) {
      const [a, b] = MONTO[tipo], metodo = r() < .6 ? 'Stripe' : r() < .75 ? 'Hotmart' : 'Transferencia';
      const bruto = Math.round(a + (b - a) * r()), u = r();
      lista.push({ dia: 1 + Math.floor(r() * hasta), cli: NOMBRES[Math.floor(r() * NOMBRES.length)], tipo,
        prog: ['RR','AL','SI'][Math.floor(r() * 3)], metodo, bruto, neto: bruto * (1 - FEE[metodo]),
        verif: u < .12 ? 'pending' : u < .16 ? 'unverified' : 'verified', excl: r() < .05,
        closer: conCloser ? CLOSERS[Math.floor(r() * 4)] : null });
    }
  }
  return lista;
}

const AJUSTES = { jeancarlo: { '2026-09': 1450 } }; // comisión escrita a mano en Finanzas
const BONOS = { jeancarlo: { '2026-10': 200 }, elias: { '2026-10': 100 }, marlon: { '2026-10': 500 } };
const TRANSF = { jeancarlo: { '2026-10': 320 }, facundo: { '2026-11': 450 } };

const porTipo = (id, m, pct, cuantos, sufijo = '') => {
  const todos = pagos(id, m, cuantos);
  return POR_TIPO.map(c => ({ ...c, d: c.d + sufijo, pct, pagos: todos.filter(p => CONCEPTO_DE_TIPO[p.tipo] === c.k) }));
};
const closer = (id, nombre, base) => ({ nombre, rol:'Closer', base, pct:10,
  partidas: (m) => porTipo(id, m, 10, { Completo:3, Parcial:2, 'Seña':1, Cuota:8, 'Renovación':3, Upsell:1 }) });
const setter = (id, nombre, base) => ({ nombre, rol:'Setter', base, pct:8,
  partidas: (m) => porTipo(id, m, 8, { Completo:4, Parcial:3, 'Seña':2, Cuota:7, 'Renovación':2, Upsell:1 }, ', de una agenda tuya') });

const PERSONAS = {
  elias: setter('elias', 'Elias', 400), paula: setter('paula', 'Paula', 400),
  jeancarlo: closer('jeancarlo', 'Jean Carlo', 500), facundo: closer('facundo', 'Facundo', 500),
  nerina: closer('nerina', 'Nerina', 500), gabriel: closer('gabriel', 'Gabriel', 500),
  marlon: { nombre:'Marlon', rol:'Director comercial', base:1000, partidas: (m) => {
    const otros = pagos('otros', m, { Completo:10, Parcial:6, 'Seña':3, Cuota:22, 'Renovación':6, Upsell:3 }, true);
    const afuera = otros.filter(p => p.tipo === 'Renovación').length;
    return [
      { k:'propias', t:'Ventas propias', d:'Lo que cerraste vos, de cualquier tipo', pct:10,
        pagos: pagos('marlon', m, { Completo:2, Parcial:1, Cuota:3, 'Renovación':1 }) },
      { k:'director', t:'Como director', d:`Pagos de los otros closers, sin renovaciones (${afuera} quedaron afuera)`,
        pct:5, pagos: otros.filter(p => p.tipo !== 'Renovación') },
    ];
  } },
};
const EQUIPO = { closer:['jeancarlo'], setter:['elias'], director:['marlon','elias','paula','jeancarlo','facundo','nerina','gabriel'] };

let rol = 'closer', quien = 'jeancarlo', mes = '2026-11', filtro = null;
const $ = (id) => document.getElementById(id);
const dinero = (n) => (n < 0 ? '−' : '') + 'US$ ' + Math.abs(Math.round(n)).toLocaleString('es-AR');
const comisionDe = (p, pct) => (p.excl ? 0 : p.neto * pct / 100);

function calcular(id, m) {
  const p = PERSONAS[id];
  const partidas = p.partidas(m).map(c => ({ ...c, m: c.pagos.reduce((t, x) => t + comisionDe(x, c.pct), 0) }))
    .filter(c => c.pagos.length);
  const calculada = partidas.reduce((t, c) => t + c.m, 0);
  const manual = AJUSTES[id]?.[m];
  const filas = [{ k:'base', t:'Sueldo base', d:'El fijo del mes, de la Nómina de Finanzas', m:p.base }, ...partidas];
  if (manual != null) filas.push({ k:'ajuste', t:'Ajuste manual', m: manual - calculada,
    d:`La comisión se escribió a mano en Finanzas: ${dinero(manual)} (el cálculo da ${dinero(calculada)})` });
  const bono = BONOS[id]?.[m] || 0;
  if (bono) filas.push({ k:'bono', t:'Bonos', d:'Cargados a mano en la Nómina de Finanzas', m:bono });
  const bruto = filas.reduce((t, c) => t + c.m, 0), desc = TRANSF[id]?.[m] || 0;
  return { p, filas, partidas, bruto, desc, neto: bruto - desc };
}

function filaHTML(c, bruto) {
  const conPagos = !!c.pagos, pct = bruto && c.m > 0 ? Math.round(c.m / bruto * 100) + '%' : '';
  const suman = conPagos ? c.pagos.filter(x => !x.excl) : [];
  const det = conPagos ? `${c.d} · ${suman.length} ${suman.length === 1 ? 'pago' : 'pagos'} · ${c.pct}% de ${dinero(suman.reduce((t, x) => t + x.neto, 0))} neto` : c.d;
  return `<button class="fila${conPagos ? '' : ' fija'}${filtro === c.k ? ' sel' : ''}" data-k="${conPagos ? c.k : ''}" style="--c:${C[c.k]}"
    title="${conPagos ? 'Ver solo estos pagos a la derecha' : ''}">
    <span class="pt" style="background:${C[c.k]}"></span>
    <span class="tx"><b>${c.t}</b><span>${det}</span></span>
    <span class="m num${c.m < 0 ? ' neg' : ''}">${dinero(c.m)}</span><span class="pc num">${pct}</span>
    <span class="fl">${conPagos ? '›' : ''}</span></button>`;
}

const MARCAS = { pending:['sin comprobante','var(--warn)'], unverified:['no cuadra','var(--mal)'] };
function pintarPagos(r) {
  const lista = r.partidas.filter(c => !filtro || c.k === filtro).flatMap(c => c.pagos.map(x => ({ c, x })))
    .sort((a, b) => a.x.dia - b.x.dia);
  const elegido = r.partidas.find(c => c.k === filtro);
  const suman = lista.filter(p => !p.x.excl);
  $('pTit').innerHTML = `${elegido ? elegido.t : 'Todos los pagos'} <span>· ${suman.length}</span>`;
  $('filtros').innerHTML = `<button class="chipf${filtro ? '' : ' on'}" data-k="">Todos</button>` +
    r.partidas.map(c => `<button class="chipf${filtro === c.k ? ' on' : ''}" data-k="${c.k}" style="--c:${C[c.k]}">
      <span class="pt" style="background:${C[c.k]}"></span>${c.t} · ${c.pagos.filter(x => !x.excl).length}</button>`).join('');
  $('pagos').innerHTML = lista.length ? `<table><thead><tr><th>Fecha</th><th>Cliente</th>
    <th class="d">Neto</th><th class="d">%</th><th class="d">Comisión</th></tr></thead><tbody>${lista.map(({ c, x }) => {
      const marca = x.excl ? ['fuera de la nómina', 'var(--ln-text-faint)'] : MARCAS[x.verif];
      const punto = filtro ? '' : `<span class="cpt"><span class="pt" style="background:${C[c.k]}"></span></span> `;
      return `<tr class="${x.excl ? 'excl' : ''}"><td class="f num">${String(x.dia).padStart(2, '0')}/${mes.slice(5)}</td>
      <td><span class="tch">${x.cli}</span>${marca ? `<span class="marca" style="--c:${marca[1]}">${marca[0]}</span>` : ''}
        <small>${punto}${x.prog} · ${x.tipo} · ${x.metodo}${x.closer ? ` · ${x.closer}` : ''}</small></td>
      <td class="d num tch">${dinero(x.neto)}<small>${x.metodo === 'Transferencia' ? 'sin fee' : `bruto ${dinero(x.bruto)}`}</small></td>
      <td class="d num">${c.pct}%</td>
      <td class="d num">${x.excl ? 'Excluida' : `<b>${dinero(comisionDe(x, c.pct))}</b>`}</td></tr>`;
    }).join('')}</tbody></table>`
    : '<p class="vacio">Sin pagos que den comisión este mes.</p>';
  const neto = suman.reduce((t, p) => t + p.x.neto, 0), com = suman.reduce((t, p) => t + comisionDe(p.x, p.c.pct), 0);
  const excl = lista.length - suman.length;
  $('pPie').innerHTML = `<span>${suman.length} ${suman.length === 1 ? 'pago' : 'pagos'}${excl ? ` (+${excl} ${excl === 1 ? 'excluido' : 'excluidos'})` : ''} · neto <b class="num">${dinero(neto)}</b></span><span>Comisión <b class="num">${dinero(com)}</b></span>`;
}

function reglas(p) {
  const propias = p.rol === 'Director comercial'
    ? ['Tus ventas cobran tu % de closer (10%), de cualquier tipo.', 'Las de los otros closers te pagan 5% como director, sin contar renovaciones.',
      'Cada pago te paga de una sola manera: como closer si lo cerraste vos, como director si lo cerró otro.']
    : p.rol === 'Closer'
      ? [`Cobrás el ${p.pct}% de cada pago donde figurás como vendedor: primer pago, cuotas, renovaciones y upsells.`]
      : [`Cobrás el ${p.pct}% de cada pago de un cliente cuya agenda salió de vos (o, sin agenda, donde figurás como setter de la venta).`];
  return [...propias,
    'El % es sobre el neto: lo que entró después de la comisión de Stripe o Hotmart. Una transferencia no paga comisión.',
    'Cada pago usa el % del mes en que entró. Uno sin comprobante se paga igual y queda marcado; uno sacado de la nómina se ve tachado y no suma.'];
}

function pintar() {
  const r = calcular(quien, mes), propio = quien === EQUIPO[rol][0];
  $('titulo').textContent = propio ? 'Mi sueldo' : `Sueldo de ${r.p.nombre}`;
  $('mesTx').textContent = NOMBRE_MES[mes];
  $('ant').disabled = mes === MESES[0];
  $('sig').disabled = mes === MESES[MESES.length - 1];

  const sel = $('quien');
  sel.hidden = rol !== 'director';
  sel.innerHTML = EQUIPO.director.map(id => `<option value="${id}"${id === quien ? ' selected' : ''}>${id === 'marlon' ? 'Yo' : PERSONAS[id].nombre} · ${PERSONAS[id].rol}</option>`).join('');

  const curso = ESTADOS[mes] === 'curso', [estTx, estC] = ESTADO[ESTADOS[mes]];
  $('totalRot').textContent = curso ? 'Llevás este mes' : 'Cobraste';
  $('totalN').textContent = dinero(r.neto);
  $('totalSub').innerHTML = `<span class="estado" style="--c:${estC}">${estTx}</span>` +
    (r.desc ? `<span>${dinero(r.bruto)} − ${dinero(r.desc)} que recibiste por transferencia</span>` : '') + `<span>${r.p.rol}</span>`;

  const positivas = r.filas.filter(c => c.m > 0), suma = positivas.reduce((t, c) => t + c.m, 0);
  $('apilada').innerHTML = positivas.map(c => `<i style="width:${c.m / suma * 100}%;background:${C[c.k]}" title="${c.t}"></i>`).join('');

  let html = r.filas.map(c => filaHTML(c, r.bruto)).join('');
  if (r.desc) html += `<div class="fila fija"><span class="pt" style="background:var(--mal)"></span>
    <span class="tx"><b>Descuentos</b><span>Plata de un cliente que entró a tu cuenta por transferencia: ya la tenés</span></span>
    <span class="m neg num">${dinero(-r.desc)}</span><span class="pc"></span><span></span></div>`;
  html += `<div class="pie"><span></span><span>${curso ? 'A cobrar hasta hoy' : 'Total'}</span><span class="num">${dinero(r.neto)}</span><span></span><span></span></div>`;
  $('conceptos').innerHTML = html;

  const max = Math.max(...MESES.map(m => calcular(quien, m).bruto));
  $('meses').innerHTML = MESES.map(m => {
    const x = calcular(quien, m), pos = x.filas.filter(c => c.m > 0);
    return `<button class="col${m === mes ? ' on' : ''}" data-m="${m}">
      <em class="num">${dinero(x.neto).replace('US$ ', '')}</em>
      <span class="pila" style="height:${x.bruto / max * 80}px">${pos.map(c => `<i style="flex:${c.m};background:${C[c.k]}"></i>`).join('')}</span>
      <small>${CORTO[m]}</small></button>`;
  }).join('');

  pintarPagos(r);
  $('nota').innerHTML = `<b>Cómo se calcula</b><ul class="reglas">${reglas(r.p).map(x => `<li>${x}</li>`).join('')}</ul>` +
    `<p>${curso ? 'El mes está en curso: suma lo cobrado hasta hoy y puede cambiar.' : 'Es lo que se liquidó ese mes. Si algo no te cierra, avisale a Marlon.'}</p>`;
}

document.querySelectorAll('.mk [data-rol]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.mk [data-rol]').forEach(x => x.classList.toggle('on', x === b));
  rol = b.dataset.rol; quien = EQUIPO[rol][0]; filtro = null; pintar();
});
$('quien').onchange = (e) => { quien = e.target.value; filtro = null; pintar(); };
$('ant').onclick = () => { mes = MESES[MESES.indexOf(mes) - 1]; filtro = null; pintar(); };
$('sig').onclick = () => { mes = MESES[MESES.indexOf(mes) + 1]; filtro = null; pintar(); };
$('meses').onclick = (e) => { const c = e.target.closest('[data-m]'); if (c) { mes = c.dataset.m; filtro = null; pintar(); } };
$('conceptos').onclick = (e) => {
  const f = e.target.closest('[data-k]'); if (!f || !f.dataset.k) return;
  filtro = filtro === f.dataset.k ? null : f.dataset.k; pintar();
};
$('filtros').onclick = (e) => { const f = e.target.closest('[data-k]'); if (f) { filtro = f.dataset.k || null; pintar(); } };
pintar();
</script>
</body>
</html>
