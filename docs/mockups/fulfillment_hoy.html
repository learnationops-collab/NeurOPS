<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fulfillment hoy · mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mockup de la pestaña «Fulfillment» de la ficha TAL COMO ES HOY (TabFulfillment.jsx, AccesoAcademia,
   SuscripcionWork, VentasWork, fulfillment.js). Mismos textos, mismo orden y los mismos casos que
   arma el backend (ficha_fulfillment_service.py). Tema Modern oscuro. */
:root{
  --bg:#020617; --page:linear-gradient(135deg,#020617 0%,#0A0E3D 50%,#05082D 100%);
  --el:rgba(255,255,255,.08); --el-2:rgba(255,255,255,.04); --inset:rgba(0,0,0,.30);
  --text:#fff; --muted:rgba(255,255,255,.60); --faint:rgba(255,255,255,.40);
  --b1:rgba(255,255,255,.06); --b2:rgba(255,255,255,.15); --b3:rgba(255,255,255,.38);
  --brand:#FF3FA4; --flot:#0B1030;
  --ok:#2FBF8F; --ok-s:#071A24; --ok-b:#10413D;
  --warn:#D9A441; --warn-s:#1A171C; --warn-b:#473924;
  --bad:#E85C4A; --bad-s:#1B0F1D; --bad-b:#4C2227;
  --info:#4E8BD8; --info-s:#0A152C; --info-b:#1A3155;
  --idle:#7F8CA8; --idle-s:#0E1326; --idle-b:#252C42;
  --aqua:#2EE6C8; --amber:#FFB547; --lilac:#7D8BFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--page);background-attachment:fixed;color:var(--text);
  font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2,h3,p{margin:0}
.mut{color:var(--muted)} .faint{color:var(--faint)} .mono{font-variant-numeric:tabular-nums}

.mk{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 24px;background:rgba(2,6,23,.9);
  backdrop-filter:blur(10px);border-bottom:1px dashed var(--b2)}
.mk .tag{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#020617;background:var(--amber);padding:3px 8px;border-radius:6px}
.mk b{font-size:13px} .mk .sp{flex:1}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--inset);border:1px solid var(--b1);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-weight:600;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.12);color:var(--text)}
.mk-btn{border:1px solid var(--b2);background:var(--el-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:12px}
.mk-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.nota-mk{max-width:1120px;margin:16px auto 0;padding:0 24px;font-size:12.5px;color:var(--muted);line-height:1.6}
.nota-mk b{color:var(--text)}

/* origen de cada bloque */
body.marcar [data-src]{position:relative;outline:1.5px dashed var(--c);outline-offset:4px;border-radius:12px}
body.marcar [data-src]::before{content:attr(data-src);position:absolute;top:-10px;right:8px;z-index:5;font-size:8.5px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--c);color:#020617}
[data-src="academia en vivo"]{--c:var(--lilac)} [data-src="work"]{--c:var(--aqua)} [data-src="work + academia"]{--c:var(--amber)}

.lay{padding:24px 16px 80px;display:flex;justify-content:center}
.modal{width:min(1120px,100%);border-radius:32px;background:rgba(2,6,23,.92);border:1px solid var(--b2);box-shadow:0 30px 80px -30px rgba(19,35,198,.5)}
.cab{margin:20px 20px 16px;padding:18px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 70%);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cab h2{font-size:26px;font-weight:900;letter-spacing:-.025em}
.cab-d{display:flex;gap:36px;flex-wrap:wrap}
.cab-d div{display:grid;gap:4px}
.cab-d small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.cab-d b{font-size:15px;font-weight:600}
.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--b1);overflow-x:auto;scrollbar-width:none}
.tab{position:relative;padding:11px 0 10px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--brand);font-weight:700}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}
.panel{padding:20px;display:grid;gap:16px}

/* piezas */
.pnl{padding:20px 24px;border-radius:16px;background:var(--el);border:1px solid var(--b2);display:grid;gap:14px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.rot{display:inline-flex;align-items:center;gap:6px}
.rot small{font-size:12px;color:var(--muted)}
.i{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--b3);font-size:9px;font-weight:800;color:var(--muted);cursor:help}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--b2);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok-b);background:var(--ok-s)} .chip.warn{color:var(--warn);border-color:var(--warn-b);background:var(--warn-s)}
.chip.bad{color:var(--bad);border-color:var(--bad-b);background:var(--bad-s)} .chip.idle{color:var(--idle);border-color:var(--idle-b);background:var(--idle-s)}
.btn{height:34px;padding:0 14px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--b3);background:transparent;color:var(--muted)}
.btn svg{width:13px;height:13px}
.consulta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acceso{border-left:3px solid var(--c)}
.acc-tit{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-tit p{font-size:20px;font-weight:900}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.dato{display:grid;gap:4px}
.dato b{font-size:15px;font-weight:700}
.gest{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--s);border:1px solid var(--bb)}
.alert svg{width:18px;height:18px;color:var(--c);margin-top:1px}
.alert .body{flex:1;display:grid;gap:4px}
.alert b{font-size:14px} .alert small{font-size:12.5px;color:var(--muted)}
.a-warn{--s:var(--warn-s);--bb:var(--warn-b);--c:var(--warn)} .a-bad{--s:var(--bad-s);--bb:var(--bad-b);--c:var(--bad)}
.sec{border-radius:16px;border:1px solid var(--b1);background:var(--el-2)}
.sec>button{width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;border:0;background:none;text-align:left}
.sec>button b{font-size:16px;font-weight:800}
.sec>button small{flex:1;color:var(--muted);font-size:13px}
.sec.abierta>button svg{transform:rotate(180deg)}
.sec-c{display:none;padding:0 20px 18px;gap:12px}
.sec.abierta .sec-c{display:grid}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:8px 6px;border-bottom:1px solid var(--b1)}
td{padding:9px 6px;border-bottom:1px solid var(--b1);vertical-align:top}
.sub{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.sub button{border:0;background:none;padding:0;color:var(--muted);font-size:11.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.secciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
.met{display:grid;gap:4px}
.met .v{font-size:22px;font-weight:900}
.barra{height:5px;border-radius:5px;background:var(--b1);overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--lilac))}
.coment{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--b1)}
.coment p{font-size:13px;line-height:1.5}
.vacio{display:grid;justify-items:center;gap:10px;text-align:center;padding:32px 16px}
.vacio .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--el)}
.vacio .ico svg{width:26px;height:26px}
.vacio p.t{font-size:20px;font-weight:900}
.vacio p.d{max-width:560px;font-size:13.5px;color:var(--muted);line-height:1.6}
.huesos{display:grid;gap:12px}
.hueso{height:22px;border-radius:8px;background:linear-gradient(90deg,var(--el-2),var(--el),var(--el-2));background-size:200% 100%;animation:h 1.2s infinite}
@keyframes h{to{background-position:-200% 0}}
.form-p{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--inset);border:1px solid var(--b1)}
.form-p input,.form-p textarea{width:100%;min-height:38px;padding:8px 12px;border-radius:12px;border:1px solid var(--b2);background:var(--inset)}
</style>
</head>
<body>
<div class="mk">
  <span class="tag">Hoy</span><b>Fulfillment · como es hoy</b>
  <span class="sp"></span>
  <div class="seg" id="casos"></div>
  <button class="mk-btn" id="marcar" aria-pressed="false">Ver de dónde viene cada bloque</button>
</div>
<p class="nota-mk" id="nota"></p>
<div class="lay"><div class="modal" id="app"></div></div>

<script>
const P = {
  refresh: '<path d="M21 12a9 9 0 0 0-9-9 9.8 9.8 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5M3 12a9 9 0 0 0 9 9 9.8 9.8 0 0 0 6.7-2.7L21 16"/><path d="M16 16h5v5"/>',
  alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/>',
  grad: '<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  calclock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5M16 2v4M8 2v4M3 10h5"/><circle cx="16" cy="16" r="6"/><path d="M16 14v2l1 1"/>',
  at: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  arrow: '<path d="M5 12h14M12 5l7 7-7 7"/>',
};
const ic = (n) => `<svg viewBox="0 0 24 24">${P[n] || ''}</svg>`;
const src = (t) => ` data-src="${t}"`;
const i = (t) => `<span class="i" title="${t.replace(/"/g, '&quot;')}">i</span>`;

// Los textos de las «i» (fulfillment.js · AYUDA_ACCESO).
const AYUDA = {
  programa: 'El programa que pagó según NeurOPS: el mismo que ves en Acciones → Programa. Sale del prefijo (AL, RR o SI) del tipo de pago de su última venta.',
  producto: 'El producto de la Academia vinculado a ese programa. El vínculo lo configura un admin en Configuración de Ventas → Integraciones.',
  vence: 'Día en que la Academia le corta el acceso a este producto. NeurOPS lo fija al darle el acceso: 7 días para una seña, 4 meses para un pago completo o parcial; después solo la mueven una venta nueva o una prórroga.',
  dias: 'Días de acceso que le quedan, contados por la Academia. Con 15 o menos se marca «Por vencer»: es la ventana para renovar, no cuando ya venció.',
  asignado: 'Cuándo se le asignó este producto en la Academia, desde NeurOPS o a mano allá.',
  sena: 'La Academia tiene este acceso marcado como reserva (seña): un acceso de cortesía corto hasta que complete el pago.',
  correo: 'El correo con el que entra a la Academia. Es la única forma de cruzarlo con NeurOPS: la Academia no busca por teléfono.',
  telefono: 'El teléfono que tiene cargado la Academia. No sirve para encontrarlo, pero conviene que coincida con el de acá: es por donde se le escribe.',
  consultado: 'Estos datos se le piden a la Academia en vivo cada vez que abrís esta pestaña (o tocás Actualizar).',
  gestionar: 'El acceso lo da la venta: acá no se elige una fecha. Prórroga le da días sin pago (seña o cortesía, con motivo). Corregir mail cambia el correo con que entra. Quitar lo hace vencer hoy.',
};

// ---------- los casos (lo que arma ficha_fulfillment_service.py) ----------
const BASE = {
  nombre: 'María Fernanda López', programa: 'Residency Roadmap', tel: '+52 771 396 6588', email: 'mfernanda.lopez@gmail.com',
  producto: { nombre: 'Residency Roadmap · 4 meses', vence: '14 feb 2027', dias: '109 días', asignado: '14 oct 2026', estado: ['Vigente', 'ok'], sena: false },
  susc: [['14 oct', 'Alta', '14 feb', 'Venta RR parcial', 'Jean Carlo'], ['20 oct', 'Extensión', '14 feb', 'Pago de cuota', 'Work']],
  ventas: [['Residency Roadmap', '14 oct 2026', '$1,800', '$1,000', '$800', ['Activa', 'ok'], '—', 2]],
  metricas: true, comentarios: true, cuentaTel: '+52 771 396 6588', otros: [['Bienvenida a Learnation', 'Sin vencimiento', 'Vigente']], activoOtro: null, aviso: null, error: null, vinculado: true,
};
const CASOS = {
  vigente: { label: 'Alumna al día', ...BASE,
    nota: 'El caso completo: <b>lo que pagó</b>, los dos bloques de <b>Work</b> (suscripción y ventas), las <b>métricas</b>, los <b>comentarios</b> del equipo de la Academia, la <b>cuenta</b> y los <b>otros accesos</b>. Nueve bloques, uno debajo del otro.' },
  porvencer: { label: 'Por vencer', ...BASE,
    producto: { ...BASE.producto, vence: '7 nov 2026', dias: '10 días', asignado: '7 jul 2026', estado: ['Por vencer', 'warn'] },
    susc: [['7 jul', 'Alta', '7 nov', 'Venta RR completo', 'Kerwin']],
    ventas: [['Residency Roadmap', '7 jul 2026', '$1,800', '$1,800', '$0', ['Activa', 'ok'], '—', 1]],
    activoOtro: 'Bienvenida a Learnation', cuentaTel: '+52 771 000 1111',
    nota: 'Le quedan 10 días: el chip pasa a <b>Por vencer</b> y los días se pintan en ámbar. Además la Academia tiene otro producto como activo y el teléfono no coincide: son dos avisos chicos, en texto, y la pestaña no dice qué hacer con la renovación.' },
  sena: { label: 'Seña', ...BASE,
    producto: { nombre: 'Residency Roadmap · seña', vence: '4 nov 2026', dias: '7 días', asignado: '28 oct 2026', estado: ['Por vencer', 'warn'], sena: true },
    susc: [['28 oct', 'Seña', '4 nov', 'Venta RR seña', 'Jean Carlo']],
    ventas: [['Residency Roadmap', '28 oct 2026', '$1,800', '$200', '$1,600', ['Activa', 'ok'], '—', 1]],
    metricas: false, comentarios: false, otros: [],
    nota: 'Dejó una seña: acceso de 7 días con el chip <b>Seña</b>. La Academia todavía no mandó métricas. Lo que debe aparece recién en el bloque Ventas, abajo.' },
  noalumna: { label: 'Todavía no es alumna', ...BASE, vinculado: false,
    nota: 'Pagó, pero la Academia no encuentra ninguna cuenta con sus correos. El texto dice «Se lo podés dar acá mismo», pero el único botón es <b>Corregir mail</b>: no hay un «Dar acceso» directo.' },
  sinproducto: { label: 'Sin el producto pagado', ...BASE, producto: null,
    aviso: 'La Academia no le tiene asignado Residency Roadmap, que es el programa que pagó: hasta que se lo asignen no ve ese contenido.',
    otros: [['Bienvenida a Learnation', 'Sin vencimiento', 'Vigente'], ['Ace Learner (cortesía)', '2 nov 2026', '5 días']],
    nota: 'Tiene cuenta, pero no el producto que pagó. El aviso pide «Dar acceso, acá abajo», pero acá abajo solo hay <b>Corregir mail</b>.' },
  error: { label: 'La Academia no responde', ...BASE, error: 'La Academia recibió demasiadas consultas por minuto. Probá de nuevo en un rato.',
    nota: 'La Academia no contestó: queda el error con <b>Reintentar</b> y abajo solo lo que registra Work (suscripción y ventas).' },
};

const S = { caso: 'vigente', abiertas: new Set(['ventas']), form: null };

function seccion(id, titulo, resumen, cuerpo, origen) {
  const ab = S.abiertas.has(id);
  return `<div class="sec ${ab ? 'abierta' : ''}"${src(origen)}><button data-sec="${id}"><b>${titulo}</b><small>${resumen}</small>${ic('chev')}</button><div class="sec-c">${cuerpo}</div></div>`;
}

function gestion(c, conAcceso) {
  if (S.form === 'prorroga') {
    return `<div class="form-p"><b>Prórroga</b><div class="seg"><button aria-pressed="true">Seña · 7 días</button><button>1 mes</button><button>Otra</button></div>
      <small class="mut">Hasta el 21 feb 2027.</small><textarea placeholder="Ej.: está por completar el pago de la seña"></textarea>
      <div class="gest"><button class="btn" data-form="">Volver</button><button class="btn" style="background:var(--brand);color:#020617;border-color:var(--brand)">Dar prórroga</button></div></div>`;
  }
  if (S.form === 'mail') {
    return `<div class="form-p"><small class="mut">El correo con el que entra a la Academia. Si tiene una venta con acceso vigente, el acceso pasa a esa cuenta.</small>
      <input value="${c.email}"><div class="gest"><button class="btn" data-form="">Volver</button><button class="btn" style="background:var(--brand);color:#020617;border-color:var(--brand)">Guardar mail</button></div></div>`;
  }
  return `<div class="gest">
    ${conAcceso ? `<button class="btn" data-form="prorroga">${ic('calclock')}Prórroga</button>` : ''}
    <button class="btn" data-form="mail">${ic('at')}Corregir mail</button>
    ${conAcceso ? `<button class="btn">${ic('trash')}Quitar acceso</button>` : ''}
    ${i(AYUDA.gestionar)}</div>`;
}

function accesoPagado(c) {
  const p = c.producto;
  const tono = p ? `var(--${p.estado[1] === 'ok' ? 'ok' : p.estado[1] === 'warn' ? 'warn' : 'bad'})` : 'var(--b3)';
  return `<section class="pnl acceso" style="--c:${tono}"${src('work + academia')}>
    <span class="rot"><span class="eyebrow">Lo que pagó</span>${i(AYUDA.programa)}</span>
    <div class="acc-tit"><p>${c.programa}</p>${p ? `<span class="chip ${p.estado[1]}">${p.estado[0]}</span>` : ''}${p?.sena ? `<span class="chip warn">Seña</span>${i(AYUDA.sena)}` : ''}</div>
    ${p ? `<div class="datos">
      <div class="dato"><span class="rot"><small>Producto en la Academia</small>${i(AYUDA.producto)}</span><b>${p.nombre}</b></div>
      <div class="dato"><span class="rot"><small>Vence</small>${i(AYUDA.vence)}</span><b>${p.vence}</b></div>
      <div class="dato"><span class="rot"><small>Días restantes</small>${i(AYUDA.dias)}</span><b style="${p.estado[1] !== 'ok' ? `color:var(--${p.estado[1]})` : ''}">${p.dias}</b></div>
      <div class="dato"><span class="rot"><small>Asignado</small>${i(AYUDA.asignado)}</span><b>${p.asignado}</b></div></div>` : ''}
    ${c.aviso ? `<div class="alert a-warn">${ic('alert')}<div class="body"><b>${c.aviso}</b><small>Asignáselo con «Dar acceso», acá abajo.</small></div></div>` : ''}
    ${c.activoOtro ? `<small style="font-size:12px;color:var(--warn)">La Academia tiene como producto activo «${c.activoOtro}», no el que pagó.</small>` : ''}
    ${gestion(c, !!p)}
  </section>`;
}

function deWork(c) {
  const susc = c.susc.map(([f, q, v, m, w]) => `<tr><td>${f}</td><td>${q}</td><td>${v}</td><td>${m}</td><td>${w}</td></tr>`).join('');
  const ventas = c.ventas.map(([p, f, t, co, sa, est, n, np]) => `<tr><td><b>${p}</b><div class="sub"><button>Ver pagos (${np})</button><span>Suscripción: ${c.producto?.nombre || p} hasta el ${c.producto?.vence || '—'}</span></div></td>
    <td>${f}</td><td>${t}</td><td>${co}</td><td style="color:${sa === '$0' ? 'var(--ok)' : 'var(--bad)'}">${sa}</td><td><span class="chip ${est[1]}">${est[0]}</span></td><td>${n}</td></tr>`).join('');
  const debe = c.ventas.reduce((a, v) => a + Number(v[4].replace(/[$,]/g, '')), 0);
  return seccion('susc', 'Suscripción en Work', `${c.susc[0][2] ? `Vence el ${c.producto?.vence || c.susc[c.susc.length - 1][2]}` : ''} · ${c.susc.length} cambio${c.susc.length > 1 ? 's' : ''}`,
    `<p class="mut" style="font-size:12.5px">Lo que Work registra del acceso: la venta lo abre (7 días si es seña), los pagos y las renovaciones lo extienden, y la Academia puede dar prórrogas. Cada cambio queda acá.</p>
     <div style="display:flex;gap:8px;align-items:center"><b>${c.programa}</b><span class="chip ok">Hasta el ${c.producto?.vence || '14 feb 2027'}</span>${c.producto?.sena ? '<span class="chip warn">Seña</span>' : ''}</div>
     <table><tr><th>Cuándo</th><th>Qué</th><th>Vencimiento</th><th>Motivo</th><th>Quién</th></tr>${susc}</table>`, 'work')
    + seccion('ventas', 'Ventas', `${c.ventas.length} venta${c.ventas.length > 1 ? 's' : ''} · debe $${debe.toLocaleString('en-US')}`,
      `<p class="mut" style="font-size:12.5px">Cada venta con lo acordado (o el precio de lista de su época), lo cobrado y lo que falta. Una venta cancelada no debe nada; sus pagos siguen contando como cobrados.</p>
       <table><tr><th>Programa</th><th>Fecha</th><th>Total</th><th>Cobrado</th><th>Saldo</th><th>Estado</th><th>Nota</th></tr>${ventas}</table>
       <div><button class="btn">Cancelar venta</button></div>`, 'work');
}

function metricas() {
  const S2 = [
    ['Actividad', [['Horas de estudio', '18 h'], ['Pomodoros', '41'], ['Racha', '5 días'], ['Vistas de lecciones', '63']]],
    ['Avance', [['Lecciones completadas', '22 de 140', 16], ['Progreso según la Academia', '16%', 16]]],
    ['Ejecuciones', [['Ejecuciones entregadas', '3'], ['Tasa de aprobación', '67%']]],
    ['Acompañamiento y soporte', [['Sesiones grupales', '2'], ['Sesiones 1 a 1', '0'], ['Tickets abiertos', '1', null, true]]],
  ];
  return `<div class="secciones"${src('academia en vivo')}>${S2.map(([t, ms]) => `<section class="pnl"><span class="rot"><span class="eyebrow">${t}</span>${i('Qué mide, en qué unidad y quién lo calcula.')}</span>
    <div class="metricas">${ms.map(([l, v, b, al]) => `<div class="met"><span class="rot"><small>${l}</small>${i(l)}</span><span class="v" style="${al ? 'color:var(--warn)' : ''}">${v}</span>${b ? `<span class="barra"><i style="width:${b}%"></i></span>` : ''}</div>`).join('')}</div></section>`).join('')}</div>`;
}

function render() {
  const c = CASOS[S.caso];
  document.getElementById('casos').innerHTML = Object.entries(CASOS).map(([k, v]) => `<button data-caso="${k}" aria-pressed="${S.caso === k}">${v.label}</button>`).join('');
  document.getElementById('nota').innerHTML = c.nota;
  const tabs = ['Resultado', 'Acciones', 'Fulfillment', 'Historial', 'Bitácora', 'Formulario', 'Comunicación'];
  let cuerpo = `<div class="consulta"${src('academia en vivo')}><span class="rot"><small>Datos de la Academia al mar 28 oct · 15:20</small>${i(AYUDA.consultado)}</span>
    <button class="btn">${ic('refresh')}Actualizar</button></div>`;
  if (c.error) {
    cuerpo += `<div class="alert a-bad"${src('academia en vivo')}>${ic('alert')}<div class="body"><b>${c.error}</b></div><button class="btn">${ic('refresh')}Reintentar</button></div>${deWork(c)}`;
  } else if (!c.vinculado) {
    cuerpo += `<div class="vacio"${src('work + academia')}><span class="ico">${ic('grad')}</span><p class="t">Este cliente todavía no es alumno en la Academia</p>
      <p class="d">No hay ninguna cuenta con ninguno de sus correos: mfernanda.lopez@gmail.com, maferlopez@hotmail.com. Pagó Residency Roadmap: ese es el acceso que le corresponde. Se lo podés dar acá mismo.</p>
      ${gestion(c, false)}</div>${deWork(c)}`;
  } else {
    cuerpo += accesoPagado(c) + deWork(c);
    cuerpo += c.metricas ? metricas() : '<p class="mut" style="font-size:13px"' + src('academia en vivo') + '>La Academia no mandó métricas de desempeño para este alumno.</p>';
    cuerpo += `<section class="pnl"${src('academia en vivo')}><span class="eyebrow">Comentarios del equipo de la Academia${c.comentarios ? ' · 2' : ''}</span>
      ${c.comentarios ? `<div class="coment"><small class="mut">22 oct · 12:10 · Laura · Tutoría</small><p>Viene bien con el plan de estudio; pidió más simulacros.</p></div>
        <div class="coment"><small class="mut">16 oct · 09:30 · Marcos · Onboarding</small><p>Hizo la bienvenida y armó su cronograma de estudio.</p></div>`
      : '<p class="mut" style="font-size:13px">Nadie del equipo de la Academia anotó nada sobre este alumno todavía.</p>'}</section>`;
    cuerpo += `<section class="pnl"${src('academia en vivo')}><span class="eyebrow">Cuenta en la Academia</span><b>${c.nombre}</b>
      <div class="datos"><div class="dato"><span class="rot"><small>Correo</small>${i(AYUDA.correo)}</span><b>${c.email}</b></div>
      <div class="dato"><span class="rot"><small>Teléfono</small>${i(AYUDA.telefono)}</span><b style="${c.cuentaTel !== c.tel ? 'color:var(--warn)' : ''}">${c.cuentaTel}</b></div></div>
      ${c.cuentaTel !== c.tel ? `<small style="font-size:12px;color:var(--warn)">El teléfono en la Academia no coincide con el de acá (${c.tel}).</small>` : ''}</section>`;
    if (c.otros.length) {
      cuerpo += seccion('otros', 'Otros accesos en la Academia', `${c.otros.length} · no es lo que pagó`,
        `<p class="mut" style="font-size:12.5px">Productos que también tiene asignados en la Academia: el curso de bienvenida que la Academia le da a todo alumno nuevo, o accesos que alguien le dio a mano.</p>
        <table><tr><th>Producto</th><th>Vence</th><th>Estado</th></tr>${c.otros.map(([p, v, e]) => `<tr><td>${p}</td><td>${v}</td><td style="color:var(--ok);font-weight:700">${e}</td></tr>`).join('')}</table>`, 'academia en vivo');
    }
  }
  document.getElementById('app').innerHTML = `<div class="cab"><h2>${c.nombre}</h2><div class="cab-d">
      <div><small>Programa</small><b>${c.programa}</b></div><div><small>Ingresó</small><b>${S.caso === 'porvencer' ? '7 jul 2026' : S.caso === 'sena' ? '28 oct 2026' : '14 oct 2026'}</b></div>
      <div><small>Closer</small><b>Jean Carlo</b></div><div><small>Teléfono</small><b>${c.tel}</b></div></div></div>
    <div class="tabs">${tabs.map((t) => `<button class="tab" aria-selected="${t === 'Fulfillment'}">${t}</button>`).join('')}</div>
    <div class="panel">${cuerpo}</div>`;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-caso],[data-sec],[data-form],#marcar');
  if (!t) return;
  if (t.dataset.caso) { S.caso = t.dataset.caso; S.form = null; }
  else if (t.dataset.sec) { const id = t.dataset.sec; S.abiertas.has(id) ? S.abiertas.delete(id) : S.abiertas.add(id); }
  else if (t.dataset.form !== undefined) S.form = t.dataset.form || null;
  else if (t.id === 'marcar') { const on = document.body.classList.toggle('marcar'); t.setAttribute('aria-pressed', on); }
  render();
});
render();
</script>
</body>
</html>
